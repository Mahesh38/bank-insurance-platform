name: Application CI

on:
  pull_request:
    paths:
      - "services/**"
      - "libs/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/application-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "libs/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-coverage:
    name: Java 21 tests and coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit, integration and coverage verification
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
          if-no-files-found: warn
          retention-days: 14
