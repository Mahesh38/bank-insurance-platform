name: Governance daily sign-off (AIGEM)

# Every day: run every governance check, refresh the generated views, and open (or refresh)
# ONE pull request that lists every decision waiting on a named human. A human reviews,
# ticks the checklist, approves and merges. The workflow never approves, never merges, and
# never edits CURRENT-STATE.yaml, GATE-EVIDENCE.yaml, registers or change requests.
#
# Report generator: scripts/governance/daily-governance-report.py
# Runbook:          docs/governance/RUNBOOK.md section 3, Daily
#
# One-time repository setup:
#   * Settings → Actions → General → "Allow GitHub Actions to create and approve pull
#     requests" must be enabled, or `gh pr create` is refused with GITHUB_TOKEN.
#   * Optional secret GOVERNANCE_BOT_TOKEN (fine-grained PAT: contents + pull requests,
#     read/write on this repository). Pull requests opened with GITHUB_TOKEN do not trigger
#     other workflows, so without it governance.yml does not run on the sign-off PR; this
#     workflow has already run the same checks and records them in the report.

on:
  schedule:
    # 01:17 UTC = 06:47 IST, before the working day. Off the hour so the run is not queued
    # behind every other scheduled workflow on GitHub.
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: governance-daily
  cancel-in-progress: false

env:
  BRANCH: governance/daily-signoff
  LABEL: human-signoff
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  daily-signoff:
    name: Daily AIGEM sign-off PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # artefact ages come from git history
          token: ${{ secrets.GOVERNANCE_BOT_TOKEN || github.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml jsonschema

      - name: Run checks, refresh generated views, write the report
        run: >
          python3 scripts/governance/daily-governance-report.py --write
          --pr-body "$RUNNER_TEMP/pr-body.md"
          --pr-title "$RUNNER_TEMP/pr-title.txt"

      - name: Guard — the refreshed tree still passes governance CI
        run: |
          python3 scripts/context/build-boot-capsule.py --check
          python3 scripts/context/build-doc-map.py --check
          python3 scripts/governance/ci-checks.py --quiet

      - name: Open or refresh the sign-off pull request
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          title="$(cat "$RUNNER_TEMP/pr-title.txt")"
          git config user.name "aigem-governance-bot"
          git config user.email "$BOT_EMAIL"

          # A human who pushed to the sign-off branch owns it until it is merged or closed:
          # never force-push over their commits. Post today's report as a comment instead.
          human_commits=""
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch --quiet origin "$BRANCH"
            human_commits="$(git log --format='%ae' "origin/main..origin/$BRANCH" | grep -vxF "$BOT_EMAIL" || true)"
          fi
          pr="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"

          if [ -n "$human_commits" ]; then
            echo "::warning::$BRANCH carries human commits; not overwriting. Today's report goes in as a comment."
            if [ -n "$pr" ]; then
              gh pr comment "$pr" --body-file "$RUNNER_TEMP/pr-body.md"
            fi
            exit 0
          fi

          git checkout -B "$BRANCH"
          git add -A docs/
          if git diff --cached --quiet; then
            echo "Nothing changed since the last report."
            exit 0
          fi
          git commit --quiet -m "governance: AIGEM daily sign-off report $(date -u +%F)" \
            -m "Generated by .github/workflows/governance-daily.yml. Human review and sign-off required."
          git push --force origin "$BRANCH"

          gh label create "$LABEL" --color D93F0B \
            --description "Needs a named human's review and sign-off" --force >/dev/null || true
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" \
              --body-file "$RUNNER_TEMP/pr-body.md" --label "$LABEL"
          fi

      - name: Job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pr-body.md" ]; then cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"; fi
