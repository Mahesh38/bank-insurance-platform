name: Knowledge Hub

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/docs/**"
      - "settings.gradle.kts"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/knowledge-hub.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/docs/**"
      - "settings.gradle.kts"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/knowledge-hub.yml"

permissions:
  contents: read

jobs:
  build:
    name: Generate and build static knowledge hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Generate live repository views
        run: python scripts/docs/generate_knowledge_base.py

      - name: Build knowledge hub
        run: mkdocs build --strict

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-insurance-knowledge-hub
          path: site/
          if-no-files-found: error
          retention-days: 14
