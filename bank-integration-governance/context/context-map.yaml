# Context routing — product-repo paths -> lane -> pack (rule CX-1).
# Paths are relative to the product repository root (mahesh38/bank-insurance-platform).
# First matching route wins for a file; a change spanning lanes loads each lane's Summary.

schema: context-map/v1
product_repo: "mahesh38/bank-insurance-platform"

budgets_bytes:
  tier0: 4096
  pack: 10240
  card: 2560
  default_load: 25600

routes:
  - lane: integration-hub
    pack: packs/integration-hub.md
    maker: engineering
    paths:
      - "services/1sb-integration-service/**"
      - "services/integration-hub-service/**"
      - "services/direct-insurer-adapter-service/**"
      - "docs/1sb-insurance-integration/**"
    keywords: [1sb, onesb, insurer, quote api, proposal api, lob handler, adapter, integration hub, apigee egress]

  - lane: persistence-audit
    pack: packs/persistence-audit.md
    maker: engineering
    paths:
      - "services/bank-persistence-service/**"
      - "services/audit-compliance-service/**"
      - "docs/platform/data-architecture/**"
    keywords: [persistence, flyway, migration, schema, audit store, job store, outbox, aurora, postgres]

  - lane: workforce-identity
    pack: packs/workforce-identity.md
    maker: engineering
    paths:
      - "services/workforce-access-bff/**"
      - "services/identity-provider-adapter-service/**"
      - "services/identity-authorization-service/**"
      - "libs/bank-common-security/**"
      - "docs/platform/authentication-authorization/**"
    keywords: [login, keycloak, cognito, ad, token, session, rbac, abac, pdp, maker-checker, identity]

  - lane: distribution-journey
    pack: packs/distribution-journey.md
    maker: analyst
    paths:
      - "services/lead-service/**"
      - "services/customer-service/**"
      - "services/consent-service/**"
      - "services/suitability-service/**"
      - "services/product-catalogue-service/**"
      - "services/journey-orchestration-service/**"
      - "services/quotation-service/**"
      - "services/proposal-service/**"
      - "services/payment-service/**"
      - "services/policy-issuance-service/**"
      - "services/reporting-mis-service/**"
      - "services/administration-config-service/**"
      - "services/notification-service/**"
      - "docs/au-bank-insurance-platform/**"
      - "docs/journey-execution/**"
    keywords: [lead, consent, suitability, quote, proposal, payment, policy, issuance, ulip, term, brd, rm journey, mis]

  - lane: experience-bff
    pack: packs/experience-bff.md
    maker: architecture
    paths:
      - "docs/platform/ws3-platform/0[7-9]-*"
      - "docs/platform/ws3-platform/*.openapi.yaml"
      - "docs/figma/**"
    keywords: [bff, nip, figma, screen, scr-, customer search, landing]

  - lane: platform
    pack: packs/platform.md
    maker: reliability
    paths:
      - ".github/workflows/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "config/**"
      - "libs/bank-common-observability/**"
      - "libs/bank-common-secrets/**"
      - "docs/architecture/**"
    keywords: [ci, pipeline, terraform, iac, environment, uat, vpn, direct connect, transit gateway, firewall, secrets, observability, slo, cost]

  - lane: governance
    pack: null            # this repository is its own context
    maker: flow-steward
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/governance/**"
      - "docs/context/**"
      - ".claude/**"
    keywords: [governance, process, persona, triage, wip, cadence]

fallback:
  lane: null
  load: [AGENTS.md]
  note: "No route matched: load Tier 0 only and ask which capability the request concerns."
