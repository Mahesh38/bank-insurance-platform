# ci-components' own pipeline. GLM-001 M7.8.
#
# A component library that is not itself tested is a library of untested YAML.
stages: [validate, release]

lint-components:
  stage: validate
  image: python:3.12-alpine
  tags: ["general"]
  before_script:
    - pip install --quiet pyyaml
  script:
    - python3 tests/validate-components.py
  allow_failure: false

# Publishing to the CI/CD catalog requires a tagged release.
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags: ["general"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "ci-components $CI_COMMIT_TAG"
