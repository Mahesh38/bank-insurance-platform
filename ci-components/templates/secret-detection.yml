# Secret detection. GLM-001 M7.2. Ported from security-scanning.yml.
#
# Two jobs, deliberately asymmetric — the same asymmetry the GitHub workflow had:
#   tree    blocking, on every pipeline
#   history scheduled, and NOT blocking day to day
#
# IMP-6 is what changed: before the FIRST PUSH to a bank estate the history scan
# is blocking and must be clean (C-SEC-1). After cutover it returns to scheduled.
# RISK-024: the scan is meaningless on a shallow clone, so the job asserts depth.
spec:
  inputs:
    stage:
      default: validate
    gitleaks_version:
      default: "8.21.2"      # pinned; same version the GitHub workflow used
    runner_tag:
      default: "security"
    config:
      default: ".gitleaks.toml"
---

.gitleaks_install: &gitleaks_install
  - |
    set -euo pipefail
    curl -sSfL -o /tmp/gitleaks.tar.gz \
      "https://github.com/gitleaks/gitleaks/releases/download/v$[[ inputs.gitleaks_version ]]/gitleaks_$[[ inputs.gitleaks_version ]]_linux_x64.tar.gz"
    tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
    chmod +x /tmp/gitleaks
    /tmp/gitleaks version

"secret-detection":
  stage: $[[ inputs.stage ]]
  image: alpine:3.20
  tags: ["$[[ inputs.runner_tag ]]"]
  before_script:
    - apk add --no-cache curl tar bash
  script:
    - *gitleaks_install
    - /tmp/gitleaks dir . --config "$[[ inputs.config ]]" --redact --exit-code 1
      --report-format sarif --report-path gitleaks-tree.sarif
  artifacts:
    when: always
    paths: [gitleaks-tree.sarif]
    expire_in: 90 days      # C-CMP-3
  allow_failure: false

"secret-detection-history":
  stage: $[[ inputs.stage ]]
  image: alpine:3.20
  tags: ["$[[ inputs.runner_tag ]]"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $SECRET_HISTORY_BLOCKING == "true"    # set for the pre-migration gate
  before_script:
    - apk add --no-cache curl tar bash git python3
  script:
    # RISK-024 — a shallow clone that scans clean proves nothing.
    - |
      set -euo pipefail
      if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
        echo "FAIL: this is a SHALLOW clone. A history scan here is not evidence."
        echo "Set GIT_DEPTH: 0 on this job, or unshallow before scanning (RISK-024)."
        exit 1
      fi
      echo "OK: full clone, $(git rev-list --count --all) commits across all refs"
    - *gitleaks_install
    # --log-opts=--all so every ref is covered, not only the checked-out branch.
    - /tmp/gitleaks git . --config "$[[ inputs.config ]]" --log-opts="--all" --redact
      --exit-code 1 --report-format sarif --report-path gitleaks-history.sarif
  variables:
    GIT_DEPTH: 0
  artifacts:
    when: always
    paths: [gitleaks-history.sarif]
    expire_in: 90 days
  allow_failure: false
