# =============================================================================
# Secrets source — configurable by environment
#
# Dev/local:   PROPERTIES or ENV (application-local properties / .env)
# UAT:         ENV or AWS_SECRETS_MANAGER (until SM is wired, ENV/properties OK)
# Prod:        AWS_SECRETS_MANAGER (required)
#
# NEVER commit real API keys/secrets. Partner UAT credentials are temporary only.
# =============================================================================

insurance:
  secrets:
    # PROPERTIES | ENV | AWS_SECRETS_MANAGER
    source: ${INSURANCE_SECRETS_SOURCE:PROPERTIES}

    # Keys resolved from the active source (same logical names everywhere)
    keys:
      api-key: onesb.api-key
      api-secret: onesb.api-secret
      distributor-id: onesb.distributor-id

    properties:
      # Used when source=PROPERTIES (local/testing only)
      # Example application-local.properties (gitignored):
      #   onesb.api-key=***
      #   onesb.api-secret=***
      #   onesb.distributor-id=BCIBL
      location: classpath:/application-local.properties

    env:
      api-key: ONESB_API_KEY
      api-secret: ONESB_API_SECRET
      distributor-id: ONESB_DISTRIBUTOR_ID

    aws-secrets-manager:
      # Used when source=AWS_SECRETS_MANAGER
      region: ${AWS_REGION:ap-south-1}
      # One secret JSON or separate secrets — adapter maps fields
      secret-id: ${ONESB_AWS_SECRET_ID:onesb/uat/credentials}
      # Expected JSON keys inside secret (example):
      # { "apiKey": "...", "apiSecret": "...", "distributorId": "BCIBL" }
      json-key-api-key: apiKey
      json-key-api-secret: apiSecret
      json-key-distributor-id: distributorId

---
# Profile hints (documentation only — wire in Spring profiles)
# spring.profiles.active=local  → INSURANCE_SECRETS_SOURCE=PROPERTIES
# spring.profiles.active=uat    → INSURANCE_SECRETS_SOURCE=ENV or AWS_SECRETS_MANAGER
# spring.profiles.active=prod   → INSURANCE_SECRETS_SOURCE=AWS_SECRETS_MANAGER
