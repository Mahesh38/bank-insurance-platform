  - id: S15
    name: "Operate, Evolve & Continuous Assurance"
    aigem_stage: "L10"
    owner: "Shivanshi (SRE) + Rajal (Product)"
    default_priority: P3
    epics:
      - id: S15-E01
        title: "Operate"
        owner: "Shivanshi"
        stories:
          - id: S15-E01-S01
            title: "Run the SLO reporting cadence"
            acceptance_criteria: "SLO attainment and error budget consumption reported on a fixed rhythm to Product and Delivery"
          - id: S15-E01-S02
            title: "Run incident management"
            acceptance_criteria: "Every incident classified, responded to within target, and recorded"
          - id: S15-E01-S03
            title: "Run blameless postmortems"
            acceptance_criteria: "For every O0 and O1, within 5 working days, with action items in the backlog"
          - id: S15-E01-S04
            title: "Track and reduce toil"
            acceptance_criteria: "Toil measured; automation prioritised against it"
          - id: S15-E01-S05
            title: "Manage capacity proactively"
            acceptance_criteria: "Trend-based forecasting; the Q4 tax-season peak planned for, not reacted to"
          - id: S15-E01-S06
            title: "Exit hypercare deliberately"
            acceptance_criteria: "Against the stated criteria, with a handover to steady-state operation"
      - id: S15-E02
        title: "Business operation"
        owner: "Rajal"
        stories:
          - id: S15-E02-S01
            title: "Report KPIs against the S00 outcomes"
            acceptance_criteria: "Conversion, drop-off by step, time-to-issue, reconciliation completeness, RM adoption"
          - id: S15-E02-S02
            title: "Compare against the legacy baseline"
            acceptance_criteria: "Prove the business case, or discover it is not proving"
          - id: S15-E02-S03
            title: "Run the exception operations process"
            acceptance_criteria: "Unreconciled payments, failed issuance, stuck journeys — owned, queued, resolved"
          - id: S15-E02-S04
            title: "Gather user feedback systematically"
            acceptance_criteria: "From RMs and customers, routed into the backlog through triage"
      - id: S15-E03
        title: "Continuous assurance"
        owner: "Shailja + Deepali"
        stories:
          - id: S15-E03-S01
            title: "Run periodic control attestation"
            acceptance_criteria: "Each control C1–C10 re-evidenced on a defined cadence, not assumed to still operate"
          - id: S15-E03-S02
            title: "Run continuous security scanning"
            acceptance_criteria: "SAST, SCA, image and infrastructure scanning on a schedule as well as per change"
          - id: S15-E03-S03
            title: "Refresh the threat model"
            acceptance_criteria: "On any trust-boundary change, and at least annually"
          - id: S15-E03-S04
            title: "Run periodic access review"
            acceptance_criteria: "Who has access to what, in production and in the data stores; revoke by exception"
          - id: S15-E03-S05
            title: "Monitor regulatory change"
            acceptance_criteria: "Named owner, defined cadence, and a route from change to backlog"
          - id: S15-E03-S06
            title: "Verify retention and purge operation"
            acceptance_criteria: "Data disposed of at the horizon; immutability intact for what remains"
          - id: S15-E03-S07
            title: "Re-verify residency"
            acceptance_criteria: "On any infrastructure change"
      - id: S15-E04
        title: "Evolve"
        owner: "Rajal + Mahesh + Amit"
        stories:
          - id: S15-E04-S01
            title: "Run the triage pipeline continuously"
            acceptance_criteria: "Every input classified through AIGEM; nothing enters the backlog untriaged"
          - id: S15-E04-S02
            title: "Run the unpark sweep"
            acceptance_criteria: "At every stage transition and on a periodic cadence; parked items re-triaged, never auto-admitted"
          - id: S15-E04-S03
            title: "Repay technical debt"
            acceptance_criteria: "A standing allocation per increment, prioritised by the ledger"
          - id: S15-E04-S04
            title: "Run architecture evolution review"
            acceptance_criteria: "Drift from intended architecture detected and either corrected or consciously accepted"
          - id: S15-E04-S05
            title: "Maintain the documentation canon"
            acceptance_criteria: "Staleness limits enforced; stale canonical documents are a defect, not a backlog nicety"
          - id: S15-E04-S06
            title: "Maintain the governance framework"
            acceptance_criteria: "AIGEM and this bible reviewed; changes via CR"
