  - id: S10
    name: "Integration & Connectivity"
    aigem_stage: "L5"
    owner: "Amit (Engineering) + Mahesh (Architecture)"
    default_priority: P2
    epics:
      - id: S10-E01
        title: "Integration catalogue and governance"
        owner: "Mahesh + Kalpana"
        stories:
          - id: S10-E01-S01
            title: "Catalogue every external dependency"
            acceptance_criteria: "System, owner, protocol, environments, SLA, escalation contact, contract reference"
          - id: S10-E01-S02
            title: "Establish access to every sandbox"
            acceptance_criteria: "Credentials, IP allowlisting and connectivity proven from our egress, per environment"
          - id: S10-E01-S03
            title: "Define the dependency criticality tier"
            acceptance_criteria: "Which failures stop a sale, which degrade it, which are invisible to the customer"
          - id: S10-E01-S04
            title: "Track integration readiness as a delivery dependency"
            acceptance_criteria: "Each with a required-by date; overdue items escalate under Kalpana's decision-forcing authority"
      - id: S10-E02
        title: "Aggregator integration (1SB)"
        owner: "Amit"
        stories:
          - id: S10-E02-S01
            title: "HTTP client with auth, timeouts and no-retry on 401"
            acceptance_criteria: "Single HTTP stack; credentials from secrets management"
          - id: S10-E02-S02
            title: "Error normalisation to the bank problem model"
            acceptance_criteria: "Provider error shapes never surface to bank callers"
          - id: S10-E02-S03
            title: "Async job and polling infrastructure"
            acceptance_criteria: "Shared across quote and proposal; multi-instance safe"
          - id: S10-E02-S04
            title: "LOB routing behind ports"
            acceptance_criteria: "Adding an LOB requires no orchestration change"
          - id: S10-E02-S05
            title: "Raw payload capture, encrypted"
            acceptance_criteria: "For every provider exchange, retained per the retention schedule"
          - id: S10-E02-S06
            title: "Idempotency on mutating operations"
            acceptance_criteria: "Replay produces the original result, never a duplicate effect"
      - id: S10-E03
        title: "Core banking integration (CBS)"
        owner: "Amit"
        stories:
          - id: S10-E03-S01
            title: "Customer lookup by CIF"
            acceptance_criteria: "ETB identification with the fields the journey needs"
          - id: S10-E03-S02
            title: "KYC and demographic retrieval for pre-fill"
            acceptance_criteria: "Only fields with a stated purpose; classification honoured"
          - id: S10-E03-S03
            title: "Relationship verification"
            acceptance_criteria: "Confirms the ETB eligibility rule"
          - id: S10-E03-S04
            title: "Define degraded behaviour when CBS is unavailable"
            acceptance_criteria: "Product decision recorded: block, or proceed with manual capture"
      - id: S10-E04
        title: "Payment gateway integration"
        owner: "Amit + Deepali"
        stories:
          - id: S10-E04-S01
            title: "Payment session and link generation"
            acceptance_criteria: "Link issued to the customer's device only — never rendered on an RM device"
          - id: S10-E04-S02
            title: "Payment status callback handling"
            acceptance_criteria: "Authenticated, replay-protected, integrity-verified"
          - id: S10-E04-S03
            title: "Status reconciliation by polling"
            acceptance_criteria: "Callback loss cannot leave a payment in unknown state indefinitely"
          - id: S10-E04-S04
            title: "Handle the uncertain-payment case"
            acceptance_criteria: "Defined behaviour when payment state cannot be determined; never a double charge"
          - id: S10-E04-S05
            title: "Refund and failure paths"
            acceptance_criteria: "Per the S03 payment rules"
      - id: S10-E05
        title: "Identity integration"
        owner: "Amit + Deepali"
        stories:
          - id: S10-E05-S01
            title: "Bank AD federation for workforce identity"
            acceptance_criteria: "Behind the provider adapter; no provider type leaks"
          - id: S10-E05-S02
            title: "Token-hiding BFF session"
            acceptance_criteria: "The client never receives OAuth tokens"
          - id: S10-E05-S03
            title: "Customer authentication for DIY journeys"
            acceptance_criteria: "Digital banking SSO for ETB"
          - id: S10-E05-S04
            title: "Certification metadata retrieval"
            acceptance_criteria: "SP licence validity available to the attribution rule"
      - id: S10-E06
        title: "Notification integration"
        owner: "Amit"
        stories:
          - id: S10-E06-S01
            title: "SMS delivery for OTP and payment links"
            acceptance_criteria: "Delivery status tracked; failures visible"
          - id: S10-E06-S02
            title: "Email delivery for documents and confirmations"
            acceptance_criteria: "Attachment handling; bounce handling"
          - id: S10-E06-S03
            title: "Template management with versioning"
            acceptance_criteria: "Regulated content versioned like any other regulated artefact"
      - id: S10-E07
        title: "Resilience"
        owner: "Shivanshi + Amit"
        stories:
          - id: S10-E07-S01
            title: "Timeouts on every external call"
            acceptance_criteria: "No unbounded call anywhere; values justified by the NFR sheet"
          - id: S10-E07-S02
            title: "Retry with backoff and jitter, where safe"
            acceptance_criteria: "Only on idempotent operations; never on 401; bounded attempts"
          - id: S10-E07-S03
            title: "Circuit breakers per dependency"
            acceptance_criteria: "Trip thresholds and recovery defined; state observable"
          - id: S10-E07-S04
            title: "Bulkhead isolation"
            acceptance_criteria: "One slow provider cannot exhaust shared resources"
          - id: S10-E07-S05
            title: "Rate limiting toward providers"
            acceptance_criteria: "Respects contracted limits; never amplifies under retry"
          - id: S10-E07-S06
            title: "Dependency health observability"
            acceptance_criteria: "Availability, latency and error rate per provider, measured from our side"
    validation_tests:
      - id: S10-VT-01
        validates: "Happy path works per integration"
        method: "Sandbox call"
        pass_condition: "Success with the expected payload"
      - id: S10-VT-02
        validates: "Timeouts are enforced"
        method: "Stub a provider that never responds"
        pass_condition: "Call times out at the configured value; caller gets a normalised error"
      - id: S10-VT-03
        validates: "Malformed responses are handled"
        method: "Stub invalid JSON, truncated payloads, wrong content type"
        pass_condition: "No crash; normalised error; nothing corrupted"
      - id: S10-VT-04
        validates: "Auth failure does not retry-storm"
        method: "Stub 401"
        pass_condition: "No retry; alert raised"
      - id: S10-VT-05
        validates: "Circuit breaker trips and recovers"
        method: "Stub sustained failure, then recovery"
        pass_condition: "Breaker opens, half-opens, closes; state observable"
      - id: S10-VT-06
        validates: "Idempotency holds"
        method: "Replay a mutating request 5×"
        pass_condition: "One effect, identical response"
      - id: S10-VT-07
        validates: "Payment uncertainty is safe"
        method: "Stub a callback that never arrives"
        pass_condition: "Reconciliation resolves state; no double charge"
      - id: S10-VT-08
        validates: "Provider types do not leak"
        method: "ArchUnit"
        pass_condition: "No provider type outside its adapter package"
      - id: S10-VT-09
        validates: "Credentials rotate without outage"
        method: "Rotate in UAT"
        pass_condition: "Calls continue"
      - id: S10-VT-10
        validates: "Rate limits are respected"
        method: "Drive load beyond contracted limits"
        pass_condition: "Requests shaped locally; provider limit never breached"
    exit_gate:
      - id: S10-G1
        criterion: "Integration catalogue complete with owners and SLAs"
        evidence_level: "E1"
        evidence_artefact: "Catalogue"
      - id: S10-G2
        criterion: "Connectivity proven to every R0 dependency in UAT"
        evidence_level: "E4"
        evidence_artefact: "Successful calls with correlation IDs"
      - id: S10-G3
        criterion: "Error normalisation verified for every integration"
        evidence_level: "E4"
        evidence_artefact: "Test results including malformed and timeout cases"
      - id: S10-G4
        criterion: "Resilience patterns implemented and proven"
        evidence_level: "E4"
        evidence_artefact: "Failure-injection test results"
      - id: S10-G5
        criterion: "Idempotency proven on every mutating operation"
        evidence_level: "E4"
        evidence_artefact: "Replay test results"
      - id: S10-G6
        criterion: "Credentials in secrets management; rotation exercised"
        evidence_level: "E3"
        evidence_artefact: "Rotation record"
      - id: S10-G7
        criterion: "Third-party security assessment complete per partner"
        evidence_level: "E2"
        evidence_artefact: "Assessment records"
      - id: S10-G8
        criterion: "Dependency observability live"
        evidence_level: "E4"
        evidence_artefact: "Dashboards per provider"
      - id: S10-G9
        criterion: "Provider isolation enforced by fitness function"
        evidence_level: "E4"
        evidence_artefact: "ArchUnit run"

  - id: S11
    name: "Vertical Slice (MVP)"
    aigem_stage: "L6"
    owner: "Rajal (Product) + Amit (Engineering)"
    default_priority: P1
    epics:
      - id: S11-E01
        title: "Journey orchestration"
        owner: "Amit + Mahesh"
        stories:
          - id: S11-E01-S01
            title: "Implement the journey state machine"
            acceptance_criteria: "States and transitions per the S06 saga; state durable and resumable"
          - id: S11-E01-S02
            title: "Implement compensations"
            acceptance_criteria: "Every failure point has its designed compensation, tested"
          - id: S11-E01-S03
            title: "Implement save and resume"
            acceptance_criteria: "An abandoned journey resumes with full context, subject to consent and quote validity"
          - id: S11-E01-S04
            title: "Emit journey telemetry"
            acceptance_criteria: "Every state transition emits a metric and an audit event"
      - id: S11-E02
        title: "Lead and customer"
        owner: "Amit"
        stories:
          - id: S11-E02-S01
            title: "Create a lead"
            acceptance_criteria: "RM-initiated, attributed to RM and branch"
          - id: S11-E02-S02
            title: "Identify the ETB customer via CBS"
            acceptance_criteria: "CIF lookup; relationship verified; ETB rule enforced"
          - id: S11-E02-S03
            title: "Snapshot the customer profile"
            acceptance_criteria: "Only classified, purpose-justified fields; provenance recorded"
      - id: S11-E03
        title: "Suitability, consent and the compliance gates"
        owner: "Amit + Shailja"
        stories:
          - id: S11-E03-S01
            title: "Implement the need-analysis questionnaire"
            acceptance_criteria: "Per the S02 suitability pack; answers persisted with the algorithm version"
          - id: S11-E03-S02
            title: "Implement suitability evaluation"
            acceptance_criteria: "Deterministic; produces an evaluation ID with a validity window"
          - id: S11-E03-S03
            title: "Implement the suitability hard-gate (C1)"
            acceptance_criteria: "Quote endpoints return 403 without a valid evaluation ID. Negative test at 100% branch coverage"
          - id: S11-E03-S04
            title: "Implement override handling"
            acceptance_criteria: "Per the S02 rules; override recorded with actor, reason and disclosure"
          - id: S11-E03-S05
            title: "Implement consent capture (C2)"
            acceptance_criteria: "OTP to the customer's device; append-only record of statement text, version, CIF, OTP txn ID, timestamp, IP"
          - id: S11-E03-S06
            title: "Implement consent enforcement"
            acceptance_criteria: "Proposal cannot proceed without valid consent; negative test"
          - id: S11-E03-S07
            title: "Implement attribution (C3)"
            acceptance_criteria: "distributorId and SP licence server-injected; caller-supplied values rejected; expired certification blocks the sale"
      - id: S11-E04
        title: "Quote and proposal"
        owner: "Amit"
        stories:
          - id: S11-E04-S01
            title: "Generate a quote for the Term product"
            acceptance_criteria: "Through the existing 1SB path, now behind the suitability gate"
          - id: S11-E04-S02
            title: "Present the quote with disclosed basis"
            acceptance_criteria: "Comparison and ranking basis visible per the S05 design"
          - id: S11-E04-S03
            title: "Enforce quote validity"
            acceptance_criteria: "Expired quotes cannot be proposed against"
          - id: S11-E04-S04
            title: "Capture the proposal"
            acceptance_criteria: "Dynamic form per product; pre-filled from CIF; validated per the rules catalogue"
          - id: S11-E04-S05
            title: "Handle underwriting outcomes"
            acceptance_criteria: "Accepted, counter-offered, rejected, and pending — each with a defined actor experience"
          - id: S11-E04-S06
            title: "Upload and manage documents"
            acceptance_criteria: "Classified, encrypted, retained per schedule"
      - id: S11-E05
        title: "Payment and issuance"
        owner: "Amit + Deepali"
        stories:
          - id: S11-E05-S01
            title: "Implement payment device isolation (C4)"
            acceptance_criteria: "Link or QR to the customer's device; the RM app never renders a payment surface. Negative test"
          - id: S11-E05-S02
            title: "Handle payment status"
            acceptance_criteria: "Callback plus reconciliation polling; unknown state resolves within a defined window"
          - id: S11-E05-S03
            title: "Trigger and confirm policy issuance"
            acceptance_criteria: "Insurer confirmation received and persisted"
          - id: S11-E05-S04
            title: "Reconcile premium to policy"
            acceptance_criteria: "Both directions; unreconciled items surface on an operations queue"
          - id: S11-E05-S05
            title: "Implement the \"policy sold\" determination"
            acceptance_criteria: "All four conditions — issued, confirmed, reconciled, persisted"
          - id: S11-E05-S06
            title: "Deliver the policy document"
            acceptance_criteria: "COI generated or retrieved, delivered, and retrievable later"
      - id: S11-E06
        title: "RM application (Flutter)"
        owner: "Digital + Amit"
        stories:
          - id: S11-E06-S01
            title: "Authenticate the RM"
            acceptance_criteria: "Via the BFF; no OAuth token reaches the client"
          - id: S11-E06-S02
            title: "Implement the journey screens"
            acceptance_criteria: "Per the S05 design, using the design system"
          - id: S11-E06-S03
            title: "Implement the customer-device hand-off"
            acceptance_criteria: "Consent and payment transitions, with status visible to the RM"
          - id: S11-E06-S04
            title: "Implement error, empty and degraded states"
            acceptance_criteria: "Per the S05 state catalogue; every failure tells the RM what to do"
          - id: S11-E06-S05
            title: "Implement offline and poor-connectivity behaviour"
            acceptance_criteria: "Branch connectivity is unreliable; no data loss on interruption"
      - id: S11-E07
        title: "Audit and observability"
        owner: "Amit + Shivanshi"
        stories:
          - id: S11-E07-S01
            title: "Emit an audit event per regulated action"
            acceptance_criteria: "Immutable, attributable, with correlation to the journey"
          - id: S11-E07-S02
            title: "Prove journey reconstruction"
            acceptance_criteria: "Any completed or abandoned journey reconstructable from audit records alone"
          - id: S11-E07-S03
            title: "Instrument the journey KPIs"
            acceptance_criteria: "Conversion and drop-off per step, per the S04 KPI definitions"
          - id: S11-E07-S04
            title: "Build the journey dashboard"
            acceptance_criteria: "Business-visible: sales, drop-offs, failures by cause"
      - id: S11-E08
        title: "Minimum administration and configuration"
        owner: "Rajal + Amit + Deepali"
        stories:
          - id: S11-E08-S01
            title: "Maintain the R0 catalogue seed"
            acceptance_criteria: "One approved Term product and insurer configuration; effective-dated; changes attributable and maker-checker controlled"
          - id: S11-E08-S02
            title: "Publish consent and disclosure versions"
            acceptance_criteria: "Version, effective date and approval provenance retained; a published version is never silently overwritten"
          - id: S11-E08-S03
            title: "Administer workforce and partner scopes"
            acceptance_criteria: "RM, Admin, insurer representative, Operations and management scopes are explicit; privileged changes require a different checker"
          - id: S11-E08-S04
            title: "Activate integration configuration safely"
            acceptance_criteria: "Distributor and insurer configuration references approved secret storage; no secret is displayed or accepted from a channel caller"
      - id: S11-E09
        title: "Insurer representative distribution collaboration"
        owner: "Rajal + Amit + Deepali"
        stories:
          - id: S11-E09-S01
            title: "Access partner-visible cases"
            acceptance_criteria: "Representative sees only explicitly shared cases for their own insurer and authorised branches; sharing and revocation are audited"
          - id: S11-E09-S02
            title: "Respond to underwriting requirements"
            acceptance_criteria: "Representative may update approved requirement/status fields but cannot alter bank consent, suitability, recommendation or customer declarations"
          - id: S11-E09-S03
            title: "Collaborate with RM and Operations"
            acceptance_criteria: "Case-bound notes and responses are attributable; representative cannot become bank owner, submit as RM, take payment or mark Sold"
      - id: S11-E10
        title: "Operations and lifecycle control"
        owner: "Shivanshi + Amit"
        stories:
          - id: S11-E10-S01
            title: "Operate the exception queue"
            acceptance_criteria: "Stuck journeys show stage, age, reason, owner, retryability and next action; normal waiting is distinct from an exception"
          - id: S11-E10-S02
            title: "Resolve reconciliation mismatches"
            acceptance_criteria: "Bank, gateway, aggregator and insurer references can be compared and resolved with source evidence; payment match alone never marks Sold"
          - id: S11-E10-S03
            title: "Escalate underwriting blockers"
            acceptance_criteria: "Overdue or unclear requirements identify the accountable RM, insurer representative or Operations owner, due state and escalation history"
          - id: S11-E10-S04
            title: "Track post-issuance completion"
            acceptance_criteria: "Issued, confirmed, reconciled, document-delivered and customer-notified states remain distinct; missing confirmation or documents create exceptions"
      - id: S11-E11
        title: "Management oversight and bounded authority"
        owner: "Rajal + Deepali"
        stories:
          - id: S11-E11-S01
            title: "Provide branch-level oversight"
            acceptance_criteria: "Branch Manager sees authorised branch pipeline and may assign or escalate work; the role does not grant selling authority or bypass qualification"
          - id: S11-E11-S02
            title: "Provide regional and sales oversight"
            acceptance_criteria: "Regional Manager and Sales Head receive aggregated performance and ageing; customer-level drill-down requires explicit purpose-based permission"
          - id: S11-E11-S03
            title: "Provide business-head oversight"
            acceptance_criteria: "Insurance Business Head sees portfolio, insurer and lifecycle outcomes but cannot override consent, suitability, underwriting, reconciliation or audit evidence"
          - id: S11-E11-S04
            title: "Enforce management-role separation"
            acceptance_criteria: "A management user can perform RM actions only when separately assigned the RM role, required branch scope and valid regulatory qualification"
    validation_tests:
      - id: S11-VT-01
        validates: "A policy can actually be sold"
        method: "A real RM completes the journey in UAT with a test customer"
        pass_condition: "Policy issued, confirmed, reconciled, audited"
      - id: S11-VT-02
        validates: "The suitability gate blocks"
        method: "Attempt a quote with no, expired, and mismatched suitability IDs"
        pass_condition: "403 in all three cases"
      - id: S11-VT-03
        validates: "Consent is enforced and evidenced"
        method: "Attempt a proposal without consent; then retrieve a consent record"
        pass_condition: "Blocked; record complete and immutable"
      - id: S11-VT-04
        validates: "Attribution cannot be spoofed"
        method: "Send a caller-supplied distributorId; attempt a sale with expired RM certification"
        pass_condition: "Rejected in both cases"
      - id: S11-VT-05
        validates: "Payment isolation holds"
        method: "Inspect every RM-app surface and network call during payment"
        pass_condition: "No payment surface, no card data path on the RM device"
      - id: S11-VT-06
        validates: "Money is never double-taken"
        method: "Replay payment initiation; simulate duplicate callbacks"
        pass_condition: "One charge, one policy"
      - id: S11-VT-07
        validates: "Failure paths work"
        method: "Inject failure at every journey step"
        pass_condition: "Each produces the designed compensation and a defined RM experience"
      - id: S11-VT-08
        validates: "Journeys resume"
        method: "Abandon at each step; resume later"
        pass_condition: "Context preserved, subject to validity rules"
      - id: S11-VT-09
        validates: "Audit reconstructs the sale"
        method: "Reconstruct a completed journey from audit records only"
        pass_condition: "Complete reconstruction, including who did what and when"
      - id: S11-VT-10
        validates: "No PII leaks"
        method: "Scan all logs and telemetry after a full journey run"
        pass_condition: "Zero regulated fields"
      - id: S11-VT-11
        validates: "Real users can use it"
        method: "5+ RMs complete the journey unaided in UAT"
        pass_condition: "≥ 80% complete; time-on-task within the S05 target"
      - id: S11-VT-12
        validates: "E2E suite runs in CI"
        method: "Nightly run of the full journey suite"
        pass_condition: "Green, repeatable"
      - id: S11-VT-13
        validates: "Admin authority is bounded"
        method: "Attempt self-approval, direct secret entry and case-level selling as Admin"
        pass_condition: "All denied; approved maker-checker changes remain attributable"
      - id: S11-VT-14
        validates: "Insurer isolation holds"
        method: "Attempt cross-insurer and unshared-case access as an insurer representative"
        pass_condition: "Denied in every case; revocation removes access immediately"
      - id: S11-VT-15
