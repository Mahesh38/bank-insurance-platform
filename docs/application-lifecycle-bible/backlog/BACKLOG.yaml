        evidence_artefact: "Destroy-and-recreate record"
      - id: S09-G4
        criterion: "Automated deployment with tested rollback"
        evidence_level: "E3"
        evidence_artefact: "Deploy and rollback execution record"
      - id: S09-G5
        criterion: "Secrets management operational; TD-006 closed"
        evidence_level: "E4"
        evidence_artefact: "Config evidence + rotation exercise record"
      - id: S09-G6
        criterion: "Observability operational: metrics, logs, traces correlated"
        evidence_level: "E4"
        evidence_artefact: "Dashboard links + a walked trace"
      - id: S09-G7
        criterion: "Backup automated and restore proven against RTO/RPO"
        evidence_level: "E3"
        evidence_artefact: "Restore test record with measured times"
      - id: S09-G8
        criterion: "7-year immutable retention implemented"
        evidence_level: "E4"
