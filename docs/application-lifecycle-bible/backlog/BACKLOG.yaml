# Application Lifecycle Backlog — GENERATED FILE, DO NOT EDIT BY HAND.
#
# Source of truth: docs/application-lifecycle-bible/stages/*.md
# Regenerate:      python3 scripts/lifecycle/generate-backlog.py
#
# Structure lives here; state lives in Jira. Do not sync state back.

schema_version: "1.0"
framework: "Application Lifecycle Bible 1.0"
status: "proposed — binding after CR-010 ratification"

stages:
  - id: S00
    name: "Ideation & Business Case"
    aigem_stage: "L0"
    owner: "Executive Sponsor + Rajal (Product)"
    default_priority: P3
    epics:
      - id: S00-E01
        title: "Problem definition and opportunity sizing"
        owner: "Rajal"
        stories:
          - id: S00-E01-S01
            title: "Articulate the as-is problem with evidence"
            acceptance_criteria: "Current-state process documented; the specific business loss named (post-redirect blindness); quantified where data exists"
          - id: S00-E01-S02
            title: "Size the opportunity"
            acceptance_criteria: "Addressable customer base by segment; attach-rate assumptions stated as assumptions; revenue range with a stated confidence"
          - id: S00-E01-S03
            title: "Define the target outcome"
            acceptance_criteria: "3–5 outcome statements, each measurable; each has a baseline and a target date"
          - id: S00-E01-S04
            title: "Identify the alternatives considered"
            acceptance_criteria: "At least two alternatives (buy, partner, extend legacy) with why each was not chosen"
      - id: S00-E02
        title: "Regulatory and licence viability"
        owner: "Shailja"
        stories:
          - id: S00-E02-S01
            title: "Confirm the activity is within licence"
            acceptance_criteria: "Licence number, class, and permitted activities cited; open-architecture multi-insurer distribution confirmed permissible"
          - id: S00-E02-S02
            title: "Identify showstopper obligations"
            acceptance_criteria: "Any obligation that would make the concept unviable is surfaced now, not at S12"
          - id: S00-E02-S03
            title: "Confirm data-handling viability"
            acceptance_criteria: "Categories of regulated data identified at concept level (PII, financial, health); residency constraint stated"
      - id: S00-E03
        title: "Business case and funding"
        owner: "Sponsor + Rajal"
        stories:
          - id: S00-E03-S01
            title: "Build the cost model"
            acceptance_criteria: "Build, run and change costs over 3 years; explicitly includes foundation and compliance cost, not only feature cost"
          - id: S00-E03-S02
            title: "Build the benefit model"
            acceptance_criteria: "Revenue, cost-to-serve, and control benefits, separately stated"
          - id: S00-E03-S03
            title: "State the investment decision"
            acceptance_criteria: "Payback period, funding envelope, tranche conditions; what would cause the programme to stop"
          - id: S00-E03-S04
            title: "Obtain funding approval"
            acceptance_criteria: "Recorded approval from the investment authority, dated"
      - id: S00-E04
        title: "Governance establishment"
        owner: "Rajal + Kalpana"
        stories:
          - id: S00-E04-S01
            title: "Name the executive sponsor"
            acceptance_criteria: "A named individual, with decision rights and an escalation path, recorded in the RACI"
          - id: S00-E04-S02
            title: "Establish the RACI"
            acceptance_criteria: "Every decision class has a named accountable person"
          - id: S00-E04-S03
            title: "Define the decision cadence"
            acceptance_criteria: "Steering frequency, membership, quorum, and what it decides"
          - id: S00-E04-S04
            title: "Establish the KPI tree"
            acceptance_criteria: "Outcomes decompose to measurable KPIs; each KPI has a source system and an owner"
    validation_tests:
      - id: S00-VT-01
        validates: "The problem is real, not assumed"
        method: "Interview 5+ stakeholders across RM, branch and operations"
        pass_condition: "≥ 4 independently describe the same post-redirect visibility loss"
      - id: S00-VT-02
        validates: "The opportunity is credible"
        method: "Independent review of the sizing assumptions by Finance"
        pass_condition: "Assumptions accepted or revised; no unsupported multiplier survives"
      - id: S00-VT-03
        validates: "The activity is permissible"
        method: "Compliance opinion against the licence"
        pass_condition: "Written opinion: permissible, with conditions listed"
      - id: S00-VT-04
        validates: "Someone is accountable"
        method: "Ask any team member \"who is the sponsor?\""
        pass_condition: "Same name from ≥ 80%"
      - id: S00-VT-05
        validates: "Success is measurable"
        method: "Walk each outcome to a KPI, a source, and an owner"
        pass_condition: "No outcome ends in \"improved experience\" with no measure"
    exit_gate:
      - id: S00-G1
        criterion: "Business case approved and funded"
        evidence_level: "E2"
        evidence_artefact: "Signed investment approval with envelope and tranche conditions"
      - id: S00-G2
        criterion: "Executive sponsor named with decision rights"
        evidence_level: "E1"
        evidence_artefact: "RACI naming an individual"
      - id: S00-G3
        criterion: "Regulatory viability confirmed"
        evidence_level: "E2"
        evidence_artefact: "Compliance opinion, signed"
      - id: S00-G4
        criterion: "Target outcomes defined and measurable"
        evidence_level: "E1"
        evidence_artefact: "KPI tree with owners and baselines"
      - id: S00-G5
        criterion: "Alternatives considered and recorded"
        evidence_level: "E1"
        evidence_artefact: "Options paper with rationale"
      - id: S00-G6
        criterion: "Programme governance operating"
        evidence_level: "E1"
        evidence_artefact: "Steering terms of reference; first meeting minuted"

  - id: S01
    name: "Discovery & Capability Definition"
    aigem_stage: "L0"
    owner: "Rajal (Product)"
    default_priority: P3
    epics:
      - id: S01-E01
        title: "Stakeholder and actor definition"
        owner: "Rajal"
        stories:
          - id: S01-E01-S01
            title: "Catalogue every actor"
            acceptance_criteria: "Bank actors (RM, BM, CM, RM-regional, Zonal, National), insurer actors (desk rep, regional ops, admin), customer segments (ETB, NTB), operations and compliance actors"
          - id: S01-E01-S02
            title: "Map organisational hierarchies"
            acceptance_criteria: "Bank and insurer hierarchies with the reporting relationships that will drive data scoping"
          - id: S01-E01-S03
            title: "Identify decision rights per actor"
            acceptance_criteria: "Who may quote, override, verify, approve, view MIS — the raw material for the S07 authorization model"
          - id: S01-E01-S04
            title: "Capture pain points per actor"
            acceptance_criteria: "Evidence-based, from interviews or observation, not assumed"
      - id: S01-E02
        title: "Capability mapping"
        owner: "Rajal + Mahesh"
        stories:
          - id: S01-E02-S01
            title: "Build the level-1 and level-2 capability map"
            acceptance_criteria: "Capabilities, not systems and not org units; each stated as a business ability"
          - id: S01-E02-S02
            title: "Assess each capability's current maturity"
            acceptance_criteria: "None / partial / adequate, with the supporting system named"
          - id: S01-E02-S03
            title: "Identify capability gaps"
            acceptance_criteria: "The delta between current and required maturity; this is the programme's real scope"
          - id: S01-E02-S04
            title: "Prioritise capabilities by business value"
            acceptance_criteria: "Which capabilities carry the outcome from S00"
      - id: S01-E03
        title: "Journey and value-stream discovery"
        owner: "Rajal + BA"
        stories:
          - id: S01-E03-S01
            title: "Map the as-is journeys"
            acceptance_criteria: "RM-assisted and self-service, including the redirect point where visibility is lost"
          - id: S01-E03-S02
            title: "Map the to-be journeys at concept level"
            acceptance_criteria: "Lead → need analysis → suitability → consent → quote → proposal → payment → issuance"
          - id: S01-E03-S03
            title: "Identify journey variants"
            acceptance_criteria: "ETB vs NTB; assisted vs DIY vs hybrid; Group A (aggregator) vs Group B (redirect) insurers"
          - id: S01-E03-S04
            title: "Identify the moments that matter"
            acceptance_criteria: "Where the sale is won or lost; where regulatory obligations bind"
      - id: S01-E04
        title: "Domain vocabulary"
        owner: "Rajal + Mahesh"
        stories:
          - id: S01-E04-S01
            title: "Build the glossary"
            acceptance_criteria: "Every domain term defined once; conflicting usages resolved, not documented in parallel"
          - id: S01-E04-S02
            title: "Define business-state vocabulary"
            acceptance_criteria: "What \"quoted\", \"proposed\", \"issued\", \"sold\" mean, precisely"
          - id: S01-E04-S03
            title: "Agree the ubiquitous language"
            acceptance_criteria: "The glossary's terms are the terms used in code, APIs and Jira"
      - id: S01-E05
        title: "Gap and question management"
        owner: "Rajal"
        stories:
          - id: S01-E05-S01
            title: "Establish the gap register"
            acceptance_criteria: "Every open question has an ID, owner, severity, and exit criterion"
          - id: S01-E05-S02
            title: "Establish the discovery backlog"
            acceptance_criteria: "Open questions tracked to closure, not to a document"
          - id: S01-E05-S03
            title: "Classify gaps by blocking severity"
            acceptance_criteria: "P0 = blocks scope/build; P1 = blocks pilot; P2/P3 = later. P0 must actually block"
    validation_tests:
      - id: S01-VT-01
        validates: "Capability map is complete"
        method: "Walk each to-be journey step; every step maps to a capability"
        pass_condition: "No orphan step; no capability with no journey"
      - id: S01-VT-02
        validates: "Actors are complete"
        method: "Walk each capability; every one has an actor who performs and one who is accountable"
        pass_condition: "No unowned capability"
      - id: S01-VT-03
        validates: "Glossary is unambiguous"
        method: "Give 5 team members 10 terms to define independently"
        pass_condition: "≥ 90% agreement; disputes resolved into the glossary"
      - id: S01-VT-04
        validates: "Journeys reflect reality"
        method: "Review the as-is journey with 3 practising RMs"
        pass_condition: "RMs recognise their own process; corrections captured"
      - id: S01-VT-05
        validates: "Gaps are honestly severed"
        method: "For every P0 gap, name what it blocks and confirm that thing is actually blocked"
        pass_condition: "No P0 gap whose \"blocked\" work is proceeding"
    exit_gate:
      - id: S01-G1
        criterion: "Capability map complete and prioritised"
        evidence_level: "E1"
        evidence_artefact: "Capability map with maturity and priority"
      - id: S01-G2
        criterion: "Stakeholder catalogue with decision rights"
        evidence_level: "E1"
        evidence_artefact: "Stakeholder catalogue"
      - id: S01-G3
        criterion: "As-is and to-be journeys mapped with variants"
        evidence_level: "E1"
        evidence_artefact: "Journey canvas"
      - id: S01-G4
        criterion: "Glossary agreed and adopted"
        evidence_level: "E2"
        evidence_artefact: "Glossary, signed off by Product + Architecture"
      - id: S01-G5
        criterion: "Gap register established with severities that bind"
        evidence_level: "E1"
        evidence_artefact: "Gap register + a stated blocking rule"
      - id: S01-G6
        criterion: "Discovery findings reviewed with business stakeholders"
        evidence_level: "E2"
        evidence_artefact: "Review record with attendees and corrections"

  - id: S02
    name: "Regulatory, Risk & Compliance Framing"
    aigem_stage: "L1"
    owner: "Shailja S (Compliance & Risk Head, Board 6)"
    default_priority: P1
    epics:
      - id: S02-E01
        title: "Regulatory registry"
        owner: "Shailja"
        stories:
          - id: S02-E01-S01
            title: "Catalogue applicable regulation"
            acceptance_criteria: "IRDAI corporate agency, RBI cyber-security and payment, DPDP/privacy, banking and AML as applicable; each with citation"
          - id: S02-E01-S02
            title: "Extract obligations"
            acceptance_criteria: "Each obligation gets an ID, source citation, plain-language statement, and an owner"
          - id: S02-E01-S03
            title: "Map obligations to journey steps"
            acceptance_criteria: "Every obligation attaches to where in the journey it binds"
          - id: S02-E01-S04
            title: "Establish the regulatory change watch"
            acceptance_criteria: "Named owner, cadence, and a route from a change into the backlog"
      - id: S02-E02
        title: "Control catalogue"
        owner: "Shailja + Deepali"
        stories:
          - id: S02-E02-S01
            title: "Define a control per obligation"
            acceptance_criteria: "Every obligation has ≥ 1 control; every control names its obligation"
          - id: S02-E02-S02
            title: "Classify controls as preventive/detective/corrective"
            acceptance_criteria: "Preventive controls become hard gates in code"
          - id: S02-E02-S03
            title: "Define the evidence for each control"
            acceptance_criteria: "What artefact proves it operates — automated test preferred"
          - id: S02-E02-S04
            title: "Identify non-waivable controls"
            acceptance_criteria: "The list that no authority may waive; published and agreed"
      - id: S02-E03
        title: "Consent rule pack"
        owner: "Shailja + Rajal"
        stories:
          - id: S02-E03-S01
            title: "Define consent events"
            acceptance_criteria: "Which actions require consent, from which actor, at which journey point"
          - id: S02-E03-S02
            title: "Define consent content and versioning"
            acceptance_criteria: "Statement text, version ID, language variants; how a version change affects in-flight journeys"
          - id: S02-E03-S03
            title: "Define the capture mechanism per channel"
            acceptance_criteria: "Assisted: SMS/OTP to the customer's device. DIY: in-app checkbox + OTP. Evidence captured identically in both"
          - id: S02-E03-S04
            title: "Define the consent evidence record"
            acceptance_criteria: "Statement text, version, CIF, OTP transaction ID, timestamp, IP — append-only, immutable"
          - id: S02-E03-S05
            title: "Define withdrawal and expiry"
            acceptance_criteria: "Can consent be withdrawn, what happens to in-flight and completed journeys, how long consent remains valid"
          - id: S02-E03-S06
            title: "Define retention and retrieval"
            acceptance_criteria: "7-year retention; retrieval SLA for a regulator request"
      - id: S02-E04
        title: "Suitability rule pack"
        owner: "Shailja + Rajal"
        stories:
          - id: S02-E04-S01
            title: "Define the need-analysis questionnaire"
            acceptance_criteria: "Questions, answer types, mandatory fields, per customer segment"
          - id: S02-E04-S02
            title: "Define the suitability algorithm"
            acceptance_criteria: "How answers map to a suitability outcome per product class; deterministic and reproducible"
          - id: S02-E04-S03
            title: "Define the hard-gate rule"
            acceptance_criteria: "Quote is refused without a valid suitability evaluation ID. Validity window and scope stated"
          - id: S02-E04-S04
            title: "Define override rules"
            acceptance_criteria: "May an RM override an unsuitable outcome? By whom, with what record, and what disclosure"
          - id: S02-E04-S05
            title: "Define the suitability evidence record"
            acceptance_criteria: "Answers, outcome, evaluator, timestamp, version of the algorithm used"
          - id: S02-E04-S06
            title: "Define re-evaluation triggers"
            acceptance_criteria: "What invalidates a prior suitability result"
      - id: S02-E05
        title: "Data classification and protection framing"
        owner: "Shailja + Deepali"
        stories:
          - id: S02-E05-S01
            title: "Classify every data element"
            acceptance_criteria: "Public / internal / confidential / restricted; PII, financial and health flagged"
          - id: S02-E05-S02
            title: "Define handling rules per class"
            acceptance_criteria: "Encryption, masking, logging prohibition, access restriction, cross-border prohibition"
          - id: S02-E05-S03
            title: "Define the retention schedule"
            acceptance_criteria: "Per data class, with the legal basis and the disposal method"
          - id: S02-E05-S04
            title: "Define data residency requirements"
            acceptance_criteria: "India-only for regulated data, including backups, logs and archives"
      - id: S02-E06
        title: "Risk framework"
        owner: "Shailja"
        stories:
          - id: S02-E06-S01
            title: "Define the risk taxonomy"
            acceptance_criteria: "Regulatory, financial, operational, security, reputational"
          - id: S02-E06-S02
            title: "Establish the risk register"
            acceptance_criteria: "Each risk: description, likelihood, impact, owner, treatment, review date"
          - id: S02-E06-S03
            title: "Define risk acceptance authority"
            acceptance_criteria: "Who may accept what level; material risk reserved to a named human"
          - id: S02-E06-S04
            title: "Define the exception process"
            acceptance_criteria: "Waiver requirements, expiry discipline, compensating controls"
    validation_tests:
      - id: S02-VT-01
        validates: "Every obligation has a control"
        method: "Traverse the registry"
        pass_condition: "Zero obligations with no control"
      - id: S02-VT-02
        validates: "Every control has evidence defined"
        method: "Traverse the catalogue"
        pass_condition: "Zero controls with no evidence type"
      - id: S02-VT-03
        validates: "Consent rules are implementable"
        method: "Give the pack to an engineer and a tester independently"
        pass_condition: "Both produce the same behaviour description; no clarification needed"
      - id: S02-VT-04
        validates: "Suitability rules are deterministic"
        method: "Run 20 sample customer profiles through the algorithm by hand, twice, by two people"
        pass_condition: "Identical outcomes both times"
      - id: S02-VT-05
        validates: "The hard-gate is unambiguous"
        method: "Ask: what exactly makes a suitability ID \"valid\"?"
        pass_condition: "Answer is a rule, not a judgement"
      - id: S02-VT-06
        validates: "Data classification is complete"
        method: "Sample 30 fields from the information model"
        pass_condition: "100% classified"
      - id: S02-VT-07
        validates: "Non-waivable list is agreed"
        method: "Security and Compliance both sign it"
        pass_condition: "Signed; no reservations"
    exit_gate:
      - id: S02-G1
        criterion: "Regulatory registry complete with obligation IDs"
        evidence_level: "E1"
        evidence_artefact: "Registry document"
      - id: S02-G2
        criterion: "Control catalogue maps every obligation to a control and its evidence"
        evidence_level: "E2"
        evidence_artefact: "Catalogue, signed by Compliance + Security"
      - id: S02-G3
        criterion: "Consent rule pack v1 approved"
        evidence_level: "E2"
        evidence_artefact: "Signed rule pack — closes GAP-006"
      - id: S02-G4
        criterion: "Suitability rule pack v1 approved"
        evidence_level: "E2"
        evidence_artefact: "Signed rule pack — closes GAP-007"
      - id: S02-G5
        criterion: "Data classification and retention schedule approved"
        evidence_level: "E2"
        evidence_artefact: "Classification matrix + retention schedule"
      - id: S02-G6
        criterion: "Data residency requirement stated and binding"
        evidence_level: "E1"
        evidence_artefact: "Written requirement"
      - id: S02-G7
        criterion: "Risk register established with acceptance authorities"
        evidence_level: "E1"
        evidence_artefact: "Risk register + authority matrix"
      - id: S02-G8
        criterion: "Non-waivable control list agreed"
        evidence_level: "E2"
        evidence_artefact: "Signed list"

  - id: S03
    name: "Business Requirements & Process Design"
    aigem_stage: "L1"
    owner: "Rajal (Product) + Business Analysis"
    default_priority: P2
    epics:
      - id: S03-E01
        title: "Requirement catalogue"
        owner: "Rajal + BA"
        stories:
          - id: S03-E01-S01
            title: "Decompose capabilities into requirements"
            acceptance_criteria: "Every capability yields ≥ 1 requirement; every requirement traces to a capability"
          - id: S03-E01-S02
            title: "Write acceptance criteria for every requirement"
            acceptance_criteria: "Given/When/Then or an equivalent checkable form; observable by someone who did not write it"
          - id: S03-E01-S03
            title: "Classify requirements"
            acceptance_criteria: "Functional / non-functional / compliance / technical enabler"
          - id: S03-E01-S04
            title: "Attach obligations to requirements"
            acceptance_criteria: "Every S02 control appears in ≥ 1 requirement's AC"
          - id: S03-E01-S05
            title: "Define failure and exception behaviour"
            acceptance_criteria: "For each requirement: what happens on timeout, rejection, abandonment, duplicate, and partial failure"
      - id: S03-E02
        title: "Business process design (to-be)"
        owner: "BA + Rajal"
        stories:
          - id: S03-E02-S01
            title: "Model each to-be process"
            acceptance_criteria: "Actors, steps, decisions, systems, hand-offs, and the regulatory checkpoints"
          - id: S03-E02-S02
            title: "Define process variants"
            acceptance_criteria: "Assisted / DIY / hybrid; ETB / NTB; Group A / Group B insurers"
          - id: S03-E02-S03
            title: "Define exception paths"
            acceptance_criteria: "Underwriting rejection, payment failure, insurer timeout, KYC mismatch, consent withdrawal"
          - id: S03-E02-S04
            title: "Define manual and operational procedures"
            acceptance_criteria: "What humans do when automation cannot — this becomes the S12 runbook's business half"
          - id: S03-E02-S05
            title: "Define SLAs per process step"
            acceptance_criteria: "Business-time expectations that become the S07 NFR inputs"
      - id: S03-E03
        title: "Business rules catalogue"
        owner: "Rajal"
        stories:
          - id: S03-E03-S01
            title: "Catalogue eligibility rules"
            acceptance_criteria: "Age, sum assured, income, medical, occupation limits per product class"
          - id: S03-E03-S02
            title: "Catalogue quote rules"
            acceptance_criteria: "Validity period, comparison basis, ranking and display rules, re-quote triggers (closes GAP-012)"
          - id: S03-E03-S03
            title: "Catalogue proposal rules"
            acceptance_criteria: "Mandatory fields per product, document requirements, medical triggers"
          - id: S03-E03-S04
            title: "Catalogue payment rules"
            acceptance_criteria: "Permitted instruments, device isolation, timeout, retry, refund"
          - id: S03-E03-S05
            title: "Catalogue attribution rules"
            acceptance_criteria: "Distributor ID and SP licence sourcing; behaviour when an RM's certification is expired (closes GAP-014)"
          - id: S03-E03-S06
            title: "Define the product matrix"
            acceptance_criteria: "LOB × insurer × product × dimensions, for the catalogue service (closes GAP-013)"
      - id: S03-E04
        title: "Information model"
        owner: "BA + Aarti"
        stories:
          - id: S03-E04-S01
            title: "Define business entities"
            acceptance_criteria: "Every noun in the glossary that has a lifecycle"
          - id: S03-E04-S02
            title: "Define attributes per entity"
            acceptance_criteria: "Name, type, optionality, validation, classification, source of truth (closes GAP-016)"
          - id: S03-E04-S03
            title: "Define entity relationships and cardinality"
            acceptance_criteria: "Including the ones that break naive models: joint life, multiple nominees, multi-policy customers"
          - id: S03-E04-S04
            title: "Define business states per entity"
            acceptance_criteria: "The state machine as the business sees it, before any technical design"
      - id: S03-E05
        title: "Traceability"
        owner: "Rajal + Swapnali"
        stories:
          - id: S03-E05-S01
            title: "Establish the traceability matrix"
            acceptance_criteria: "Obligation → requirement → (later) story → code → test → evidence"
          - id: S03-E05-S02
            title: "Verify bidirectional completeness"
            acceptance_criteria: "No requirement without a source; no obligation without a requirement"
          - id: S03-E05-S03
            title: "Define how traceability is maintained"
            acceptance_criteria: "A tool and a cadence, not a one-off spreadsheet"
    validation_tests:
      - id: S03-VT-01
        validates: "Requirements are testable"
        method: "QA reviews every AC for observability"
        pass_condition: "100% observable; zero \"should be user-friendly\""
      - id: S03-VT-02
        validates: "Requirements are unambiguous"
        method: "Two people independently describe the behaviour from the AC"
        pass_condition: "Descriptions match"
      - id: S03-VT-03
        validates: "Failure paths are specified"
        method: "Count requirements with only a happy path"
        pass_condition: "Zero"
      - id: S03-VT-04
        validates: "Rules are deterministic"
        method: "Run 20 scenarios through the eligibility and quote rules by hand"
        pass_condition: "Same answer every time, by every person"
      - id: S03-VT-05
        validates: "Information model is complete"
        method: "Walk each requirement; every field it needs exists in the model"
        pass_condition: "No missing attribute"
      - id: S03-VT-06
        validates: "Traceability is complete both ways"
        method: "Query the matrix"
        pass_condition: "Zero orphans in either direction"
      - id: S03-VT-07
        validates: "Obligations are covered"
        method: "For each S02 control, find the requirement enforcing it"
        pass_condition: "100% covered"
    exit_gate:
      - id: S03-G1
        criterion: "BRD complete with acceptance criteria on every requirement"
        evidence_level: "E2"
        evidence_artefact: "Signed BRD — closes GAP-008"
      - id: S03-G2
        criterion: "To-be processes modelled including exception paths"
        evidence_level: "E1"
        evidence_artefact: "Process models"
      - id: S03-G3
        criterion: "Business rules catalogue approved"
        evidence_level: "E2"
        evidence_artefact: "Signed catalogue — closes GAP-012, GAP-013, GAP-014"
      - id: S03-G4
        criterion: "Information model with attribute sheets"
        evidence_level: "E2"
        evidence_artefact: "Attribute sheets — closes GAP-016"
      - id: S03-G5
        criterion: "Every S02 control traces to a requirement"
        evidence_level: "E1"
        evidence_artefact: "Traceability matrix"
      - id: S03-G6
        criterion: "QA confirms every requirement is testable"
        evidence_level: "E2"
        evidence_artefact: "QA testability review, signed"
      - id: S03-G7
        criterion: "Business stakeholders accept the requirement set"
