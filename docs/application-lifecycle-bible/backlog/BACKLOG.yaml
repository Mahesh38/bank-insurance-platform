  - id: S14
    name: "Production Readiness & Go-Live"
    aigem_stage: "L9"
    owner: "Shivanshi (SRE) + Kalpana (Delivery)"
    default_priority: P2
    epics:
      - id: S14-E01
        title: "Production environment readiness"
        owner: "Shivanshi"
        stories:
          - id: S14-E01-S01
            title: "Provision production from the same IaC as UAT"
            acceptance_criteria: "Parameter differences only; no bespoke production resource"
          - id: S14-E01-S02
            title: "Verify production credentials and connectivity"
            acceptance_criteria: "Production keys, IP allowlisting, distributor ID, TLS egress, per partner"
          - id: S14-E01-S03
            title: "Verify production data protection"
            acceptance_criteria: "Encryption, key ownership, residency, retention — attested in production, not inferred from UAT"
          - id: S14-E01-S04
            title: "Size production capacity"
            acceptance_criteria: "Per the capacity model, with launch headroom"
          - id: S14-E01-S05
            title: "Verify production access control"
            acceptance_criteria: "Least privilege; break-glass defined, audited and time-bound"
      - id: S14-E02
        title: "SLO and observability readiness"
        owner: "Shivanshi + Rajal"
        stories:
          - id: S14-E02-S01
            title: "Publish SLIs and SLOs"
            acceptance_criteria: "Journey-level and component-level, agreed with Product"
          - id: S14-E02-S02
            title: "Agree the error budget policy"
            acceptance_criteria: "What happens at each consumption threshold, agreed before launch not after the first breach"
          - id: S14-E02-S03
            title: "Build production dashboards"
            acceptance_criteria: "Technical and business views; the business view usable by the sponsor"
          - id: S14-E02-S04
            title: "Configure production alerting"
            acceptance_criteria: "Every alert actionable, routed, runbook-linked, and tested by firing it"
          - id: S14-E02-S05
            title: "Verify end-to-end traceability in production"
            acceptance_criteria: "A real journey followed through metrics, logs and traces"
      - id: S14-E03
        title: "Operational readiness review"
        owner: "Shivanshi"
        stories:
          - id: S14-E03-S01
            title: "Conduct the ORR against O1–O13"
            acceptance_criteria: "Every check evidenced per 08-SRE-READINESS-CANON §5"
          - id: S14-E03-S02
            title: "Establish on-call"
            acceptance_criteria: "Roster, rotation, escalation, compensation, and someone actually rostered on day one"
          - id: S14-E03-S03
            title: "Verify runbooks against production"
            acceptance_criteria: "Procedures valid for the production topology, not just UAT"
          - id: S14-E03-S04
            title: "Conduct an incident simulation"
            acceptance_criteria: "A realistic scenario run end to end with the actual on-call team"
          - id: S14-E03-S05
            title: "Establish the support model"
            acceptance_criteria: "Tier 1/2/3, business-hours coverage, RM support path, partner escalation"
      - id: S14-E04
        title: "Disaster recovery"
        owner: "Shivanshi + Aarti"
        stories:
          - id: S14-E04-S01
            title: "Implement the DR configuration"
            acceptance_criteria: "Secondary region per the S07 architecture"
          - id: S14-E04-S02
            title: "Execute a DR test"
            acceptance_criteria: "Failover performed; RTO and RPO measured against target, not asserted"
          - id: S14-E04-S03
            title: "Execute a production-grade restore test"
            acceptance_criteria: "Restore from production backup to a working state, timed"
          - id: S14-E04-S04
            title: "Document and rehearse the DR decision"
            acceptance_criteria: "Who declares a disaster, on what criteria, and how the decision is communicated"
      - id: S14-E05
        title: "Launch management"
        owner: "Kalpana + Rajal"
        stories:
          - id: S14-E05-S01
            title: "Build the go-live checklist"
            acceptance_criteria: "Every item owned, dated and signed"
          - id: S14-E05-S02
            title: "Define the launch approach"
            acceptance_criteria: "Pilot cohort, ramp criteria, and the decision points between waves"
          - id: S14-E05-S03
            title: "Define rollback and contingency"
            acceptance_criteria: "What triggers withdrawal; how in-flight journeys and issued policies are handled"
          - id: S14-E05-S04
            title: "Complete business readiness"
            acceptance_criteria: "RM training delivered, materials published, support briefed, operational procedures live"
          - id: S14-E05-S05
            title: "Plan hypercare"
            acceptance_criteria: "Duration, staffing, daily review cadence, and the criteria to exit hypercare"
          - id: S14-E05-S06
            title: "Obtain go-live approvals"
            acceptance_criteria: "Every required sign-off recorded before launch, not retrospectively"
    validation_tests:
      - id: S14-VT-01
        validates: "Production matches the certified system"
        method: "Compare production config to UAT and to IaC"
        pass_condition: "Differences are parameters only, all justified"
      - id: S14-VT-02
        validates: "Alerts fire and route"
        method: "Trigger each alert condition in production"
