      - id: S09-VT-08
        validates: "Retention is immutable"
        method: "Attempt to delete an object under Object Lock"
        pass_condition: "Deletion refused"
      - id: S09-VT-09
        validates: "Observability is complete"
        method: "Trigger a request; follow it end to end"
        pass_condition: "Metrics, logs and a trace all present and correlated"
      - id: S09-VT-10
        validates: "PII never reaches aggregated logs"
        method: "Query the log store for regulated field patterns after a full test run"
        pass_condition: "Zero matches"
      - id: S09-VT-11
        validates: "Network segmentation holds"
        method: "Attempt a cross-zone connection that policy forbids"
