  - id: S04
    name: "Product Definition & Release Slicing"
    aigem_stage: "L1"
    owner: "Rajal (Product)"
    default_priority: P2
    epics:
      - id: S04-E01
        title: "Release strategy"
        owner: "Rajal + Kalpana"
        stories:
          - id: S04-E01-S01
            title: "Define the release ladder"
            acceptance_criteria: "R0 (pilot), R1, R2… each with a business outcome, not a component list"
          - id: S04-E01-S02
            title: "Define R0's business outcome"
            acceptance_criteria: "Assisted-first: an RM can sell one Term product to an ETB customer, end to end, with full audit; DIY and hybrid are later expansion waves"
          - id: S04-E01-S03
            title: "Define the pilot population"
            acceptance_criteria: "Which branches, how many RMs, which customers, over what period"
          - id: S04-E01-S04
            title: "Define launch and rollback criteria"
            acceptance_criteria: "What makes R0 a success; what would cause it to be withdrawn"
      - id: S04-E02
        title: "Scope definition"
        owner: "Rajal"
        stories:
          - id: S04-E02-S01
            title: "Define R0 in-scope"
            acceptance_criteria: "Requirement IDs, explicitly enumerated — not described by theme"
          - id: S04-E02-S02
            title: "Define R0 out-of-scope with revisit triggers"
            acceptance_criteria: "Every excluded item names the release or condition that revisits it"
          - id: S04-E02-S03
            title: "Define permanent exclusions"
            acceptance_criteria: "Things that will never be in scope, so they stop being re-proposed"
          - id: S04-E02-S04
            title: "Lock the channel, segment and LOB decisions"
            acceptance_criteria: "R0 = RM-assisted, ETB, Life/Term; DIY follows the proven assisted journey; hybrid follows stable assisted and DIY paths"
          - id: S04-E02-S05
            title: "Define the insurer panel for R0"
            acceptance_criteria: "Group A named for in-platform journeys; Group B handled by controlled redirect"
      - id: S04-E03
        title: "Product backlog"
        owner: "Rajal"
        stories:
          - id: S04-E03-S01
            title: "Decompose requirements into epics and stories"
            acceptance_criteria: "Every R0 requirement maps to ≥ 1 story; every story traces back"
          - id: S04-E03-S02
            title: "Prioritise using AIGEM P1–P5"
            acceptance_criteria: "No persona-local severity used as priority"
          - id: S04-E03-S03
            title: "Identify dependencies between stories"
            acceptance_criteria: "Dependency register populated; the critical path visible"
          - id: S04-E03-S04
            title: "Size the backlog"
            acceptance_criteria: "Anything XL is split or converted to a spike"
          - id: S04-E03-S05
            title: "Identify technical enablers"
            acceptance_criteria: "Foundation, integration and platform work made visible as backlog items, not assumed as overhead"
          - id: S04-E03-S06
            title: "Confirm actor-story coverage"
            acceptance_criteria: "RM, customer, Admin, insurer representative, Operations, Compliance/Audit and management actors each map to named epics/stories or an explicit later-wave exclusion"
      - id: S04-E04
        title: "Definition of Ready and Done"
        owner: "Rajal + Swapnali + Amit"
        stories:
          - id: S04-E04-S01
            title: "Agree Definition of Ready"
            acceptance_criteria: "Published, and applied — stories that fail it are not started"
          - id: S04-E04-S02
            title: "Agree Definition of Done"
            acceptance_criteria: "Includes tests green in CI, evidence linked, observability present, no PII in logs"
          - id: S04-E04-S03
            title: "Agree the review tiering rules"
            acceptance_criteria: "Which changes are T1–T4; the automatic T4 triggers"
      - id: S04-E05
        title: "Success measurement"
        owner: "Rajal"
        stories:
          - id: S04-E05-S01
            title: "Define R0 KPIs"
            acceptance_criteria: "Conversion, drop-off by step, time-to-issue, reconciliation completeness, RM adoption"
          - id: S04-E05-S02
            title: "Define the measurement mechanism"
            acceptance_criteria: "Which system emits each KPI; instrumentation becomes an S11 story, not an afterthought"
          - id: S04-E05-S03
            title: "Define the baseline"
            acceptance_criteria: "What the legacy redirect model achieves today, for comparison"
    validation_tests:
      - id: S04-VT-01
        validates: "R0 delivers standalone value"
        method: "Ask: can a policy be sold using only R0?"
        pass_condition: "Yes, end to end, by a real RM"
      - id: S04-VT-02
        validates: "Scope is unambiguous"
        method: "Present 15 candidate items; ask 3 people to classify in/out"
        pass_condition: "≥ 90% agreement"
      - id: S04-VT-03
        validates: "Out-of-scope items have triggers"
        method: "Traverse the list"
        pass_condition: "Zero items with no revisit condition"
      - id: S04-VT-04
        validates: "Backlog traces to requirements"
        method: "Query both directions"
        pass_condition: "No orphan story; no uncovered R0 requirement"
      - id: S04-VT-05
        validates: "Dependencies are known"
        method: "Attempt to sequence the backlog"
        pass_condition: "A viable critical path exists with no cycles"
      - id: S04-VT-06
        validates: "Enablers are visible"
        method: "Count foundation and platform stories in the backlog"
        pass_condition: "Non-zero, sized, and scheduled"
      - id: S04-VT-07
        validates: "KPIs are instrumentable"
        method: "For each KPI, name the emitting system and the story that adds it"
        pass_condition: "100%"
    exit_gate:
      - id: S04-G1
        criterion: "R0 scope defined: in, out with triggers, and never"
        evidence_level: "E2"
        evidence_artefact: "Signed scope document"
      - id: S04-G2
        criterion: "PRD approved for R0"
        evidence_level: "E2"
        evidence_artefact: "Signed PRD"
      - id: S04-G3
        criterion: "Backlog decomposed, prioritised, sized, dependency-mapped"
        evidence_level: "E1"
        evidence_artefact: "Backlog with dependency register"
      - id: S04-G4
        criterion: "DoR and DoD agreed and published"
        evidence_level: "E2"
        evidence_artefact: "Signed definitions"
      - id: S04-G5
        criterion: "R0 delivers standalone business value"
        evidence_level: "E2"
        evidence_artefact: "Walkthrough record confirming a complete sale is possible"
      - id: S04-G6
        criterion: "KPIs defined with measurement mechanisms"
        evidence_level: "E1"
        evidence_artefact: "KPI definitions naming source systems"
      - id: S04-G7
        criterion: "Technical enablers visible in the backlog and scheduled"
        evidence_level: "E1"
        evidence_artefact: "Backlog query showing foundation items"

  - id: S05
    name: "Experience Design & Service Blueprint"
    aigem_stage: "L1"
    owner: "Digital / Design + Rajal (Product)"
    default_priority: P2
    epics:
      - id: S05-E01
        title: "Service blueprint"
        owner: "Design + Rajal"
        stories:
          - id: S05-E01-S01
            title: "Blueprint each journey front-stage"
            acceptance_criteria: "What the actor sees at every step of every journey variant"
          - id: S05-E01-S02
            title: "Blueprint back-stage"
            acceptance_criteria: "Supporting actions, systems and hand-offs behind each front-stage step"
          - id: S05-E01-S03
            title: "Map the moments of truth"
            acceptance_criteria: "Where the sale is won or lost; where an obligation binds"
          - id: S05-E01-S04
            title: "Design the assisted/customer hand-off"
            acceptance_criteria: "The RM-device to customer-device transition for consent and payment — a regulatory requirement, and the hardest UX in the product"
      - id: S05-E02
        title: "Interaction design"
        owner: "Design"
        stories:
          - id: S05-E02-S01
            title: "Wireframe every journey step"
            acceptance_criteria: "Every wireframe references a requirement ID (closes GAP-009)"
          - id: S05-E02-S02
            title: "Design the need-analysis and suitability flow"
            acceptance_criteria: "Regulated questionnaire rendered so it is completed honestly, not clicked through"
          - id: S05-E02-S03
            title: "Design multi-quote comparison"
            acceptance_criteria: "Comparison basis visible; ranking rules disclosed; no dark patterns"
          - id: S05-E02-S04
            title: "Design proposal capture"
            acceptance_criteria: "Progressive disclosure; pre-fill from CIF/KYC; save and resume"
          - id: S05-E02-S05
            title: "Design the payment hand-off"
            acceptance_criteria: "QR/SMS link to the customer's device; RM sees status, never the payment surface"
          - id: S05-E02-S06
            title: "Design status, tracking and document access"
            acceptance_criteria: "Post-sale visibility — the capability the legacy model lacks entirely"
      - id: S05-E03
        title: "Design system"
        owner: "Design"
        stories:
          - id: S05-E03-S01
            title: "Define the component library"
            acceptance_criteria: "Reusable Flutter-ready components with states and variants"
          - id: S05-E03-S02
            title: "Define the design tokens"
            acceptance_criteria: "Colour, type, spacing, elevation — with accessible contrast proven"
          - id: S05-E03-S03
            title: "Define responsive behaviour"
            acceptance_criteria: "Mobile, tablet and web; RM tablet use in a branch is a primary case"
          - id: S05-E03-S04
            title: "Define the interaction and motion standard"
            acceptance_criteria: "Consistent, and cheap enough to render on mid-range devices"
      - id: S05-E04
        title: "Content and regulated copy"
        owner: "Rajal + Shailja"
        stories:
          - id: S05-E04-S01
            title: "Write consent statements"
            acceptance_criteria: "Exact wording, versioned, Compliance-approved, matching the S02 consent pack"
          - id: S05-E04-S02
            title: "Write regulatory disclosures"
            acceptance_criteria: "Placement, prominence and acknowledgement mechanism defined"
          - id: S05-E04-S03
            title: "Write the error and exception copy"
            acceptance_criteria: "Every failure path has copy that tells the actor what to do next"
          - id: S05-E04-S04
            title: "Define language and vernacular strategy"
            acceptance_criteria: "Which languages at R0, and how content is versioned per language"
      - id: S05-E05
        title: "Accessibility and inclusion"
        owner: "Design"
        stories:
          - id: S05-E05-S01
            title: "Set the accessibility standard"
            acceptance_criteria: "A named conformance target with a testing method"
          - id: S05-E05-S02
            title: "Design for low-literacy and assisted use"
            acceptance_criteria: "The RM-assisted journey serves customers who will not read a screen"
          - id: S05-E05-S03
            title: "Design for poor connectivity"
            acceptance_criteria: "Branch and field connectivity is unreliable; define offline and retry behaviour"
      - id: S05-E06
        title: "Validation with real users"
        owner: "Design + Rajal"
        stories:
          - id: S05-E06-S01
            title: "Prototype the primary journey"
            acceptance_criteria: "Clickable prototype covering the complete RM-assisted Term journey"
          - id: S05-E06-S02
            title: "Test with real RMs"
            acceptance_criteria: "≥ 5 practising RMs complete the journey unaided"
          - id: S05-E06-S03
            title: "Test with real customers"
            acceptance_criteria: "≥ 5 representative customers complete the customer-device steps"
          - id: S05-E06-S04
            title: "Iterate on findings"
            acceptance_criteria: "Findings logged, prioritised, and either fixed or explicitly deferred"
    validation_tests:
      - id: S05-VT-01
        validates: "Every requirement has a screen"
        method: "Traverse R0 requirements against wireframes"
        pass_condition: "No requirement with no interface"
      - id: S05-VT-02
        validates: "Every screen has a requirement"
        method: "Traverse wireframes against requirements"
        pass_condition: "No unrequested screen — this is where scope creep enters"
      - id: S05-VT-03
        validates: "RMs can complete the journey unaided"
        method: "Usability test, 5+ RMs"
        pass_condition: "≥ 80% complete without help; time-on-task recorded"
      - id: S05-VT-04
        validates: "The device hand-off is understood"
        method: "Observe the consent and payment hand-off"
        pass_condition: "Customers understand what they are approving without RM explanation"
      - id: S05-VT-05
        validates: "Regulated copy is approved"
        method: "Compliance reviews every consent and disclosure string"
        pass_condition: "100% approved, versioned"
      - id: S05-VT-06
        validates: "Accessibility target is met"
        method: "Audit the prototype against the standard"
        pass_condition: "Conformance achieved or gaps logged with owners"
      - id: S05-VT-07
        validates: "Failure paths have copy"
        method: "Traverse the exception catalogue"
        pass_condition: "Every failure path has actionable copy"
    exit_gate:
      - id: S05-G1
        criterion: "Service blueprint complete for R0 journeys"
        evidence_level: "E1"
        evidence_artefact: "Blueprint"
      - id: S05-G2
        criterion: "Wireframes mapped to requirement IDs"
        evidence_level: "E1"
        evidence_artefact: "Traceability map — closes GAP-009"
      - id: S05-G3
        criterion: "Design system published and adoptable"
        evidence_level: "E1"
        evidence_artefact: "Component library + tokens"
      - id: S05-G4
        criterion: "Regulated copy approved by Compliance"
        evidence_level: "E2"
        evidence_artefact: "Signed copy deck, versioned"
      - id: S05-G5
        criterion: "Accessibility standard set and prototype conformant"
        evidence_level: "E3"
        evidence_artefact: "Audit report"
      - id: S05-G6
        criterion: "Prototype validated with real RMs and customers"
        evidence_level: "E3"
        evidence_artefact: "Usability test report with findings and disposition"
      - id: S05-G7
        criterion: "Error, empty and degraded states catalogued"
        evidence_level: "E1"
        evidence_artefact: "State catalogue"

  - id: S06
    name: "Domain & Information Architecture"
    aigem_stage: "L2"
    owner: "Mahesh (Architecture) + Aarti (Data)"
    default_priority: P2
    epics:
      - id: S06-E01
        title: "Bounded context map"
        owner: "Mahesh"
        stories:
          - id: S06-E01-S01
            title: "Derive contexts from capabilities"
            acceptance_criteria: "Every context traces to capabilities; every capability lands in exactly one context"
          - id: S06-E01-S02
            title: "Define context relationships"
            acceptance_criteria: "Upstream/downstream, conformist, anti-corruption layer, shared kernel — named per pair"
          - id: S06-E01-S03
            title: "Define the language boundary per context"
            acceptance_criteria: "Where the same word means different things, and how it translates at the seam"
          - id: S06-E01-S04
            title: "Justify each context's existence"
            acceptance_criteria: "Each context has a distinct reason to change. A context that always changes with another is not a context"
      - id: S06-E02
        title: "Aggregate and state design"
        owner: "Mahesh"
        stories:
          - id: S06-E02-S01
            title: "Identify aggregates per context"
            acceptance_criteria: "Consistency boundary stated: what must be transactionally consistent"
          - id: S06-E02-S02
            title: "Define the state machine per aggregate"
            acceptance_criteria: "States, permitted transitions, triggers, and terminal states"
          - id: S06-E02-S03
            title: "Define invariants per aggregate"
            acceptance_criteria: "What must always be true; which are enforced where"
          - id: S06-E02-S04
            title: "Define aggregate identity and lifecycle"
            acceptance_criteria: "How it is created, identified, referenced across contexts, and archived"
          - id: S06-E02-S05
            title: "Design the journey state machine"
            acceptance_criteria: "The cross-context saga: quote → proposal → payment → issuance, with compensations for each failure point"
      - id: S06-E03
        title: "Domain invariants and rules placement"
        owner: "Mahesh + Rajal"
        stories:
          - id: S06-E03-S01
            title: "Catalogue every invariant"
            acceptance_criteria: "From the S03 rules catalogue, each mapped to the aggregate that enforces it"
          - id: S06-E03-S02
            title: "Place compliance hard-gates"
            acceptance_criteria: "Where suitability, consent and attribution are enforced — enforcement point named per control"
          - id: S06-E03-S03
            title: "Define what happens when an invariant is violated"
            acceptance_criteria: "Reject, compensate, or escalate — per invariant, not generically"
          - id: S06-E03-S04
            title: "Identify cross-aggregate consistency needs"
            acceptance_criteria: "Where eventual consistency is acceptable and where it is not (money is not)"
      - id: S06-E04
        title: "Logical data model"
        owner: "Aarti"
        stories:
          - id: S06-E04-S01
            title: "Build the logical model per context"
            acceptance_criteria: "Entities, attributes, keys, relationships, normalised"
          - id: S06-E04-S02
            title: "Define the data ownership matrix"
            acceptance_criteria: "Exactly one context may write each field; others read via contract"
          - id: S06-E04-S03
            title: "Define data classification at field level"
            acceptance_criteria: "Every field carries its S02 classification"
          - id: S06-E04-S04
            title: "Define reference and master data"
            acceptance_criteria: "Product catalogue, insurer, branch, user — source of truth per set"
          - id: S06-E04-S05
            title: "Define the audit data model"
            acceptance_criteria: "What an immutable, attributable, reconstructable audit record contains"
      - id: S06-E05
        title: "Canonical contracts"
        owner: "Mahesh"
        stories:
          - id: S06-E05-S01
            title: "Define the canonical model"
            acceptance_criteria: "The bank's own model, independent of any provider's API shape"
          - id: S06-E05-S02
            title: "Define provider translation boundaries"
            acceptance_criteria: "Provider types never leak past the adapter — the existing adapter.onesb.* rule, generalised"
          - id: S06-E05-S03
            title: "Define canonical events"
            acceptance_criteria: "Domain events per aggregate transition, with payload and versioning policy"
    validation_tests:
      - id: S06-VT-01
        validates: "Contexts are cohesive"
        method: "For each, ask what would cause it to change"
        pass_condition: "One reason per context"
      - id: S06-VT-02
        validates: "Aggregate boundaries are right"
        method: "Walk each business transaction; count aggregates it must update atomically"
        pass_condition: "Never more than one"
      - id: S06-VT-03
        validates: "State machines are complete"
        method: "Enumerate transitions; check every state is reachable and every non-terminal state has an exit"
        pass_condition: "No orphan or dead-end states"
      - id: S06-VT-04
        validates: "Invariants are enforceable"
        method: "For each, name the code location that will enforce it"
        pass_condition: "100% placed"
      - id: S06-VT-05
        validates: "The saga handles failure"
        method: "Walk each failure point in the journey"
        pass_condition: "Every failure has a defined compensation or a defined manual procedure"
      - id: S06-VT-06
        validates: "Data ownership is unambiguous"
        method: "Sample 30 fields; ask which context writes them"
        pass_condition: "Exactly one answer each"
      - id: S06-VT-07
        validates: "Audit model reconstructs a sale"
        method: "Take a completed journey; reconstruct it from audit records alone"
        pass_condition: "Full reconstruction possible"
      - id: S06-VT-08
        validates: "Canonical model is provider-neutral"
        method: "Review for provider-shaped concepts"
        pass_condition: "No 1SB or insurer vocabulary in the canonical model"
    exit_gate:
      - id: S06-G1
        criterion: "Bounded context map with relationships and justifications"
        evidence_level: "E2"
        evidence_artefact: "Context map, architecture-reviewed"
      - id: S06-G2
        criterion: "Aggregates with state machines and invariants"
        evidence_level: "E2"
        evidence_artefact: "Domain model document"
      - id: S06-G3
        criterion: "Journey saga designed including compensations"
        evidence_level: "E2"
        evidence_artefact: "Saga design with failure matrix"
      - id: S06-G4
        criterion: "Logical data model per context"
        evidence_level: "E2"
        evidence_artefact: "Data model, signed by Aarti"
      - id: S06-G5
        criterion: "Data ownership matrix complete"
        evidence_level: "E1"
        evidence_artefact: "Ownership matrix"
      - id: S06-G6
        criterion: "Compliance hard-gate enforcement points named"
        evidence_level: "E2"
        evidence_artefact: "Control placement map, Compliance-reviewed"
      - id: S06-G7
        criterion: "Audit model proven to reconstruct a journey"
        evidence_level: "E3"
        evidence_artefact: "Reconstruction walkthrough record"
      - id: S06-G8
        criterion: "Canonical model is provider-neutral"
        evidence_level: "E2"
        evidence_artefact: "Architecture review verdict"

  - id: S07
    name: "Solution & Security Architecture"
    aigem_stage: "L3"
    owner: "Mahesh (Architecture) + Deepali (Security), jointly"
    default_priority: P2
    epics:
      - id: S07-E01
        title: "Service architecture"
        owner: "Mahesh"
        stories:
          - id: S07-E01-S01
            title: "Map contexts to deployable services"
            acceptance_criteria: "A context may be a service, part of one, or several — with the reason stated"
          - id: S07-E01-S02
            title: "Define service responsibilities and boundaries"
            acceptance_criteria: "What each owns, what it must never do"
          - id: S07-E01-S03
            title: "Define the internal architecture pattern"
            acceptance_criteria: "Ports and adapters, layering rules, dependency direction — enforceable by ArchUnit"
          - id: S07-E01-S04
            title: "Define the edge architecture"
            acceptance_criteria: "BFF per client type; what the edge may and may not do"
          - id: S07-E01-S05
            title: "Define the build order"
            acceptance_criteria: "Which services R0 actually needs — not all nineteen"
      - id: S07-E02
        title: "Communication architecture"
        owner: "Mahesh"
        stories:
          - id: S07-E02-S01
            title: "Decide synchronous vs asynchronous per interaction"
            acceptance_criteria: "Each choice justified by consistency and latency needs, not preference"
          - id: S07-E02-S02
            title: "Define API standards"
            acceptance_criteria: "REST conventions, versioning, pagination, error format, idempotency semantics"
          - id: S07-E02-S03
            title: "Define the event backbone, if any"
            acceptance_criteria: "Whether one is needed for R0; if not, when it becomes needed and what triggers it"
          - id: S07-E02-S04
            title: "Define resilience patterns"
            acceptance_criteria: "Timeouts, retries with backoff, circuit breakers, bulkheads — per dependency class"
          - id: S07-E02-S05
            title: "Define idempotency across mutating APIs"
            acceptance_criteria: "Key derivation, storage, retention, and behaviour on replay"
      - id: S07-E03
        title: "Security architecture"
        owner: "Deepali"
        stories:
          - id: S07-E03-S01
            title: "Threat model per trust boundary"
            acceptance_criteria: "STRIDE per boundary; each threat has a mitigation or an accepted risk with an owner"
          - id: S07-E03-S02
            title: "Define the trust boundary and network model"
            acceptance_criteria: "Public, DMZ, internal, data zones; what may cross each boundary"
          - id: S07-E03-S03
            title: "Define the identity architecture"
            acceptance_criteria: "Workforce, customer and workload identity; token handling; the BFF token-hiding pattern"
          - id: S07-E03-S04
            title: "Define the authorization model"
            acceptance_criteria: "RBAC + ABAC, default deny, PDP placement, policy evaluation and caching"
          - id: S07-E03-S05
            title: "Define cryptography and key management"
            acceptance_criteria: "Algorithms, key hierarchy, KMS CMK ownership, rotation, and crypto agility"
          - id: S07-E03-S06
            title: "Define secrets management"
            acceptance_criteria: "Storage, retrieval, rotation, revocation; no secret in code or image"
          - id: S07-E03-S07
            title: "Define API and webhook security"
            acceptance_criteria: "Authentication, replay protection, payload integrity, partner trust contract"
          - id: S07-E03-S08
            title: "Define security logging and detection"
            acceptance_criteria: "What security events are emitted, where they go, what detects abuse"
      - id: S07-E04
        title: "Data architecture"
        owner: "Aarti + Mahesh"
        stories:
          - id: S07-E04-S01
            title: "Select a datastore per context"
            acceptance_criteria: "Justified by access pattern; database-per-service boundary respected"
          - id: S07-E04-S02
            title: "Design the physical schema"
            acceptance_criteria: "Keys, constraints, indexes, partitioning where justified"
          - id: S07-E04-S03
            title: "Define the migration strategy"
            acceptance_criteria: "Tooling, ownership, rollback, and zero-downtime approach"
          - id: S07-E04-S04
            title: "Design encryption and access at the data layer"
            acceptance_criteria: "At-rest encryption, key ownership, PII field handling, DB access model"
          - id: S07-E04-S05
            title: "Design backup, PITR and recovery"
            acceptance_criteria: "RPO and RTO per store, with the restore procedure defined"
          - id: S07-E04-S06
            title: "Design retention and purge"
            acceptance_criteria: "Per data class, with immutability where regulation requires"
      - id: S07-E05
        title: "Non-functional requirements"
        owner: "Mahesh + Rajal + Shivanshi"
        stories:
          - id: S07-E05-S01
            title: "Set NFR numbers"
            acceptance_criteria: "Latency (p50/p95/p99) per journey step, throughput at peak, availability target, RTO/RPO — actual numbers (closes GAP-017)"
          - id: S07-E05-S02
            title: "Derive NFRs from business need"
            acceptance_criteria: "Each number traces to a business reason, not a convention"
          - id: S07-E05-S03
            title: "Define how each NFR is verified"
            acceptance_criteria: "The test that proves it, at which stage"
          - id: S07-E05-S04
            title: "Define capacity assumptions"
            acceptance_criteria: "RM count, journeys per day, Q4 tax-season peak multiplier"
      - id: S07-E06
        title: "Architecture decisions"
        owner: "Mahesh"
        stories:
          - id: S07-E06-S01
            title: "Record an ADR per significant decision"
            acceptance_criteria: "Context, options, decision, consequences; superseded rather than edited"
          - id: S07-E06-S02
            title: "Define architecture principles and standing constraints"
            acceptance_criteria: "The rules that make later triage fast"
          - id: S07-E06-S03
            title: "Define fitness functions"
            acceptance_criteria: "Which constraints are machine-enforceable, and how"
          - id: S07-E06-S04
            title: "Define the replaceability strategy"
            acceptance_criteria: "What must remain swappable — aggregator, IdP, payment gateway — and how that is proven"
    validation_tests:
      - id: S07-VT-01
        validates: "Services align to contexts"
        method: "Compare the service list to the context map"
        pass_condition: "Every deviation justified in an ADR"
      - id: S07-VT-02
        validates: "Threat model covers every boundary"
        method: "Traverse boundaries against the model"
        pass_condition: "100% covered; every threat mitigated or accepted with an owner"
      - id: S07-VT-03
        validates: "Authorization is default-deny"
        method: "Design review of the PDP"
        pass_condition: "No path reaches a resource without an explicit allow"
      - id: S07-VT-04
        validates: "Failure modes are designed"
        method: "Walk each dependency failure"
        pass_condition: "Every one has a defined behaviour and a user-visible outcome"
      - id: S07-VT-05
        validates: "NFRs are numeric and verifiable"
        method: "Traverse the NFR sheet"
        pass_condition: "Zero qualitative NFRs; every one has a named verification test"
      - id: S07-VT-06
        validates: "Data ownership holds in the physical design"
        method: "Check for cross-service database access"
        pass_condition: "None"
      - id: S07-VT-07
        validates: "Constraints are machine-enforceable"
        method: "Count fitness functions vs constraints"
        pass_condition: "Every automatable constraint has one"
      - id: S07-VT-08
        validates: "Replaceability is real"
        method: "Design walkthrough: replace 1SB with another aggregator"
        pass_condition: "Change is confined to the adapter layer"
    exit_gate:
      - id: S07-G1
        criterion: "Target architecture documented and reviewed"
        evidence_level: "E2"
        evidence_artefact: "Architecture document + review verdict"
      - id: S07-G2
        criterion: "ADRs recorded for all significant decisions"
        evidence_level: "E1"
        evidence_artefact: "ADR log"
      - id: S07-G3
        criterion: "Threat model complete per trust boundary"
        evidence_level: "E2"
        evidence_artefact: "Threat model, signed by Security (human)"
      - id: S07-G4
        criterion: "Security architecture approved"
        evidence_level: "E2"
        evidence_artefact: "Security sign-off (human)"
      - id: S07-G5
        criterion: "Data architecture approved including backup and retention"
        evidence_level: "E2"
        evidence_artefact: "Signed by Aarti"
      - id: S07-G6
        criterion: "NFR sheet with numbers, each verifiable"
        evidence_level: "E2"
        evidence_artefact: "Signed NFR sheet — closes GAP-017"
      - id: S07-G7
        criterion: "R0 build order defined — the minimum service set"
        evidence_level: "E2"
        evidence_artefact: "Build order, PO and Delivery agreed"
      - id: S07-G8
        criterion: "Fitness functions defined for automatable constraints"
        evidence_level: "E1"
        evidence_artefact: "Fitness function list"

  - id: S08
    name: "Engineering Foundation"
    aigem_stage: "L4"
    owner: "Amit (Engineering) + Swapnali (Quality)"
    default_priority: P1
    epics:
      - id: S08-E01
        title: "Continuous integration pipeline"
        owner: "Amit + Shivanshi"
        stories:
          - id: S08-E01-S01
            title: "Build every module on every pull request"
            acceptance_criteria: "Full Gradle build across all libs/ and services/; failure blocks merge; build under 10 minutes"
          - id: S08-E01-S02
            title: "Run unit and component tests on every PR"
            acceptance_criteria: "All tests execute; any failure blocks merge; results published as a readable report"
          - id: S08-E01-S03
            title: "Run integration tests on merge to main"
            acceptance_criteria: "Testcontainers-backed; failure blocks the merge queue"
          - id: S08-E01-S04
            title: "Publish build artefacts"
            acceptance_criteria: "Versioned JARs and container images to a registry, tagged with the commit SHA"
          - id: S08-E01-S05
            title: "Enforce branch protection"
            acceptance_criteria: "No merge to main without a green pipeline and an approving review"
          - id: S08-E01-S06
            title: "Make pipeline status visible"
            acceptance_criteria: "Build badge, failure notification to the owning team, and a dashboard of pipeline health"
          - id: S08-E01-S07
            title: "Optimise pipeline feedback time"
            acceptance_criteria: "Parallelised module builds, dependency caching; PR feedback under 10 minutes or the pipeline gets bypassed in practice"
      - id: S08-E02
        title: "Quality gates in the pipeline"
        owner: "Swapnali + Amit"
        stories:
          - id: S08-E02-S01
            title: "Enforce JaCoCo coverage thresholds"
            acceptance_criteria: "Build fails below threshold — libs 80/70, services per policy. Closes QA-001's mechanism"
          - id: S08-E02-S02
            title: "Enforce ArchUnit rules in CI"
            acceptance_criteria: "Boundary violations fail the build; allowEmptyShould(true) removed (closes TD-007)"
          - id: S08-E02-S03
            title: "Enforce static analysis"
            acceptance_criteria: "Linting and code-quality rules; new violations fail, existing ones are a tracked baseline"
          - id: S08-E02-S04
            title: "Enforce build reproducibility"
            acceptance_criteria: "Same commit produces the same artefact; no snapshot or floating dependencies"
          - id: S08-E02-S05
            title: "Publish coverage and quality trend"
            acceptance_criteria: "Per-module trend visible over time, so decline is noticed before it is entrenched"
          - id: S08-E02-S06
            title: "Define and enforce 100% coverage on compliance-gate code"
            acceptance_criteria: "Control paths C1–C10 at 100% branch coverage, no waiver"
      - id: S08-E03
        title: "Test infrastructure"
        owner: "Swapnali + Amit"
        stories:
          - id: S08-E03-S01
            title: "Testcontainers for PostgreSQL"
            acceptance_criteria: "Integration tests run against a real database, created and destroyed per run"
          - id: S08-E03-S02
            title: "WireMock harness for 1SB and external providers"
            acceptance_criteria: "Provider behaviour stubbed including error, timeout and malformed responses (closes TD-014)"
          - id: S08-E03-S03
            title: "Shared test fixture library"
            acceptance_criteria: "Realistic domain fixtures reused across modules; no copy-pasted test data"
          - id: S08-E03-S04
            title: "Contract testing across service seams"
            acceptance_criteria: "Provider and consumer contracts verified in CI at every seam"
          - id: S08-E03-S05
            title: "E2E test harness"
            acceptance_criteria: "Framework, environment hookup, data setup and teardown, reporting"
          - id: S08-E03-S06
            title: "PII-free synthetic test data generator"
            acceptance_criteria: "Generates realistic profiles including the awkward cases: joint life, minor nominee, NRI, PAN mismatch"
          - id: S08-E03-S07
            title: "Performance test harness"
            acceptance_criteria: "Load-generation tooling wired to run against a deployed environment and publish results"
      - id: S08-E04
        title: "Security in the pipeline"
        owner: "Deepali + Amit"
        stories:
          - id: S08-E04-S01
            title: "Secret scanning"
            acceptance_criteria: "Pre-commit hook and CI stage; any detected credential fails the build; historical scan performed once"
          - id: S08-E04-S02
            title: "Static application security testing (SAST)"
            acceptance_criteria: "Runs on every PR; new critical or high findings fail; findings routed to the risk register"
          - id: S08-E04-S03
            title: "Dependency and supply-chain scanning (SCA)"
            acceptance_criteria: "Vulnerability check on every build; critical with a reachable path fails"
          - id: S08-E04-S04
            title: "Container image scanning"
            acceptance_criteria: "Every image scanned before publication; critical CVEs block"
          - id: S08-E04-S05
            title: "Generate an SBOM per build"
            acceptance_criteria: "Stored with the artefact; licence compliance checked"
          - id: S08-E04-S06
            title: "Define the vulnerability remediation SLA"
            acceptance_criteria: "S0 immediate, S1 next release, S2 two releases, S3 backlog — tracked, not aspirational"
      - id: S08-E05
        title: "Engineering standards"
        owner: "Amit"
        stories:
          - id: S08-E05-S01
            title: "Publish coding standards"
            acceptance_criteria: "Language level, formatting (automated), naming, package structure, error handling"
          - id: S08-E05-S02
            title: "Publish the secure coding standard"
            acceptance_criteria: "Input validation, output encoding, authorization checks, secret handling, logging prohibitions"
          - id: S08-E05-S03
            title: "Define the branching and review model"
            acceptance_criteria: "Trunk-based or short-lived branches; review requirements by change tier"
          - id: S08-E05-S04
            title: "Define the observability standard for code"
            acceptance_criteria: "Required metrics, structured logging with correlation IDs, trace propagation — as a library, not a convention"
          - id: S08-E05-S05
            title: "Define the PII-masking standard and prove it"
            acceptance_criteria: "Masking converter applied at the framework level, with a test that scans emitted logs for regulated field patterns"
          - id: S08-E05-S06
            title: "Publish the Definition of Done"
            acceptance_criteria: "Agreed with QA; enforced at review"
      - id: S08-E06
        title: "Developer experience"
        owner: "Shivanshi + Amit"
        stories:
          - id: S08-E06-S01
            title: "One-command local environment"
            acceptance_criteria: "A new engineer runs the full stack locally on day one"
          - id: S08-E06-S02
            title: "Fast local feedback"
            acceptance_criteria: "Unit tests under 3 minutes; a documented inner-loop workflow"
          - id: S08-E06-S03
            title: "Service scaffolding template"
            acceptance_criteria: "A new service starts with observability, security, error handling, health checks and CI already wired"
          - id: S08-E06-S04
            title: "Onboarding documentation"
            acceptance_criteria: "A new engineer makes a merged, tested change within their first week"
    validation_tests:
      - id: S08-VT-01
        validates: "CI actually blocks bad code"
        method: "Open a PR with a deliberately failing test"
        pass_condition: "Merge is blocked"
      - id: S08-VT-02
        validates: "Coverage gate bites"
        method: "Open a PR that drops coverage below threshold"
        pass_condition: "Build fails"
      - id: S08-VT-03
        validates: "Architecture rules bite"
        method: "Open a PR importing a 1SB type outside adapter.onesb.*"
        pass_condition: "Build fails"
      - id: S08-VT-04
        validates: "Secret scanning bites"
        method: "Open a PR containing a test credential in a realistic format"
        pass_condition: "Build fails, secret not merged"
      - id: S08-VT-05
        validates: "SCA bites"
        method: "Introduce a dependency with a known critical CVE"
        pass_condition: "Build fails"
      - id: S08-VT-06
        validates: "PII never reaches logs"
        method: "Run the full test suite; scan all emitted logs for PAN, Aadhaar, phone, email and health patterns"
        pass_condition: "Zero matches"
      - id: S08-VT-07
        validates: "Compliance-gate coverage is total"
        method: "Coverage report filtered to control paths C1–C10"
        pass_condition: "100% branch"
      - id: S08-VT-08
        validates: "Pipeline is fast enough to be trusted"
        method: "Measure PR feedback time across 20 runs"
        pass_condition: "p95 under 10 minutes"
      - id: S08-VT-09
        validates: "Pipeline is reliable"
        method: "Measure flaky failures across 50 runs"
        pass_condition: "Under 1%"
      - id: S08-VT-10
        validates: "A new engineer can contribute"
        method: "Onboard someone unfamiliar; time to first merged change"
        pass_condition: "Under one week"
      - id: S08-VT-11
        validates: "Builds are reproducible"
        method: "Build the same commit twice on different agents"
        pass_condition: "Identical artefacts"
    exit_gate:
      - id: S08-G1
        criterion: "CI builds and tests every module on every PR"
        evidence_level: "E4"
        evidence_artefact: "Pipeline definition + run history"
      - id: S08-G2
        criterion: "Merge to main is impossible without a green pipeline"
        evidence_level: "E4"
        evidence_artefact: "Branch protection config + a blocked-merge demonstration"
      - id: S08-G3
        criterion: "Coverage thresholds enforced; QA-001 closed"
        evidence_level: "E4"
        evidence_artefact: "Coverage report from CI + QA-001 closure record"
      - id: S08-G4
        criterion: "ArchUnit and static analysis enforced"
        evidence_level: "E4"
        evidence_artefact: "CI run showing enforcement + a demonstrated failure"
      - id: S08-G5
        criterion: "Secret, SAST, SCA and image scanning in the pipeline"
        evidence_level: "E4"
        evidence_artefact: "Scan reports from a CI run"
      - id: S08-G6
        criterion: "Test infrastructure operational at every pyramid level"
        evidence_level: "E4"
        evidence_artefact: "Tests of each type running in CI"
      - id: S08-G7
        criterion: "No PII in logs, proven by automated test"
        evidence_level: "E4"
        evidence_artefact: "Log-scan test result"
      - id: S08-G8
        criterion: "Engineering and secure coding standards published and adopted"
        evidence_level: "E2"
        evidence_artefact: "Standards documents + review checklist referencing them"
      - id: S08-G9
        criterion: "Pipeline feedback under 10 minutes at p95, flake under 1%"
        evidence_level: "E4"
        evidence_artefact: "Pipeline metrics over ≥ 50 runs"
      - id: S08-G10
        criterion: "A new engineer can build, test and ship in under a week"
        evidence_level: "E3"
        evidence_artefact: "Onboarding record"

  - id: S09
    name: "Platform & Environment Foundation"
    aigem_stage: "L4"
    owner: "Shivanshi (SRE) + Deepali (Security)"
    default_priority: P1
    epics:
      - id: S09-E01
        title: "Infrastructure as code"
        owner: "Shivanshi"
        stories:
          - id: S09-E01-S01
            title: "Establish the IaC repository and module standard"
            acceptance_criteria: "Terraform (or equivalent) with versioned, reviewed modules; no console-created production resource"
          - id: S09-E01-S02
            title: "Define remote state and locking"
            acceptance_criteria: "State stored securely, encrypted, locked against concurrent apply"
          - id: S09-E01-S03
            title: "Build the network foundation"
            acceptance_criteria: "VPC, subnets across AZs, routing, NAT, security groups — per the S07 trust boundary model"
          - id: S09-E01-S04
            title: "Build the compute foundation"
            acceptance_criteria: "EKS cluster (or approved alternative) with node management and workload isolation"
          - id: S09-E01-S05
            title: "Build the data foundation"
            acceptance_criteria: "Aurora PostgreSQL Multi-AZ, DynamoDB tables, S3 buckets — encrypted, private, least-privilege"
          - id: S09-E01-S06
            title: "Enforce region pinning to India"
            acceptance_criteria: "Every resource in ap-south-1; DR in ap-south-2; a policy check fails any other region"
          - id: S09-E01-S07
            title: "IaC scanning in the pipeline"
            acceptance_criteria: "Policy-as-code blocks public exposure, unencrypted stores and over-broad IAM before apply"
          - id: S09-E01-S08
            title: "Define drift detection"
            acceptance_criteria: "Scheduled comparison of actual state to code; drift alerts and is reconciled, not tolerated"
      - id: S09-E02
        title: "Environments"
        owner: "Shivanshi"
        stories:
          - id: S09-E02-S01
            title: "Provision dev, UAT and production"
            acceptance_criteria: "Each from the same IaC modules with different parameters — not hand-built variants"
          - id: S09-E02-S02
            title: "Define the promotion model"
            acceptance_criteria: "An artefact built once is promoted; never rebuilt per environment"
          - id: S09-E02-S03
            title: "Enforce environment isolation"
            acceptance_criteria: "Separate accounts or equivalent; no shared credentials; no network path from lower to production data"
          - id: S09-E02-S04
            title: "Define environment configuration management"
            acceptance_criteria: "Config external to the image; per-environment values versioned and reviewed"
          - id: S09-E02-S05
            title: "Define ephemeral environments for testing"
            acceptance_criteria: "Created per pipeline run or per feature branch, destroyed after"
          - id: S09-E02-S06
            title: "Prohibit production data in lower environments"
            acceptance_criteria: "Technically enforced, not policy-only"
      - id: S09-E03
        title: "Deployment and rollback"
        owner: "Shivanshi + Amit"
        stories:
          - id: S09-E03-S01
            title: "Automated deployment to every environment"
            acceptance_criteria: "Single pipeline, no manual steps, full audit trail of who deployed what"
          - id: S09-E03-S02
            title: "Progressive delivery"
            acceptance_criteria: "Rolling, blue/green or canary — chosen per service and justified"
          - id: S09-E03-S03
            title: "Automated, tested rollback"
            acceptance_criteria: "Rollback executed successfully in UAT as an acceptance condition, not a documented intention"
          - id: S09-E03-S04
            title: "Database migration in the deployment path"
            acceptance_criteria: "Ordered, reversible or forward-fixable, safe under a rolling deploy with mixed versions live"
          - id: S09-E03-S05
            title: "Deployment gating"
            acceptance_criteria: "Production deploy requires the required approvals recorded; emergency path exists and is audited"
          - id: S09-E03-S06
            title: "Deployment observability"
            acceptance_criteria: "Deploy events correlate to metric changes so a bad release is visible immediately"
      - id: S09-E04
        title: "Secrets and key management"
        owner: "Deepali + Shivanshi"
        stories:
          - id: S09-E04-S01
            title: "Deploy real secrets management"
            acceptance_criteria: "AWS Secrets Manager wired end to end — closes TD-006's stub provider"
          - id: S09-E04-S02
            title: "Eliminate secrets from code, images and config"
            acceptance_criteria: "Verified by scanning; build fails on any occurrence"
          - id: S09-E04-S03
            title: "Build the KMS key hierarchy"
            acceptance_criteria: "CMKs per data class, with defined ownership, policy and rotation"
          - id: S09-E04-S04
            title: "Implement secret rotation"
            acceptance_criteria: "Rotation procedure for every credential class, exercised at least once"
          - id: S09-E04-S05
            title: "Implement emergency revocation"
            acceptance_criteria: "A credential or partner key can be revoked and replaced under incident conditions; exercised"
          - id: S09-E04-S06
            title: "Define workload identity"
            acceptance_criteria: "Services authenticate to cloud resources by role, never by static credential"
      - id: S09-E05
        title: "Observability substrate"
        owner: "Shivanshi"
        stories:
          - id: S09-E05-S01
            title: "Deploy metrics collection and storage"
            acceptance_criteria: "Every service scraped; retention defined; queryable"
          - id: S09-E05-S02
            title: "Deploy log aggregation"
            acceptance_criteria: "Structured logs centralised, searchable, retained per policy, with PII masking verified in the pipeline"
          - id: S09-E05-S03
            title: "Deploy distributed tracing"
            acceptance_criteria: "Traces span every service hop and external call; trace ID correlates to logs"
          - id: S09-E05-S04
            title: "Build baseline dashboards"
            acceptance_criteria: "Per service: RED metrics, saturation, dependency health"
          - id: S09-E05-S05
            title: "Build the alerting platform"
            acceptance_criteria: "Routing, on-call schedule, escalation, and runbook links in the alert payload"
          - id: S09-E05-S06
            title: "Separate the audit event pipeline"
            acceptance_criteria: "Audit events do not flow through operational logging; immutable, separately retained"
      - id: S09-E06
        title: "Data protection, backup and retention"
        owner: "Aarti + Shivanshi"
        stories:
          - id: S09-E06-S01
            title: "Enable encryption at rest everywhere"
            acceptance_criteria: "Every store, backup and archive, with owned CMKs"
          - id: S09-E06-S02
            title: "Enforce TLS in transit"
            acceptance_criteria: "TLS 1.3 externally; mutual TLS or equivalent internally; verified by scan"
          - id: S09-E06-S03
            title: "Implement automated backup"
            acceptance_criteria: "Per store, meeting the S07 RPO; backups encrypted and access-controlled"
          - id: S09-E06-S04
            title: "Prove restore"
            acceptance_criteria: "A restore performed to a working state, timed against RTO — a backup that has never been restored is a hypothesis"
          - id: S09-E06-S05
            title: "Implement 7-year immutable retention"
            acceptance_criteria: "S3 Object Lock for raw payloads and audit archives; immutability tested by attempting deletion"
          - id: S09-E06-S06
            title: "Implement retention purge"
            acceptance_criteria: "Data past its retention horizon is disposed of, with an audit record of disposal"
          - id: S09-E06-S07
            title: "Attest data residency"
            acceptance_criteria: "Evidence that every store, backup, log and archive is in an India region"
      - id: S09-E07
        title: "Platform security baseline"
        owner: "Deepali"
        stories:
          - id: S09-E07-S01
            title: "Implement network segmentation"
            acceptance_criteria: "Trust zones enforced by security groups and network policy; default deny between zones"
          - id: S09-E07-S02
            title: "Implement least-privilege IAM"
            acceptance_criteria: "No wildcard production policies; access reviewed and time-bound"
          - id: S09-E07-S03
            title: "Harden the container platform"
            acceptance_criteria: "Non-root, read-only filesystems, no privileged containers, admission policy enforced"
          - id: S09-E07-S04
            title: "Deploy runtime security monitoring"
            acceptance_criteria: "Anomalous behaviour detected and alerted"
          - id: S09-E07-S05
            title: "Implement edge protection"
            acceptance_criteria: "WAF, rate limiting, DDoS protection on public endpoints"
          - id: S09-E07-S06
            title: "Implement security event logging"
            acceptance_criteria: "Security events to a separate, tamper-evident store"
    validation_tests:
      - id: S09-VT-01
        validates: "Infrastructure is reproducible"
        method: "Destroy and recreate a non-production environment entirely from code"
        pass_condition: "Identical, working environment; no manual step"
      - id: S09-VT-02
        validates: "Region pinning holds"
        method: "Attempt to apply a resource outside India regions"
        pass_condition: "Policy blocks it"
      - id: S09-VT-03
        validates: "Deployment works unattended"
        method: "Deploy through the pipeline with no manual intervention"
        pass_condition: "Success, fully audited"
      - id: S09-VT-04
        validates: "Rollback works"
        method: "Deploy a deliberately broken version to UAT, roll back"
        pass_condition: "Previous version restored; data intact; timed"
      - id: S09-VT-05
        validates: "Secrets are absent from artefacts"
        method: "Scan images and repository history"
        pass_condition: "Zero secrets"
      - id: S09-VT-06
        validates: "Rotation works"
        method: "Rotate a credential in UAT"
        pass_condition: "Services continue; no outage"
      - id: S09-VT-07
        validates: "Restore works"
