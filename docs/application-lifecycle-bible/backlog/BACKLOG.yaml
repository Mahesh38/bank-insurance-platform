          - id: S12-E04-S02
            title: "Execute soak testing"
            acceptance_criteria: "Sustained load; no leak, no degradation, no connection exhaustion"
          - id: S12-E04-S03
            title: "Execute failure-injection testing"
            acceptance_criteria: "Each dependency failed in turn; behaviour matches design"
          - id: S12-E04-S04
            title: "Verify resilience patterns under load"
