<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560"
     viewBox="0 0 1100 560" role="img" aria-labelledby="title">
  <title id="title">As-is AU Beema redirect versus bank-owned platform</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B4F8A"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9B3D4A"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7C7B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D4F"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0B1F3A"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F6F8FA"/>
  <rect x="0.0" y="0.0" width="1100.0" height="64.0" rx="0" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="28.0" y="28.0" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">The problem in one picture</text><text x="28.0" y="50.0" fill="#D7E3F2" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Today the bank loses the sale after redirect. The new platform keeps the whole journey.</text><rect x="40.0" y="92.0" width="480.0" height="360.0" rx="12" fill="#F8EEEE" stroke="#9B3D4A" stroke-width="1.6" opacity="1.0"/><rect x="40.0" y="92.0" width="480.0" height="34.0" rx="12" fill="#9B3D4A" stroke="#9B3D4A" stroke-width="0" opacity="1.0"/><rect x="40.0" y="114.0" width="480.0" height="12.0" rx="0" fill="#9B3D4A" stroke="#9B3D4A" stroke-width="0" opacity="1.0"/><text x="54.0" y="115.0" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">AS-IS — AU Beema Portal</text><text x="54.0" y="148.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">1. RM or customer opens the Beema portal</text><text x="54.0" y="166.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">2. Basic details and a product list</text><text x="54.0" y="184.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">3. Customer is sent to the insurer site</text><text x="54.0" y="202.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">4. Bank cannot see drop-off, payment,</text><text x="54.0" y="220.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">   underwriting, or whether a policy issued</text><text x="54.0" y="238.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif"></text><text x="54.0" y="256.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Result: no conversion funnel, weak audit,</text><text x="54.0" y="274.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">commission and MIS reconstructed later.</text><rect x="580.0" y="92.0" width="480.0" height="360.0" rx="12" fill="#EEF6F1" stroke="#2E7D4F" stroke-width="1.6" opacity="1.0"/><rect x="580.0" y="92.0" width="480.0" height="34.0" rx="12" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="0" opacity="1.0"/><rect x="580.0" y="114.0" width="480.0" height="12.0" rx="0" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="0" opacity="1.0"/><text x="594.0" y="115.0" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">TARGET — Bank-owned platform</text><text x="594.0" y="148.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">1. RM stays inside AU Bank&#x27;s NIP-APP</text><text x="594.0" y="166.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">2. Suitability, consent, quote, proposal</text><text x="594.0" y="184.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">3. Customer pays on their own device</text><text x="594.0" y="202.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">4. Policy issued and reconciled in-platform</text><text x="594.0" y="220.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">5. Immutable audit trail for IRDAI</text><text x="594.0" y="238.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif"></text><text x="594.0" y="256.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Result: one bank-branded sale, replaceable</text><text x="594.0" y="274.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">insurer connectivity behind 1SB adapter.</text><path d="M 528 272 L 572 272" fill="none" stroke="#0B1F3A" stroke-width="1.8" marker-end="url(#arrow-navy)"/><text x="28.0" y="544.0" fill="#5C6770" font-size="11" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Source: docs/context/business-problem-statement.md §3 — teaching view, not SSOT.</text>
</svg>
