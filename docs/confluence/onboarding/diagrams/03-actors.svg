<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520"
     viewBox="0 0 1100 520" role="img" aria-labelledby="title">
  <title id="title">Who is on the platform in R0</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B4F8A"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9B3D4A"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7C7B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D4F"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0B1F3A"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F6F8FA"/>
  <rect x="0.0" y="0.0" width="1100.0" height="64.0" rx="0" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="28.0" y="28.0" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Two on-platform actors — the customer is a participant</text><text x="28.0" y="50.0" fill="#D7E3F2" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Specified Person is a certificate on the RM, not a separate login.</text><rect x="40.0" y="100.0" width="320.0" height="250.0" rx="12" fill="#EEF6F1" stroke="#2E7D4F" stroke-width="1.6" opacity="1.0"/><rect x="40.0" y="100.0" width="320.0" height="34.0" rx="12" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="0" opacity="1.0"/><rect x="40.0" y="122.0" width="320.0" height="12.0" rx="0" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="0" opacity="1.0"/><text x="54.0" y="123.0" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Bank RM</text><text x="54.0" y="156.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Workforce identity (bank AD → Keycloak)</text><text x="54.0" y="174.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Only person who may originate a Lead</text><text x="54.0" y="192.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Every regulated action (suitability, quote,</text><text x="54.0" y="210.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">proposal) is checked against SP certificate</text><text x="54.0" y="228.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">at the moment of the action, not at login</text><rect x="390.0" y="100.0" width="320.0" height="250.0" rx="12" fill="#EAF6F5" stroke="#0E7C7B" stroke-width="1.6" opacity="1.0"/><rect x="390.0" y="100.0" width="320.0" height="34.0" rx="12" fill="#0E7C7B" stroke="#0E7C7B" stroke-width="0" opacity="1.0"/><rect x="390.0" y="122.0" width="320.0" height="12.0" rx="0" fill="#0E7C7B" stroke="#0E7C7B" stroke-width="0" opacity="1.0"/><text x="404.0" y="123.0" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Insurance Partner Rep</text><text x="404.0" y="156.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Partner identity, maker-checker provisioned</text><text x="404.0" y="174.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Assist only: own-insurer view, annotations</text><text x="404.0" y="192.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Never Specified Person, never origination</text><text x="404.0" y="210.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Cannot see another insurer&#x27;s records</text><text x="404.0" y="228.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Visibility is a query predicate, not a button</text><rect x="740.0" y="100.0" width="320.0" height="250.0" rx="12" fill="#FBF6E8" stroke="#C9A227" stroke-width="1.6" opacity="1.0"/><rect x="740.0" y="100.0" width="320.0" height="34.0" rx="12" fill="#C9A227" stroke="#C9A227" stroke-width="0" opacity="1.0"/><rect x="740.0" y="122.0" width="320.0" height="12.0" rx="0" fill="#C9A227" stroke="#C9A227" stroke-width="0" opacity="1.0"/><text x="754.0" y="123.0" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Customer (participant)</text><text x="754.0" y="156.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">No platform session in R0</text><text x="754.0" y="174.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Receives consent OTP on own phone</text><text x="754.0" y="192.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Pays premium on own device via bank PG</text><text x="754.0" y="210.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Never on an RM or bank-employee device</text><text x="754.0" y="228.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Does not call 1SB or any bank service</text><rect x="40.0" y="372.0" width="1020.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#9B3D4A" stroke-width="1.5" opacity="1.0"/><text x="60.0" y="404.0" fill="#9B3D4A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Never confuse these</text><text x="60.0" y="428.0" fill="#1A2330" font-size="13" font-weight="500" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Flutter never receives OAuth tokens. Keycloak is not the business authorisation source of truth.</text><text x="60.0" y="450.0" fill="#1A2330" font-size="13" font-weight="500" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">The BFF holds the session. identity-authorization-service is the PDP. Default deny.</text><text x="28.0" y="504.0" fill="#5C6770" font-size="11" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Source: docs/journey-execution/02-ACTOR-AND-USE-CASE-CATALOGUE.md §1 · ADR-004.</text>
</svg>
