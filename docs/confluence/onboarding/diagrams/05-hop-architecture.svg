  <rect x="0.0" y="0.0" width="1100.0" height="64.0" rx="0" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="28.0" y="28.0" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">How a request actually travels</text><text x="28.0" y="50.0" fill="#D7E3F2" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Bank apps never call 1SB or a database. UI speaks bank language only.</text><rect x="220.0" y="96.0" width="660.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.8" opacity="1.0"/><rect x="220.0" y="96.0" width="8.0" height="62.0" rx="0" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="248.0" y="122.0" fill="#0B1F3A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">L0 Device</text><text x="248.0" y="144.0" fill="#4A5560" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">NIP-APP (Flutter) — separate repository</text><line x1="550.0" y1="160.0" x2="550.0" y2="174.0" stroke="#0B1F3A" stroke-width="1.8" marker-end="url(#arrow-navy)"/><rect x="220.0" y="176.0" width="660.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#1B4F8A" stroke-width="1.8" opacity="1.0"/><rect x="220.0" y="176.0" width="8.0" height="62.0" rx="0" fill="#1B4F8A" stroke="#1B4F8A" stroke-width="0" opacity="1.0"/><text x="248.0" y="202.0" fill="#0B1F3A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">L1 Edge</text><text x="248.0" y="224.0" fill="#4A5560" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">CloudFront + WAF — TLS, bot, OWASP. No authN / authZ.</text><line x1="550.0" y1="240.0" x2="550.0" y2="254.0" stroke="#0B1F3A" stroke-width="1.8" marker-end="url(#arrow-navy)"/><rect x="220.0" y="256.0" width="660.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.8" opacity="1.0"/><rect x="220.0" y="256.0" width="8.0" height="62.0" rx="0" fill="#0E7C7B" stroke="#0E7C7B" stroke-width="0" opacity="1.0"/><text x="248.0" y="282.0" fill="#0B1F3A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">L2 Ingress</text><text x="248.0" y="304.0" fill="#4A5560" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">API Gateway — request shape, size, throttle. First AWS hop.</text><line x1="550.0" y1="320.0" x2="550.0" y2="334.0" stroke="#0B1F3A" stroke-width="1.8" marker-end="url(#arrow-navy)"/><rect x="220.0" y="336.0" width="660.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#4A5560" stroke-width="1.8" opacity="1.0"/><rect x="220.0" y="336.0" width="8.0" height="62.0" rx="0" fill="#4A5560" stroke="#4A5560" stroke-width="0" opacity="1.0"/><text x="248.0" y="362.0" fill="#0B1F3A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">L3 Internal</text><text x="248.0" y="384.0" fill="#4A5560" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Internal ALB — host/path to the BFF. Only ALB in R0.</text><line x1="550.0" y1="400.0" x2="550.0" y2="414.0" stroke="#0B1F3A" stroke-width="1.8" marker-end="url(#arrow-navy)"/><rect x="220.0" y="416.0" width="660.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#C9A227" stroke-width="1.8" opacity="1.0"/><rect x="220.0" y="416.0" width="8.0" height="62.0" rx="0" fill="#C9A227" stroke="#C9A227" stroke-width="0" opacity="1.0"/><text x="248.0" y="442.0" fill="#0B1F3A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">L4 BFF</text><text x="248.0" y="464.0" fill="#4A5560" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">NIP BFF / workforce-access-bff - session, CSRF, PEP to PDP.</text><line x1="550.0" y1="480.0" x2="550.0" y2="494.0" stroke="#0B1F3A" stroke-width="1.8" marker-end="url(#arrow-navy)"/><rect x="220.0" y="496.0" width="660.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="1.8" opacity="1.0"/><rect x="220.0" y="496.0" width="8.0" height="62.0" rx="0" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="0" opacity="1.0"/><text x="248.0" y="522.0" fill="#0B1F3A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">L5 Domain</text><text x="248.0" y="544.0" fill="#4A5560" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Lead, Journey, Quote, Payment... - re-check PDP on regulated actions.</text><line x1="550.0" y1="560.0" x2="550.0" y2="574.0" stroke="#0B1F3A" stroke-width="1.8" marker-end="url(#arrow-navy)"/><rect x="220.0" y="576.0" width="660.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#9B3D4A" stroke-width="1.8" opacity="1.0"/><rect x="220.0" y="576.0" width="8.0" height="62.0" rx="0" fill="#9B3D4A" stroke="#9B3D4A" stroke-width="0" opacity="1.0"/><text x="248.0" y="602.0" fill="#0B1F3A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Provider hop</text><text x="248.0" y="624.0" fill="#4A5560" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Integration Hub -&gt; 1SB adapter -&gt; Apigee egress -&gt; 1SB -&gt; insurer.</text><rect x="28.0" y="664.0" width="1044.0" height="40.0" rx="8" fill="#EEF3F8" stroke="#1B4F8A" stroke-width="1.5" opacity="1.0"/><text x="550.0" y="689.0" fill="#0B1F3A" font-size="12" font-weight="600" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Flutter never gets OAuth tokens  ·  UI/BFF never see 1SB codes  ·  no service calls an adapter directly</text><text x="28.0" y="704.0" fill="#5C6770" font-size="11" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Source: journey-execution/01-REQUEST-LIFECYCLE-STANDARD.md · ADR-018 / ADR-020 · standing constraints.</text>
</svg>
