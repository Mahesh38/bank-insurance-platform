  <rect x="0.0" y="0.0" width="1100.0" height="64.0" rx="0" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="28.0" y="28.0" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Fail closed — these are not preferences</text><text x="28.0" y="50.0" fill="#D7E3F2" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">A missing check at the BFF is not enforcement. The aggregate / store must refuse.</text><rect x="40.0" y="100.0" width="320.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#9B3D4A" stroke-width="1.5" opacity="1.0"/><rect x="56.0" y="116.0" width="44.0" height="26.0" rx="6" fill="#9B3D4A" stroke="#9B3D4A" stroke-width="0" opacity="1.0"/><text x="78.0" y="133.0" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">C1</text><text x="112.0" y="134.0" fill="#0B1F3A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Suitability before quote</text><text x="200.0" y="170.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">No quote without a valid,</text><text x="200.0" y="188.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">unexpired suitability</text><text x="200.0" y="206.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">assessment id.</text><rect x="390.0" y="100.0" width="320.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#9B3D4A" stroke-width="1.5" opacity="1.0"/><rect x="406.0" y="116.0" width="44.0" height="26.0" rx="6" fill="#9B3D4A" stroke="#9B3D4A" stroke-width="0" opacity="1.0"/><text x="428.0" y="133.0" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">C2</text><text x="462.0" y="134.0" fill="#0B1F3A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Consent before proposal</text><text x="550.0" y="170.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">No proposal without an</text><text x="550.0" y="188.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">unexpired customer-device</text><text x="550.0" y="206.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">OTP grant.</text><rect x="740.0" y="100.0" width="320.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#9B3D4A" stroke-width="1.5" opacity="1.0"/><rect x="756.0" y="116.0" width="44.0" height="26.0" rx="6" fill="#9B3D4A" stroke="#9B3D4A" stroke-width="0" opacity="1.0"/><text x="778.0" y="133.0" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">C3</text><text x="812.0" y="134.0" fill="#0B1F3A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Attribution</text><text x="900.0" y="170.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">distributorId is</text><text x="900.0" y="188.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">server-injected.</text><text x="900.0" y="206.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Caller-supplied values are</text><text x="900.0" y="224.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">rejected.</text><rect x="40.0" y="280.0" width="320.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#9B3D4A" stroke-width="1.5" opacity="1.0"/><rect x="56.0" y="296.0" width="44.0" height="26.0" rx="6" fill="#9B3D4A" stroke="#9B3D4A" stroke-width="0" opacity="1.0"/><text x="78.0" y="313.0" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">C4</text><text x="112.0" y="314.0" fill="#0B1F3A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Customer-device payment</text><text x="200.0" y="350.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">No API path may issue a</text><text x="200.0" y="368.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">payment link into an RM</text><text x="200.0" y="386.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">session.</text><rect x="390.0" y="280.0" width="320.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#9B3D4A" stroke-width="1.5" opacity="1.0"/><rect x="406.0" y="296.0" width="44.0" height="26.0" rx="6" fill="#9B3D4A" stroke="#9B3D4A" stroke-width="0" opacity="1.0"/><text x="428.0" y="313.0" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">C8</text><text x="462.0" y="314.0" fill="#0B1F3A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Sold is earned</text><text x="550.0" y="350.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">SOLD requires issued policy</text><text x="550.0" y="368.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">+ RECONCILED payment + audit</text><text x="550.0" y="386.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">complete.</text><rect x="740.0" y="280.0" width="320.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#9B3D4A" stroke-width="1.5" opacity="1.0"/><rect x="756.0" y="296.0" width="44.0" height="26.0" rx="6" fill="#9B3D4A" stroke="#9B3D4A" stroke-width="0" opacity="1.0"/><text x="778.0" y="313.0" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">ID</text><text x="812.0" y="314.0" fill="#0B1F3A" font-size="14" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Token hiding</text><text x="900.0" y="350.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Flutter never receives OAuth</text><text x="900.0" y="368.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">tokens. Keycloak is not the</text><text x="900.0" y="386.0" fill="#1A2330" font-size="13" font-weight="400" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">PDP.</text><text x="28.0" y="504.0" fill="#5C6770" font-size="11" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Source: BOOT.md standing constraints · R0-HLD.md §1 · domain invariants INV-* .</text>
