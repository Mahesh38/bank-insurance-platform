  <rect x="0.0" y="0.0" width="1100.0" height="64.0" rx="0" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="28.0" y="28.0" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Sold is a four-part fact</text><text x="28.0" y="50.0" fill="#D7E3F2" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Quote, proposal or payment alone never counts as a sale.</text><rect x="70.0" y="120.0" width="200.0" height="140.0" rx="12" fill="#FFFFFF" stroke="#1B4F8A" stroke-width="2" opacity="1.0"/><rect x="148.0" y="140.0" width="44.0" height="28.0" rx="6" fill="#1B4F8A" stroke="#1B4F8A" stroke-width="0" opacity="1.0"/><text x="170.0" y="158.0" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">1</text><text x="170.0" y="196.0" fill="#0B1F3A" font-size="14" font-weight="600" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Insurer issued</text><text x="170.0" y="212.0" fill="#0B1F3A" font-size="14" font-weight="600" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">the contract</text><text x="284.0" y="188.0" fill="#C9A227" font-size="28" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">+</text><rect x="320.0" y="120.0" width="200.0" height="140.0" rx="12" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="2" opacity="1.0"/><rect x="398.0" y="140.0" width="44.0" height="28.0" rx="6" fill="#0E7C7B" stroke="#0E7C7B" stroke-width="0" opacity="1.0"/><text x="420.0" y="158.0" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">2</text><text x="420.0" y="196.0" fill="#