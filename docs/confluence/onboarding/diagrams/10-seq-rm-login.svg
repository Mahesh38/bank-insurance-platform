  <rect x="0.0" y="0.0" width="1100.0" height="64.0" rx="0" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="28.0" y="28.0" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Sequence — RM login</text><text x="28.0" y="50.0" fill="#D7E3F2" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">The device never talks to Keycloak&#x27;s token endpoint and never receives an OAuth token.</text><line x1="142.0" y1="146" x2="142.0" y2="812" stroke="#C5CDD6" stroke-width="1.4" stroke-dasharray="3 7"/><rect x="72.0" y="96.0" width="140.0" height="44.0" rx="8" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="142.0" y="124.0" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">RM</text><rect x="72.0" y="804.0" width="140.0" height="32.0" rx="8" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="142.0" y="825.0" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">RM</text><line x1="346.0" y1="146" x2="346.0" y2="812" stroke="#C5CDD6" stroke-width="1.4" stroke-dasharray="3 7"/><rect x="276.0" y="96.0" width="140.0" height="44.0" rx="8" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="346.0" y="124.0" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">BFF</text><rect x="276.0" y="804.0" width="140.0" height="32.0" rx="8" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="346.0" y="825.0" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">BFF</text><line x1="550.0" y1="146" x2="550.0" y2="812" stroke="#C5CDD6" stroke-width="1.4" stroke-dasharray="3 7"/><rect x="480.0" y="96.0" width="140.0" height="44.0" rx="8" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="550.0" y="124.0" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Adapter</text><rect x="480.0" y="804.0" width="140.0" height="32.0" rx="8" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="550.0" y="825.0" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Adapter</text><line x1="754.0" y1="146" x2="754.0" y2="812" stroke="#C5CDD6" stroke-width="1.4" stroke-dasharray="3 7"/><rect x="684.0" y="96.0" width="140.0" height="44.0" rx="8" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="754.0" y="124.0" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Keycloak</text><rect x="684.0" y="804.0" width="140.0" height="32.0" rx="8" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="754.0" y="825.0" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Keycloak</text><line x1="958.0" y1="146" x2="958.0" y2="812" stroke="#C5CDD6" stroke-width="1.4" stroke-dasharray="3 7"/><rect x="888.0" y="96.0" width="140.0" height="44.0" rx="8" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="958.0" y="124.0" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">PDP</text><rect x="888.0" y="804.0" width="140.0" height="32.0" rx="8" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="0" opacity="1.0"/><text x="958.0" y="825.0" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">PDP</text><line x1="142.0" y1="172.0" x2="346.0" y2="172.0" stroke="#1B4F8A" stroke-width="1.8" marker-end="url(#arrow)"/><text x="244.0" y="164.0" fill="#1A2330" font-size="11" font-weight="500" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">POST /api/v1/auth/login</text><line x1="346.0" y1="214.0" x2="550.0" y2="214.0" stroke="#1B4F8A" stroke-width="1.8" marker-end="url(#arrow)"/><text x="448.0" y="206.0" fill="#1A2330" font-size="11" font-weight="500" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">POST authorization-uri</text><line x1="550.0" y1="256.0" x2="754.0" y2="256.0" stroke="#1B4F8A" stroke-width="1.8" marker-end="url(#arrow)"/><text x="652.0" y="248.0" fill="#1A2330" font-size="11" font-weight="500" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Build provider URI</text><line x1="346.0" y1="298.0" x2="142.0" y2="298.0" stroke="#1B4F8A" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="244.0" y="290.0" fill="#1A2330" font-size="11" font-weight="500" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Return URI only — no token</text><line x1="142.0" y1="340.0" x2="754.0" y2="340.0" stroke="#1B4F8A" stroke-width="1.8" marker-end="url(#arrow)"/><text x="448.0" y="332.0" fill="#1A2330" font-size="11" font-weight="500" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Bank-controlled login ceremony</text><line x1="754.0" y1="382.0" x2="142.0" y2="382.0" stroke="#0E7C7B" stroke-width="1.8" marker-end="url(#arrow-teal)" stroke-dasharray="6 5"/><text x="448.0" y="374.0" fill="#1A2330" font-size="11" font-weight="500" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">302 to BFF callback</text><line x1="142.0" y1="424.0" x2="346.0" y2="424.0" stroke="#1B4F8A" stroke-width="1.8" marker-end="url(#arrow)"/><text x="244.0" y="416.0" fill="#1A2330" font-size="11" font-weight="500" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">GET /callback?code&amp;state</text><line x1="346.0" y1="466.0" x2="550.0" y2="466.0" stroke="#1B4F8A" stroke-width="1.8" marker-end="url(#arrow)"/><text x="448.0" y="458.0" fill="#1A2330" font-size="11" font-weight="500" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">token-exchange + PKCE verifier</text><line x1="550.0" y1="508.0" x2="754.0" y2="508.0" stroke="#1B4F8A" stroke-width="1.8" marker-end="url(#arrow)"/><text x="652.0" y="500.0" fill="#1A2330" font-size="11" font-weight="500" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Redeem code, validate iss/aud/exp</text><line x1="346.0" y1="550.0" x2="958.0" y2="550.0" stroke="#1B4F8A" stroke-width="1.8" marker-end="url(#arrow)"/><text x="652.0" y="542.0" fill="#1A2330" font-size="11" font-weight="500" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Resolve provider subject to business identity</text><path d="M 346.0 592 L 386.0 592 L 386.0 610 L 346.0 610" fill="none" stroke="#4A5560" stroke-width="1.8" marker-end="url(#arrow)"/><text x="396.0" y="597.0" fill="#1A2330" font-size="11" font-weight="500" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Store session; encrypt provider tokens</text><line x1="346.0" y1="640.0" x2="142.0" y2="640.0" stroke="#2E7D4F" stroke-width="1.8" marker-end="url(#arrow-green)" stroke-dasharray="6 5"/><text x="244.0" y="632.0" fill="#1A2330" font-size="11" font-weight="500" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Cookie / opaque handle — never the access token</text><rect x="132.0" y="670.0" width="836.0" height="28.0" rx="6" fill="#FBF6E8" stroke="#C9A227" stroke-width="1.5" opacity="1.0"/><text x="550.0" y="688.0" fill="#0B1F3A" font-size="11" font-weight="600" text-anchor="middle" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">SP certificate is NOT checked at login — it is checked on each regulated action</text><text x="28.0" y="844.0" fill="#5C6770" font-size="11" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Source: docs/journey-execution/flows/UC-01-rm-login.md. IPR login is the same endpoints, partner realm.</text>
</svg>
