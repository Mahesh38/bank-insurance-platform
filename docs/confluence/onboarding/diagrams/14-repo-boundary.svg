curity,</text><text x="54.0" y="228.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">       audit, secrets</text><text x="54.0" y="246.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">docs/  BRD, HLD, governance, this pack</text><rect x="560.0" y="100.0" width="500.0" height="300.0" rx="12" fill="#F8EEEE" stroke="#9B3D4A" stroke-width="1.6" opacity="1.0"/><rect x="560.0" y="100.0" width="500.0" height="34.0" rx="12" fill="#9B3D4A" stroke="#9B3D4A" stroke-width="0" opacity="1.0"/><rect x="560.0" y="122.0" width="500.0" height="12.0" rx="0" fill="#9B3D4A" stroke="#9B3D4A" stroke-width="0" opacity="1.0"/><text x="574.0" y="123.0" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Not in this git repo</text><text x="574.0" y="156.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">NIP-APP / Flutter source (separate repo)</text><text x="574.0" y="174.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Customer-facing DIY app (R1)</text><text x="574.0" y="192.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">Insurer underwriting engines</text><text x="574.0" y="210.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">AU Bank CBS, AD, Payment Gateway</text><text x="574.0" y="228.0" fill="#1A2330" font-size="12" font-weight="400" text-anchor="start" font-style="normal" font-family="DejaVu Sans, Liberation Sans, sans-serif">