        why: "The module's authoritative build docs and their order."
      - path: "docs/context/personas/amit-engineering.card.md"
        why: "The boundaries ArchUnit enforces."
    then_only_if:
      - condition: "a field's mandatory/when/why is in question"
        path: "docs/1sb-insurance-integration/field-guides/"
      - condition: "the canonical bank-owned model is affected"
        path: "docs/1sb-insurance-integration/canonical-model/"
      - condition: "the service design itself is the subject"
        path: "docs/1sb-insurance-integration/architecture/1sb-integration-service-architecture.md"
