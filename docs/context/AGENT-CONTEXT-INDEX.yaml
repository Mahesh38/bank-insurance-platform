      - path: "docs/governance/11-REVIEW_GATES.md"
        anchor: "10-board-7--operations"
        why: "The O1–O8 operational checks."
    then_only_if:
      - condition: "the question is scaling, capacity or an incident under load"
        capsule: "scaling-incident"
      - condition: "the question is observability, incidents, resilience or DR"
        path: "docs/context/roles/shivanshi-sre/05-observability-incidents-resilience-and-dr.md"
      - condition: "the question is platform, infrastructure or CI/CD mechanics"
