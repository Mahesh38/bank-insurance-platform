      - "Perform unbounded scaling or retries against a downstream provider."

  - id: scaling-incident
    intent: "Answer a scaling, capacity or under-load incident question without the CPU/memory reflex."
    triggers: ["scale", "scaling", "autoscale", "add pods", "slow", "latency spike", "timeout", "capacity", "load test", "throughput", "under load"]
    persona: sre-operations
    budget_bytes: 55000
    load:
      - path: "docs/context/personas/shivanshi-sre.card.md"
