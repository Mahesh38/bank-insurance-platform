  - id: board-review
    intent: "Run the seven-board review gate for an item, in role, one board at a time."
    triggers: ["board review", "review gate", "seven boards", "t4", "sign-off", "gate review"]
    budget_bytes: 60000
    load:
      - path: "docs/governance/11-REVIEW_GATES.md"
        anchor: "3-proportionality--which-boards-are-mandatory"
        why: "Only the mandatory boards for this risk tier run."
      - path: "docs/governance/11-REVIEW_GATES.md"
