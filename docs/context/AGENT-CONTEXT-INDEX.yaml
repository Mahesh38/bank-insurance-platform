  - id: code-change
    intent: "Write or change Java/Spring code in this repository."
    triggers: ["implement", "fix the bug", "write the code", "refactor", "add the endpoint", "failing test", "build failure", "compile error", "archunit"]
    persona: engineering
    budget_bytes: 45000
    load:
      - path: "docs/context/personas/amit-engineering.card.md"
        why: "Adopt Amit. The ArchUnit-enforced boundaries and the coverage gates."
      - path: "docs/1sb-insurance-integration/service-ssot/ROLE-GUIDELINES-AND-DOD.md"
