        capsule: "1sb-integration-change"
      - condition: "the change touches persistence, entities or migrations"
        capsule: "database-review"
      - condition: "the change touches authn, authz, secrets or an exposed endpoint"
        capsule: "security-review"
      - condition: "you are about to report a defect that may already be known"
        path: "docs/1sb-insurance-integration/service-ssot/TECH-DEBT.md"
    output: "Change + tests + evidence + the work item ID on every TODO."
    never:
      - "Start without an admitted work item — triage first."
      - "Put 1SB specifics outside `adapter.onesb.*`, or PII in logs."
      - "Add Flyway or JPA to `1sb-integration-service`."

  - id: 1sb-integration-change
    intent: "Change the 1SB adapter, a provider contract, a field mapping or a journey call."
    triggers: ["1sb", "onesb", "adapter", "provider contract", "field mapping", "quote api", "proposal api", "insurer call"]
    persona: engineering
    budget_bytes: 60000
    load:
