  - id: database-review
    intent: "Persistence, schema, integrity, migration, capacity, backup and recovery decisions."
    triggers: ["database", "schema", "migration", "flyway", "index", "partition", "persistence", "backup", "restore", "data model", "jpa"]
    persona: database
    budget_bytes: 40000
    load:
      - path: "docs/context/personas/aarti-database.card.md"
        why: "Adopt Aarti. Owns / never / the mandatory joint review list with Mahesh."
      - path: "docs/context/roles/principal-insurance-data-database-architect/04-operating-and-review-contract.md"
        why: "How a DB review is requested, run and evidenced."
    then_only_if:
      - condition: "service boundaries or data ownership are affected"
        capsule: "architecture-review"
      - condition: "DB-side PII, encryption or credentials are affected"
        capsule: "security-review"
      - condition: "physical schema, indexes, routines or R0 DDL is the question"
        path: "docs/platform/data-architecture/README.md"
      - condition: "alignment of the physical pack with CR-013 / Lead archive / MIS / issuanceMode"
        path: "docs/platform/data-architecture/DATA-002-cr013-alignment.md"
    output: "DB verdict + severity `D0`–`D3` + integrity/recovery guarantees the platform may rely on."
    never:
      - "Let application scaling override a DB limit."
      - "Change service boundaries or Product behaviour for schema convenience."

  - id: qa-review
    intent: "Board 5 — test strategy, testability, regression scope, evidence sufficiency, quality exit."
    triggers: ["qa review", "board 5", "test strategy", "coverage", "is this tested", "quality gate", "regression", "test evidence"]
    persona: quality
    budget_bytes: 35000
    load:
      - path: "docs/context/personas/swapnali-qa.card.md"
        why: "Adopt Swapnali. Evidence sufficiency is hers; the security and operational conclusions are not."
      - path: "docs/1sb-insurance-integration/service-ssot/TESTING-RULES.md"
        why: "How tests are actually written in this repository."
      - path: "docs/1sb-insurance-integration/service-ssot/COVERAGE.md"
        why: "The enforced gates: libs 80/70; services on the interim floor."
    then_only_if:
      - condition: "the strategy itself is in question, not one test"
        path: "docs/1sb-insurance-integration/service-ssot/QA-LEAD-TESTING-STRATEGY.md"
      - condition: "a critical journey or a non-bypassable gate is involved"
        path: "docs/context/roles/swapnali-qa-lead/05-critical-journeys-and-non-bypassable-gates.md"
    output: "Quality verdict + evidence sufficiency + named gaps. Unexecuted is never passed."
    never: ["Assume a result. Waive a non-waivable Security or Compliance conclusion."]

  - id: compliance-review
    intent: "Board 6 — regulatory permissibility, PII, consent, retention, mandatory control outcomes."
    triggers: ["compliance", "board 6", "regulatory", "irdai", "rbi", "pii", "consent", "retention", "data residency", "is this allowed"]
    persona: compliance-risk
    budget_bytes: 60000
    load:
      - path: "docs/context/personas/shailja-compliance.card.md"
        why: "Adopt Shailja. Grounding context — not authoritative regulation."
      - path: "docs/context/roles/shailja-s-compliance-risk-head/05-decision-policy.md"
        why: "How the verdict is reached."
      - path: "docs/governance/11-REVIEW_GATES.md"
        anchor: "9-board-6--risk--compliance"
        why: "The Board 6 contract and the mandatory human sign-off."
    then_only_if:
      - condition: "which regulation applies is the actual question"
        path: "docs/context/roles/shailja-s-compliance-risk-head/02-regulatory-registry.md"
      - condition: "a specific mandatory control is in question"
        path: "docs/context/roles/shailja-s-compliance-risk-head/03-control-catalogue.md"
      - condition: "an exception or human risk acceptance is requested"
        path: "docs/context/roles/shailja-s-compliance-risk-head/07-human-exception-and-risk-acceptance.md"
      - condition: "consent or suitability rules are the subject"
        path: "docs/au-bank-insurance-platform/rule-packs/consent-rule-pack.md"
    output: "Permissibility + severity `R0`–`R3` + mandatory controls + evidence + named human owner where required."
    never:
      - "Declare unexecuted Security, QA or SRE evidence passed."
      - "Let an architecture or delivery severity downgrade an `R0`."

  - id: sre-operations
    intent: "Board 7 — deployability, observability, SLOs, resilience, incidents, DR, CI/CD platform, toil."
    triggers: ["sre", "board 7", "operations", "slo", "observability", "alerting", "runbook", "deployment", "ci/cd platform", "incident", "disaster recovery", "resilience"]
    persona: sre-operations
    budget_bytes: 45000
    load:
      - path: "docs/context/personas/shivanshi-sre.card.md"
