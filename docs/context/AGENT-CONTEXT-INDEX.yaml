# =============================================================================
# AGENT CONTEXT INDEX — deterministic task-to-context routing
#
# The problem this solves: docs/ holds ~4.3 MB across 427 files. An agent that
# explores it burns its context window before it does any work, and an agent
# that guesses reads the wrong file. This index removes the guess: every task
# type resolves to a NAMED capsule with an EXACT, ORDERED, BUDGETED read list.
#
#   python3 scripts/context/context-load.py list
#   python3 scripts/context/context-load.py show architecture-review
#   python3 scripts/context/context-load.py resolve "is the payment callback safe"
#
# Budgets are ENFORCED: scripts/governance/ci-checks.py recomputes the real byte
# cost of every load list and fails when a capsule outgrows its budget. A capsule
# that gets fat is a bug, not a fact of life.
#
# Authority: this file is ROUTING ONLY. It never overrides docs/governance/.
# =============================================================================

schema_version: "1.0"
index_version: "1.0.0"
project_id: bank-insurance-platform
canonical_authority: "docs/governance/PERSONA-AUTHORITY-MATRIX.md"

# Precedence when two loaded documents disagree. Mirrors context-manifest.yaml.
precedence:
  - "docs/governance/"
  - "docs/au-bank-insurance-platform/07-BUSINESS-CLARIFICATIONS-WORKING-DECISIONS.md"
  - "docs/au-bank-insurance-platform/DECISION-LOG.md"
  - "docs/platform/"
  - "docs/1sb-insurance-integration/service-ssot/"
  - "docs/context/"

# ---------------------------------------------------------------------------
# Tier 0 — the only thing loaded before the task is known.
# ---------------------------------------------------------------------------
tier_0:
  load:
    - path: "docs/context/BOOT.md"
      why: "Ten-fact knowledge contract, stage posture, standing constraints, open gates, known debt."
  budget_bytes: 20000
  replaces:
    note: >-
      BOOT.md answers, from generated state, what previously required reading
      CURRENT-STATE.yaml + RUNBOOK section 8 + 01-CURRENT_STATE + the core rules
      out of AGENTS.md — roughly 120 KB of source.

# ---------------------------------------------------------------------------
# Reading discipline. These are the rules that actually save the context window.
# ---------------------------------------------------------------------------
rules:
  - id: CTX-1
    rule: "Load the capsule, not the folder. Never read a directory to find out what is in it — this index already says."
  - id: CTX-2
    rule: "Never load a persona package when a persona card answers the question. Cards are 3–6 KB; packages reach 244 KB."
  - id: CTX-3
    rule: "Anchored entries mean READ THAT SECTION ONLY. RUNBOOK.md is 60 KB; section 8 is 6 KB."
  - id: CTX-4
    rule: "`then_only_if` entries are conditional. Load one only when its condition is true for the input in front of you."
  - id: CTX-5
    rule: "Registers are grep targets, not reads. Search for the ID; do not load a 34 KB register to append one row."
  - id: CTX-6
    rule: "Cite what you actually read, by path and anchor. An uncited conclusion is an assumption."
  - id: CTX-7
    rule: "If the capsule was not enough, say which question it failed to answer and open ONE more file — then propose the index fix as a suggestion (it is triaged, not applied in that turn)."
  - id: CTX-8
    rule: "Generated files (BOOT.md's state block, backlog/jira-import.csv) are never hand-edited. Regenerate them."
  - id: CTX-9
    rule: "Two capsules maximum per turn. Needing three means the task is not decomposed — say so."
  - id: CTX-10
    rule: >-
      Hunting one specific fact is a `find`, not an explore. `context-load.py find "<fact>"`
      queries DOC-MAP.yaml, where every document under docs/ has a row. Never grep docs/ and
      never walk README hubs to locate a file.

# ---------------------------------------------------------------------------
# Personas — card first, package only on a named condition.
# ---------------------------------------------------------------------------
personas:
  - id: product
    manifest_role: product
    card: "docs/context/personas/rajal-product.card.md"
    package: "docs/context/roles/principal-insurance-platform-product-owner/"
  - id: business-analysis
    manifest_role: business-analysis
    card: "docs/context/personas/ba-r11-business-analysis.card.md"
    package: "docs/context/roles/principal-insurance-platform-business-analyst/"
  - id: architecture
    manifest_role: architecture
    card: "docs/context/personas/mahesh-architecture.card.md"
    package: "docs/context/roles/mahesh-principal-insurance-platform-architect/"
  - id: engineering
    manifest_role: engineering
    card: "docs/context/personas/amit-engineering.card.md"
    package: "docs/context/roles/amit-technical-head.md"
  - id: security
    manifest_role: security
    card: "docs/context/personas/deepali-security.card.md"
    package: "docs/context/roles/deepali-principal-security-architect/"
  - id: database
    manifest_role: database
    card: "docs/context/personas/aarti-database.card.md"
    package: "docs/context/roles/principal-insurance-data-database-architect/"
  - id: quality
    manifest_role: quality
    card: "docs/context/personas/swapnali-qa.card.md"
    package: "docs/context/roles/swapnali-qa-lead/"
  - id: compliance-risk
    manifest_role: compliance-risk
    card: "docs/context/personas/shailja-compliance.card.md"
    package: "docs/context/roles/shailja-s-compliance-risk-head/"
  - id: sre-operations
    manifest_role: sre-operations
    card: "docs/context/personas/shivanshi-sre.card.md"
    package: "docs/context/roles/shivanshi-sre/"
  - id: delivery
    manifest_role: delivery
    card: "docs/context/personas/kalpana-delivery.card.md"
    package: "docs/context/roles/kalpana-delivery-head/"

# ---------------------------------------------------------------------------
# Document routing — the long tail, routed.
#
# The capsules above route a TASK to its always-load set: small, ordered, budgeted.
# That leaves the long tail — one field guide, one extracted schema, one stage's
# evidence pack — reachable only by walking README hubs. Measured before these rules
# existed: 96 documents sat 3+ hops from this index and 20 were unreachable at all.
# Present in the repository, invisible in practice, and exactly the granular detail
# an agent must not lose.
#
# These rules give every tracked document one row in the generated DOC-MAP.yaml.
# Ordered MOST-SPECIFIC FIRST; first match wins. Adding a folder is an edit here,
# never a code change.
#
#   python3 scripts/context/build-doc-map.py               # regenerate the map
#   python3 scripts/context/context-load.py find "<need>"  # query it
#
# `authority` is what a document can SETTLE — not how good it is. It mirrors the six
# buckets in docs/README.md and never overrides the precedence list at the top of
# this file.
# ---------------------------------------------------------------------------
doc_routing:
  rules:

    # --- governance: process, registers and machine-checked records --------
    - match: ["docs/governance/registers/*"]
      bucket: governance
      authority: binding-process
      capsules: [triage, plan-work, delivery-planning]
      persona: null
      note: "Grep targets (rule CTX-5). Search for the ID; never load a 34 KB register to append a row."

    - match: ["docs/governance/state/*"]
      bucket: governance
      authority: binding-process
      capsules: [triage, delivery-planning]
      persona: null
      note: "BOOT.md already answers facts 1-9 from here. Open only for a field the capsule omits."

    - match: ["docs/governance/schemas/*", "docs/governance/templates/*"]
      bucket: governance
      authority: binding-process
      capsules: [plan-work, board-review]
      persona: null

    - match: ["docs/governance/change-requests/**"]
      bucket: governance
      authority: binding-process
      capsules: [triage, board-review]
      persona: null

    - match: ["docs/governance/workstreams/*", "docs/governance/plans/*", "docs/governance/autopilot/*"]
      bucket: governance
      authority: binding-process
      capsules: [delivery-planning, plan-work]
      persona: delivery

    - match: ["docs/governance/*"]
      bucket: governance
      authority: binding-process
      capsules: [triage, plan-work, board-review]
      persona: null

    # --- lifecycle: which stage, what it must produce, when it is done -----
    - match: ["docs/application-lifecycle-bible/stages/*"]
      bucket: lifecycle
      authority: proposed-cr-010
      capsules: [plan-work, delivery-planning]
      persona: delivery

    - match: ["docs/application-lifecycle-bible/evidence/*"]
      bucket: lifecycle
      authority: proposed-cr-010
      capsules: [board-review, qa-review, delivery-planning]
      persona: quality

    - match: ["docs/application-lifecycle-bible/backlog/*", "docs/application-lifecycle-bible/templates/*"]
      bucket: lifecycle
      authority: proposed-cr-010
      capsules: [delivery-planning, plan-work]
      persona: delivery

    - match: ["docs/application-lifecycle-bible/*"]
      bucket: lifecycle
      authority: proposed-cr-010
      capsules: [orient, plan-work, delivery-planning]
      persona: delivery

    # --- context: the agent's own routing layer ----------------------------
    - match: ["docs/context/personas/*"]
      bucket: context
      authority: non-binding-context
      capsules: [board-review]
      persona: null
      note: "Tier 1 cards, 3-6 KB. Always prefer a card to a package (rule CTX-2)."

    - match: ["docs/context/roles/**"]
      bucket: context
      authority: non-binding-context
      capsules: [board-review]
      persona: null
      note: "Tier 2 packages. Open ONE named file, only when a card's `Load deeper` row matches."

    - match: ["docs/context/framework/**", "docs/context/schemas/*"]
      bucket: context
      authority: non-binding-context
      capsules: [context-reuse]
      persona: null

    - match: ["docs/context/roadmaps/*"]
      bucket: context
      authority: non-binding-context
      capsules: [target-state-vision, delivery-planning]
      persona: architecture

    - match: ["docs/context/*"]
      bucket: context
      authority: non-binding-context
      capsules: [orient, docs-navigation]
      persona: null

    # --- platform: cross-cutting, applies to every service -----------------
    - match: ["docs/platform/authentication-authorization/*"]
      bucket: platform
      authority: approved-spec
      capsules: [security-review, architecture-review, code-change]
      persona: security

    - match: ["docs/platform/architecture-review/*"]
      bucket: platform
      authority: approved-spec
      capsules: [architecture-review, board-review]
      persona: architecture

    # --- journey execution: per-request specification for the dev team --------
    - match: ["docs/journey-execution/flows/*"]
      bucket: platform
      authority: ai-drafted
      capsules: [code-change, architecture-review, security-review]
      persona: engineering
      note: "One use case per file. Open the one you are building; its Outcomes section is the test list."

    - match: ["docs/journey-execution/*"]
      bucket: platform
      authority: ai-drafted
      capsules: [code-change, architecture-review, security-review]
      persona: engineering
      note: "Assembly, not source of truth (HA-02). Read 01 once; then the flow file and 03."

    - match: ["docs/platform/data-architecture/schemas/*"]
      bucket: platform
      authority: ai-drafted
      capsules: [database-review]
      persona: database
      note: "Design DDL. Runtime Flyway stays in the owning service module."

    - match: ["docs/platform/data-architecture/*"]
      bucket: platform
      authority: ai-drafted
      capsules: [database-review, architecture-review]
      persona: database
      note: "Aarti R0 physical pack. AI-drafted; S07-G5 human signature outstanding."

    - match: ["docs/platform/ws3-platform/*"]
      bucket: platform
      authority: approved-spec
      capsules: [architecture-review, target-state-vision, code-change]
      persona: architecture

    - match: ["docs/platform/*"]
      bucket: platform
      authority: approved-spec
      capsules: [architecture-review]
      persona: architecture

    - match: ["docs/architecture/*"]
      bucket: platform
      authority: approved-spec
      capsules: [architecture-review, target-state-vision, orient]
      persona: architecture

    # --- business SSOT: what we are building and why -----------------------
    - match: ["docs/au-bank-insurance-platform/requirements/*", "docs/au-bank-insurance-platform/rule-packs/*"]
      bucket: business
      authority: business-ssot
      capsules: [business-analysis, product-decision]
      persona: business-analysis

    - match: ["docs/au-bank-insurance-platform/po-drive/**"]
      bucket: business
      authority: business-ssot
      capsules: [product-decision, delivery-planning]
      persona: product

    - match: ["docs/au-bank-insurance-platform/knowledge-base/*", "docs/au-bank-insurance-platform/references/*"]
      bucket: business
      authority: business-ssot
      capsules: [orient, product-decision, business-analysis]
      persona: product

    - match: ["docs/au-bank-insurance-platform/artefacts/**"]
      bucket: business
      authority: business-ssot
      capsules: [business-analysis, product-decision]
      persona: business-analysis
      note: "Source intake — PDFs and design exports. Cite the derived requirement, not the upload."

    - match: ["docs/au-bank-insurance-platform/*"]
      bucket: business
      authority: business-ssot
      capsules: [product-decision, orient]
      persona: product

    # --- 1SB module: how the adapter is built ------------------------------
    - match: ["docs/1sb-insurance-integration/field-guides/*"]
      bucket: module-1sb
      authority: engineering-ssot
      capsules: [1sb-integration-change, code-change]
      persona: engineering
      note: "Per-field mandatory/when/why. The answer to most mapping questions is one file here."

    - match: ["docs/1sb-insurance-integration/reference/extracted-schemas/*"]
      bucket: module-1sb
      authority: engineering-ssot
      capsules: [1sb-integration-change]
      persona: engineering
      note: "Raw provider payload shapes. Evidence for a mapping, never the bank's canonical model."

    - match: ["docs/1sb-insurance-integration/canonical-model/*"]
      bucket: module-1sb
      authority: engineering-ssot
      capsules: [1sb-integration-change, architecture-review]
      persona: architecture

    - match: ["docs/1sb-insurance-integration/service-ssot/**"]
      bucket: module-1sb
      authority: engineering-ssot
      capsules: [1sb-integration-change, code-change]
      persona: engineering

    - match: ["docs/1sb-insurance-integration/architecture/*"]
      bucket: module-1sb
      authority: engineering-ssot
      capsules: [1sb-integration-change, architecture-review]
      persona: architecture

    - match: ["docs/1sb-insurance-integration/api-catalog/*", "docs/1sb-insurance-integration/journeys/*", "docs/1sb-insurance-integration/reference/*"]
      bucket: module-1sb
      authority: engineering-ssot
      capsules: [1sb-integration-change]
      persona: engineering

    - match: ["docs/1sb-insurance-integration/*"]
      bucket: module-1sb
      authority: engineering-ssot
      capsules: [1sb-integration-change, orient]
      persona: engineering

    # --- figma: UX wireframe exports ---------------------------------------
    - match: ["docs/figma/**"]
      bucket: business
      authority: non-binding-context
      capsules: [product-decision, orient]
      persona: product
      note: "Figma wireframe exports. Cite the derived journey, not the PNG."

    # --- docs root ---------------------------------------------------------
    - match: ["docs/*"]
      bucket: root
      authority: navigation
      capsules: [docs-navigation, orient]
      persona: null

# ---------------------------------------------------------------------------
# Capsules — one per task intent.
# ---------------------------------------------------------------------------
capsules:

  - id: orient
    intent: "Understand the programme without making a governed decision."
    triggers: ["what is this project", "onboard", "explain the platform", "what are we building"]
    budget_bytes: 55000
    load:
      - path: "docs/context/business-problem-statement.md"
        why: "The problem, the outcome and why the platform exists."
      - path: "docs/README.md"
        why: "Where every document lives and which bucket wins on conflict."
    then_only_if:
      - condition: "the picture matters more than the prose"
        path: "docs/architecture/README.md"
      - condition: "the question is about stages, not architecture"
        path: "docs/application-lifecycle-bible/README.md"
    output: "Plain summary. No verdict, no priority, no commitment."
    never: ["Treat orientation as admission — nothing is admitted from this capsule."]

  - id: triage
    intent: "Decide whether an input is admitted, parked, rejected or escalated. Run this BEFORE any code."
    triggers: ["should we", "suggestion", "idea", "bug report", "scan finding", "review comment", "is now the right time", "can you add"]
    persona: null
    budget_bytes: 45000
    load:
      - path: ".claude/skills/aigem-triage/SKILL.md"
        why: "The 14-step pipeline, compressed. Most inputs terminate by step 5."
      - path: "docs/governance/03-LIFECYCLE.md"
        anchor: "3-stage-fit-codes-sf"
        why: "SF0–SF4 stage fit — the step that changes the verdict most often."
      - path: "docs/governance/02-PROJECT_SCOPE.md"
        anchor: "3-scope-fit-codes-l1--generic"
        why: "SC0–SC4 scope fit."
      - path: "docs/governance/00-GOVERNANCE.md"
        anchor: "6-the-action-matrix"
        why: "Stage fit + scope fit + necessity -> ADMIT | PARK | REJECT | ESCALATE."
    then_only_if:
      - condition: "the verdict is ADMIT and the item needs a priority"
        path: "docs/governance/05-PRIORITY_MODEL.md"
      - condition: "necessity is genuinely contested, or the item adds structure"
        path: "docs/governance/16-DECISION_MODEL.md"
        anchor: "6-anti-over-engineering-tests"
      - condition: "the item is blocked by or blocks other work"
        path: "docs/governance/07-DEPENDENCY_MODEL.md"
    output: "The six-line triage answer shape in BOOT.md section 8, ending with `Continuing with <item>.`"
    never:
      - "Implement in the turn the suggestion is raised."
      - "Park without a target stage and an unpark trigger."
      - "Re-report known debt or re-propose a parked item — check BOOT.md section 5 first."

  - id: plan-work
    intent: "Turn an ADMITTED item into an implementation plan and get it to READY."
    triggers: ["implementation plan", "break this down", "how do we build", "definition of ready"]
    budget_bytes: 45000
    load:
      - path: "docs/governance/10-IMPLEMENTATION_PLAN_TEMPLATE.md"
        why: "`files_expected` and `out_of_scope` are the drift contract."
      - path: "docs/governance/06-WORK_CLASSIFICATION.md"
        anchor: "5-work-breakdown--epic--story--task--spike"
        why: "One owner + one acceptance outcome = story. Two epic triggers = epic."
      - path: "docs/governance/12-DEFINITION_OF_READY.md"
        why: "The gate the plan has to pass."
    then_only_if:
      - condition: "the item is T2 or higher and needs boards"
        capsule: "board-review"
      - condition: "execution order or parallelism is in question"
        path: "docs/governance/07-DEPENDENCY_MODEL.md"
        anchor: "5-execution-ordering"
    output: "A plan against the template, with files_expected, out_of_scope and the READY checklist."
    never: ["Expand scope inside the plan. A bigger item is a new triage."]

  - id: architecture-review
    intent: "Board 1 — decide whether a design is correctly shaped, or produce an HLD/LLD/ADR."
    triggers: ["architecture review", "board 1", "service boundary", "bounded context", "should this be a service", "api design", "sync or async", "adr"]
    persona: architecture
    budget_bytes: 45000
    load:
      - path: "docs/context/personas/mahesh-architecture.card.md"
        why: "Adopt Mahesh. Owns / never / severity / escalation."
      - path: "docs/governance/11-REVIEW_GATES.md"
        anchor: "4-board-1--architecture"
        why: "The Board 1 contract and the named accountable owner."
      - path: "docs/governance/11-REVIEW_GATES.md"
        anchor: "11-verdicts"
        why: "APPROVED / APPROVED_WITH_CONDITIONS / REWORK / REJECTED and their evidence."
    then_only_if:
      - condition: "the decision is target-state, vision or North Star"
        capsule: "target-state-vision"
      - condition: "persistence, schema, migration or recovery is materially affected"
        capsule: "database-review"
      - condition: "the R0 platform design is the subject"
        path: "docs/platform/ws3-platform/03-solution-architecture-r0.md"
      - condition: "an ADR is being written"
        path: "docs/governance/templates/ADR.md"
    output: "Verdict + severity `A0`–`A3` + evidence paths + named unresolved owner/date."
    never:
      - "Impersonate the mandatory human T4 Architecture sign-off — draft only."
      - "Waive a Security or Compliance conclusion with an architecture severity."

  - id: target-state-vision
    intent: "Answer a target-state, North Star, horizon or capability-model question."
    triggers: ["target state", "north star", "vision", "future architecture", "capability model", "horizon", "where are we heading"]
    persona: architecture
    budget_bytes: 90000
    load:
      - path: "docs/context/personas/mahesh-architecture.card.md"
        why: "Rule 8: capability before service, ownership before deployment, diagram last."
      - path: "docs/context/roles/mahesh-principal-insurance-platform-architect/09-target-state-architecture-doctrine.md"
        why: "Horizons H0–H3, invariants TI-01–TI-23, variation axes. Always first."
    then_only_if:
      - condition: "the answer needs capabilities defined, not just named"
        path: "docs/context/roles/mahesh-principal-insurance-platform-architect/10-north-star-capability-model.md"
      - condition: "the axis is line of business"
        path: "docs/context/roles/mahesh-principal-insurance-platform-architect/11-line-of-business-segregation.md"
      - condition: "the axis is journey, channel or actor"
        path: "docs/context/roles/mahesh-principal-insurance-platform-architect/12-journey-segregation.md"
      - condition: "the axis is orchestration and coordination ownership"
        path: "docs/context/roles/mahesh-principal-insurance-platform-architect/13-orchestration-doctrine.md"
      - condition: "the axis is whether a capability is shared"
        path: "docs/context/roles/mahesh-principal-insurance-platform-architect/14-shared-capability-doctrine.md"
      - condition: "the axis is identity or authorization planes"
        path: "docs/context/roles/mahesh-principal-insurance-platform-architect/15-actor-identity-and-authorization.md"
      - condition: "1SB, insurers, adapters, routing or provider contracts are involved"
        path: "docs/context/roles/mahesh-principal-insurance-platform-architect/17-provider-aggregation-and-connectivity.md"
      - condition: "docs/hdl.svg is actually being produced or changed"
        path: "docs/context/roles/mahesh-principal-insurance-platform-architect/16-hld-authoring-and-update-protocol.md"
    output: "Named horizon + capability model + invariants preserved or at risk + delta from today. Diagram last."
    never:
      - "Answer a target-state question with a bigger picture instead of a capability model."
      - "Move workforce identity off Bank AD at any horizon (TI-01)."
      - "Treat 1SB as a domain dependency — it is a provider route."

  - id: product-decision
    intent: "Board 3 — decide WHAT / WHY / FOR WHOM, journey behaviour, scope, priority or acceptance."
    triggers: ["product decision", "board 3", "should the journey", "mvp scope", "acceptance criteria", "business rule", "prioritise"]
    persona: product
    budget_bytes: 40000
    load:
      - path: "docs/context/personas/rajal-product.card.md"
        why: "Adopt Rajal. Owns / never / escalation."
      - path: "docs/au-bank-insurance-platform/07-BUSINESS-CLARIFICATIONS-WORKING-DECISIONS.md"
        why: "The business MVP SSOT — the working decisions that are already made."
      - path: "docs/governance/11-REVIEW_GATES.md"
        anchor: "6-board-3--product"
        why: "The Board 3 contract."
    then_only_if:
      - condition: "the requirement is unclear, untestable or lacks exceptions"
        capsule: "business-analysis"
      - condition: "an earlier product decision may already cover it"
        path: "docs/au-bank-insurance-platform/DECISION-LOG.md"
    output: "Product verdict stated as behaviour and outcome, never as a design."
    never: ["Choose technology, waive a control, or declare QA evidence passed."]

  - id: business-analysis
    intent: "R11 — make approved intent deterministic, testable and traceable."
    triggers: ["business analysis", "r11", "requirement clarity", "process flow", "decision table", "exception handling", "acceptance criteria quality"]
    persona: business-analysis
    budget_bytes: 60000
    load:
      - path: "docs/context/personas/ba-r11-business-analysis.card.md"
        why: "Analysis authority and its hard NA boundary."
      - path: "docs/context/roles/principal-insurance-platform-business-analyst/05-journey-rules-data-and-exception-model.md"
        why: "How journeys, rules, data, state and exceptions must be expressed here."
    then_only_if:
      - condition: "the artefact will be handed to QA or a board"
        path: "docs/context/roles/principal-insurance-platform-business-analyst/06-review-evidence-and-handoff-contract.md"
      - condition: "a specialist domain is materially affected"
        path: "docs/context/personas/AUTHORITY-QUICK-CARD.md"
    output: "`READY` / `CHANGES_REQUIRED` / `NOT_READY` on analysis quality only — never a Product or specialist decision."
    never: ["Invent business intent to close a gap. Raise it to Rajal."]

  - id: security-review
    intent: "Board 4 — trust boundaries, exposure, authn/authz, crypto, secrets, API security, threat model."
    triggers: ["security review", "board 4", "is this secure", "threat model", "authentication", "authorization", "secrets", "credential", "password", "api key", "certificate", "encryption", "vulnerability", "cve", "public endpoint", "webhook", "oauth", "jwt"]
    persona: security
    budget_bytes: 45000
    load:
