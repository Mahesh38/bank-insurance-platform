      - condition: "the target is governance process"
        path: "docs/governance/README.md"
    output: "The path, and the bucket that gives it its authority."
    never: ["Conclude a document is missing without checking docs/README.md."]

  - id: context-reuse
    intent: "Reuse this context module for another project or domain."
    triggers: ["reuse the context", "another project", "portable", "scaffold context", "new project context"]
