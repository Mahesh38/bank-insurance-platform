schema_version: "1.0"
module_version: "1.0.0"

project:
  id: bank-insurance-platform
  name: "AU Bank Insurance Platform"
  domain: "regulated banking and insurance distribution"
  problem_statement: "docs/context/business-problem-statement.md"
  repository_root: "."

authority:
  context_is_binding: false
  canonical_authority: "docs/governance/PERSONA-AUTHORITY-MATRIX.md"
  precedence:
    - "docs/governance/"
    - "docs/au-bank-insurance-platform/07-BUSINESS-CLARIFICATIONS-WORKING-DECISIONS.md"
    - "docs/au-bank-insurance-platform/DECISION-LOG.md"
    - "docs/platform/"
    - "docs/1sb-insurance-integration/service-ssot/"
    - "docs/context/"

layers:
  - id: routing
    kind: routing
    path: "docs/context/AGENT-CONTEXT-INDEX.yaml"
    portable: true
    authority: none
  - id: boot
    kind: boot
    path: "docs/context/BOOT.md"
    portable: false
    authority: none
  - id: persona-cards
    kind: role
    path: "docs/context/personas/"
    portable: false
    authority: context
  - id: framework
    kind: framework
    path: "docs/context/framework/"
    portable: true
    authority: none
  - id: project
    kind: project
    path: "docs/context/business-problem-statement.md"
    portable: false
    authority: context
  - id: roles
    kind: role
    path: "docs/context/roles/"
    portable: false
    authority: context
  - id: protocols
    kind: protocol
    path: "docs/context/roles/shared/"
    portable: false
    authority: context
  - id: roadmaps
    kind: roadmap
    path: "docs/context/roadmaps/"
    portable: false
    authority: context

