# Profiles are ordered smallest first. `session-boot` is the default for every agent
# session; `capsule` is what an agent should normally use for real work. The older
# profiles remain for humans and retrieval systems that load by layer rather than by task.
loading_profiles:
  - id: session-boot
    purpose: "Know where the project is before deciding anything. Tier 0, every session."
    include: ["layer:boot"]
  - id: capsule
    purpose: "Resolve one task to its exact, budgeted read list. The default working profile."
    include: ["layer:boot", "layer:routing", "layer:persona-cards"]
    resolver: "python3 scripts/context/context-load.py resolve \"<the request>\""
  - id: orientation
    purpose: "Understand the project without making a governed decision."
    include: ["layer:project"]
  - id: governed-change
    purpose: "Prepare or review a repository change."
    include: ["layer:boot", "layer:routing", "layer:persona-cards", "layer:project", "layer:roles", "layer:protocols"]
  - id: portable-framework
    purpose: "Create a context module for another project or domain."
    include: ["layer:framework", "layer:routing"]

portability:
  scaffold_template: "docs/context/framework/templates/project/"
  scaffold_command: "python scripts/context/new-project-context.py"
  validate_command: "python scripts/context/validate-context.py"
  excluded_from_reuse:
    - "project problem statement"
    - "named personas and organisation-specific authority"
    - "banking, insurance and regulatory conclusions"
    - "active lifecycle state and delivery registers"
