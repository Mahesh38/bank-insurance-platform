<text x="672.0" y="509.0" font-size="9.5" fill="#334155">bulkheads are designed but sized against a guess. Capacity numbers derive from CAP-A1…A3, which are assumptions, not baselines</text>
<text x="672.0" y="566.0" font-size="9" fill="#b91c1c" font-weight="bold">ESCALATE IF: load test scheduled before written limits arrive</text>
