<text x="672.0" y="641.0" font-size="9.5" fill="#334155">does not block R0 (assisted-only, DEC-20260816-03) but blocks R1 entry. Deciding it late forces a session redesign</text>
<text x="672.0" y="698.0" font-size="9" fill="#b91c1c" font-weight="bold">ESCALATE IF: R1 planning starts with the decision still open</text>
