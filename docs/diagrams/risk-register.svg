<text x="672.0" y="377.0" font-size="9.5" fill="#334155">every dependency in the map has an owner; four have no required-by date agreed. A dependency without a date is not managed</text>
<text x="672.0" y="434.0" font-size="9" fill="#b91c1c" font-weight="bold">ESCALATE IF: any D-item passes its date with no escalation raised</text>
<rect x="660.0" y="456.0" width="1188.0" height="122.0" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
<text x="672.0" y="477.0" font-size="11" fill="#0f172a" font-weight="bold">AR-09 — Partner service limits and maintenance windows are unknown</text>
