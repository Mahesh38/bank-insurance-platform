<text x="803.0" y="613.0" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="bold">#14 Integration Hub</text>
<rect x="953.0" y="590.0" width="276.0" height="38.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
<text x="1091.0" y="613.0" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="bold">#16 Audit (WORM)</text>
<text x="950.0" y="668.0" font-size="9.5" fill="#475569" text-anchor="middle">ap-south-1 · private subnets · one public entry point · DR warm standby ap-south-2</text>
<rect x="52.0" y="140.0" width="340.0" height="150.0" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="66.0" y="164.0" font-size="12" fill="#0f172a" font-weight="bold">Customer</text>
<text x="66.0" y="179.0" font-size="9" fill="#3730a3" font-weight="bold">own device — its own trust zone</text>
<text x="66.0" y="197.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CROSSES</text>
<text x="66.0" y="208.0" font-size="9" fill="#334155">consent OTP · payment link · policy document</text>
<text x="66.0" y="221.5" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CONTRACT</text>
<text x="66.0" y="232.5" font-size="9" fill="#475569">one-time link, short expiry, device-bound</text>
<text x="66.0" y="246.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">ON FAILURE</text>
<text x="66.0" y="257.0" font-size="9" fill="#b91c1c">no link delivery → ops task (S-19); the journey never auto-completes</text>
<line x1="392.0" y1="215.0" x2="650.0" y2="500.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
<rect x="52.0" y="330.0" width="340.0" height="150.0" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="66.0" y="354.0" font-size="12" fill="#0f172a" font-weight="bold">Relationship Manager</text>
<text x="66.0" y="369.0" font-size="9" fill="#6b21a8" font-weight="bold">Flutter app · token-hiding session</text>
<text x="66.0" y="387.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CROSSES</text>
<text x="66.0" y="398.0" font-size="9" fill="#334155">the assisted journey — every action attributed to a named RM</text>
<text x="66.0" y="411.5" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CONTRACT</text>
<text x="66.0" y="422.5" font-size="9" fill="#475569">opaque session (S-01); tokens never reach the device</text>
<text x="66.0" y="436.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">ON FAILURE</text>
<text x="66.0" y="447.0" font-size="9" fill="#b91c1c">session lost → resume at the recorded stage; nothing is re-submitted</text>
<line x1="392.0" y1="405.0" x2="650.0" y2="557.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
<rect x="52.0" y="520.0" width="340.0" height="150.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="66.0" y="544.0" font-size="12" fill="#0f172a" font-weight="bold">Branch &amp; insurance ops</text>
<text x="66.0" y="559.0" font-size="9" fill="#065f46" font-weight="bold">exception and break handling</text>
<text x="66.0" y="577.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CROSSES</text>
<text x="66.0" y="588.0" font-size="9" fill="#334155">work items, reconciliation breaks, manual recovery</text>
<text x="66.0" y="601.5" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CONTRACT</text>
<text x="66.0" y="612.5" font-size="9" fill="#475569">every failed auto-recovery becomes an owned task (S-19)</text>
<text x="66.0" y="626.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">ON FAILURE</text>
<text x="66.0" y="637.0" font-size="9" fill="#b91c1c">unowned break → escalation; a break is never closed by ageing</text>
<line x1="392.0" y1="595.0" x2="650.0" y2="614.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
<rect x="52.0" y="710.0" width="340.0" height="150.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="66.0" y="734.0" font-size="12" fill="#0f172a" font-weight="bold">Bank workforce identity</text>
<text x="66.0" y="749.0" font-size="9" fill="#475569" font-weight="bold">Keycloak-first, provider-neutral · WS-2</text>
<text x="66.0" y="767.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CROSSES</text>
<text x="66.0" y="778.0" font-size="9" fill="#334155">who the RM is</text>
<text x="66.0" y="791.5" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CONTRACT</text>
<text x="66.0" y="802.5" font-size="9" fill="#475569">federation via identity-provider-adapter (IF-2)</text>
<text x="66.0" y="816.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">ON FAILURE</text>
<text x="66.0" y="827.0" font-size="9" fill="#b91c1c">cannot confirm identity → access denied, FAIL CLOSED</text>
<line x1="392.0" y1="785.0" x2="650.0" y2="671.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
<rect x="52.0" y="880.0" width="340.0" height="150.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="66.0" y="904.0" font-size="12" fill="#0f172a" font-weight="bold">Bank authorization (PDP)</text>
<text x="66.0" y="919.0" font-size="9" fill="#475569" font-weight="bold">RBAC + ABAC · default deny</text>
<text x="66.0" y="937.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CROSSES</text>
<text x="66.0" y="948.0" font-size="9" fill="#334155">what this RM may do, for this customer, for this insurer</text>
<text x="66.0" y="961.5" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CONTRACT</text>
<text x="66.0" y="972.5" font-size="9" fill="#475569">300 ms budget, no retry (S-02)</text>
<text x="66.0" y="986.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">ON FAILURE</text>
<text x="66.0" y="997.0" font-size="9" fill="#b91c1c">no decision returned → denied. Silence is never assent</text>
<line x1="392.0" y1="955.0" x2="650.0" y2="722.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
<rect x="1508.0" y="140.0" width="340.0" height="150.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="1522.0" y="164.0" font-size="12" fill="#0f172a" font-weight="bold">Core Banking (CBS)</text>
<text x="1522.0" y="179.0" font-size="9" fill="#475569" font-weight="bold">system of record for the customer</text>
<text x="1522.0" y="197.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CROSSES</text>
<text x="1522.0" y="208.0" font-size="9" fill="#334155">CIF · ETB customer identity and prefill</text>
<text x="1522.0" y="221.5" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CONTRACT</text>
<text x="1522.0" y="232.5" font-size="9" fill="#475569">read-only lookup (S-04 / S-05); CBS stays golden</text>
<text x="1522.0" y="246.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">ON FAILURE</text>
<text x="1522.0" y="257.0" font-size="9" fill="#b91c1c">unavailable → recent approved snapshot, else the journey waits</text>
<line x1="1508.0" y1="215.0" x2="1250.0" y2="500.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
<rect x="1508.0" y="330.0" width="340.0" height="150.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="1522.0" y="354.0" font-size="12" fill="#0f172a" font-weight="bold">AU Bank Payment Gateway</text>
<text x="1522.0" y="369.0" font-size="9" fill="#475569" font-weight="bold">3-D Secure · settlement file</text>
<text x="1522.0" y="387.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CROSSES</text>
<text x="1522.0" y="398.0" font-size="9" fill="#334155">payment session, authenticated callback, T+1 settlement</text>
<text x="1522.0" y="411.5" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CONTRACT</text>
<text x="1522.0" y="422.5" font-size="9" fill="#475569">signature + txn match + replay window (S-14 / S-15)</text>
<text x="1522.0" y="436.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">ON FAILURE</text>
<text x="1522.0" y="447.0" font-size="9" fill="#b91c1c">no callback → UNCERTAIN; the settlement file is the arbiter, never</text>
<text x="1522.0" y="457.5" font-size="9" fill="#b91c1c">optimism</text>
<line x1="1508.0" y1="405.0" x2="1250.0" y2="557.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
<rect x="1508.0" y="520.0" width="340.0" height="150.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="1522.0" y="544.0" font-size="12" fill="#0f172a" font-weight="bold">1SilverBullet (aggregator)</text>
<text x="1522.0" y="559.0" font-size="9" fill="#475569" font-weight="bold">Group A insurers · EXISTS TODAY</text>
<text x="1522.0" y="577.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CROSSES</text>
<text x="1522.0" y="588.0" font-size="9" fill="#334155">quote, proposal, underwriting status, issuance</text>
<text x="1522.0" y="601.5" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CONTRACT</text>
<text x="1522.0" y="612.5" font-size="9" fill="#475569">canonical contract at the Hub; 24 h idempotency (INV-ACL-01)</text>
<text x="1522.0" y="626.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">ON FAILURE</text>
<text x="1522.0" y="637.0" font-size="9" fill="#b91c1c">silent → recover by insurerRef (S-12); never a blind resubmit</text>
<line x1="1508.0" y1="595.0" x2="1250.0" y2="614.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
<rect x="1508.0" y="710.0" width="340.0" height="150.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="1522.0" y="734.0" font-size="12" fill="#0f172a" font-weight="bold">Messaging provider</text>
<text x="1522.0" y="749.0" font-size="9" fill="#475569" font-weight="bold">SMS · email</text>
<text x="1522.0" y="767.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CROSSES</text>
<text x="1522.0" y="778.0" font-size="9" fill="#334155">OTP and payment-link delivery to the customer only</text>
<text x="1522.0" y="791.5" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CONTRACT</text>
<text x="1522.0" y="802.5" font-size="9" fill="#475569">sender approval; delivery status tracked</text>
<text x="1522.0" y="816.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">ON FAILURE</text>
<text x="1522.0" y="827.0" font-size="9" fill="#b91c1c">delivery failure → ops task; the message is never silently dropped</text>
<line x1="1508.0" y1="785.0" x2="1250.0" y2="671.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
<rect x="1508.0" y="880.0" width="340.0" height="150.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="1522.0" y="904.0" font-size="12" fill="#0f172a" font-weight="bold">Compliance · audit · risk</text>
<text x="1522.0" y="919.0" font-size="9" fill="#475569" font-weight="bold">reads evidence, does not write it</text>
<text x="1522.0" y="937.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CROSSES</text>
<text x="1522.0" y="948.0" font-size="9" fill="#334155">reconstruction of any journey, on demand</text>
<text x="1522.0" y="961.5" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">CONTRACT</text>
<text x="1522.0" y="972.5" font-size="9" fill="#475569">append-only chain, 7-year WORM retention</text>
<text x="1522.0" y="986.0" font-size="8" fill="#64748b" font-weight="bold" letter-spacing="0.5">ON FAILURE</text>
<text x="1522.0" y="997.0" font-size="9" fill="#b91c1c">incomplete evidence → the journey cannot reach SOLD (INV-JRN-05)</text>
<line x1="1508.0" y1="955.0" x2="1250.0" y2="722.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
<text x="52.0" y="108.0" font-size="10" fill="#64748b" font-weight="bold" letter-spacing="1">THE BANK'S SIDE</text>
<text x="1508.0" y="108.0" font-size="10" fill="#64748b" font-weight="bold" letter-spacing="1">SYSTEMS THE PLATFORM DEPENDS ON BUT DOES NOT CONTROL</text>
<rect x="52.0" y="1000.0" width="1796.0" height="52.0" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="68.0" y="1019.0" font-size="12" fill="#065f46" font-weight="bold">Every external edge fails closed, and every failure has a named landing place</text>
<text x="68.0" y="1035.0" font-size="9.5" fill="#475569">No edge above degrades into an assumption. Identity that cannot be confirmed denies access; a payment that cannot be reconciled stays UNCERTAIN; an insurer that does not answer is recovered by reference. The platform never converts silence into success.</text>
<text x="52.0" y="1058.0" font-size="9.5" fill="#64748b" font-weight="bold">DRAFT FOR REVIEW · v0.2 · not approved, not authorised for development · AI-drafted; no human signature</text>
