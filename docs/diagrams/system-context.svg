<text x="950.0" y="480.0" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="bold">WS-3 · 12 services + 1 Flutter app at R0</text>
<rect x="665.0" y="498.0" width="276.0" height="38.0" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
<text x="803.0" y="521.0" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="bold">#9 Journey</text>
