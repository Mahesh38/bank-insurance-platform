<text x="563.0" y="790.0" font-size="8.8" fill="#64748b" text-anchor="middle">one store per service · Multi-AZ · PITR</text>
<path d="M708.0,749 a121.0,9 0 0 1 242.0,0 v66 a121.0,9 0 0 1 -242.0,0 z" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
