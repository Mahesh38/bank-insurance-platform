<text x="829.0" y="790.0" font-size="8.8" fill="#64748b" text-anchor="middle">journey state · quote jobs · PITR</text>
<path d="M974.0,749 a121.0,9 0 0 1 242.0,0 v66 a121.0,9 0 0 1 -242.0,0 z" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
<ellipse cx="1095.0" cy="749" rx="121.0" ry="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
<text x="1095.0" y="776.0" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="bold">S3 + Object Lock</text>
<text x="1095.0" y="790.0" font-size="8.8" fill="#64748b" text-anchor="middle">raw payloads · policy docs · 7-yr WORM · replicated</text>
<text x="1095.0" y="800.0" font-size="8.8" fill="#64748b" text-anchor="middle">ap-south-2</text>
<path d="M1240.0,749 a121.0,9 0 0 1 242.0,0 v66 a121.0,9 0 0 1 -242.0,0 z" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
<ellipse cx="1361.0" cy="749" rx="121.0" ry="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
<text x="1361.0" y="776.0" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="bold">Secrets Manager + KMS</text>
<text x="1361.0" y="790.0" font-size="8.8" fill="#64748b" text-anchor="middle">per-service credentials · CMK hierarchy · rotation</text>
<text x="442.0" y="852.0" font-size="9.5" fill="#065f46" font-weight="bold">No cross-service database access. ArchUnit asserts it in the build; IAM denies it at runtime; the S09 IaC scan proves the policy is deployed (ARCH-004).</text>
<text x="442.0" y="900.0" font-size="9.5" fill="#475569">Lower environments never receive live customer data — generated or masked only. Personal data, backups, logs and archives stay in ap-south-1 / ap-south-2.</text>
<text x="52.0" y="1010.0" font-size="10" fill="#64748b" font-weight="bold" letter-spacing="1">BOUNDARY CROSSINGS — THE ONLY WAYS IN, AND WHAT PROVES EACH CONTROL</text>
<rect x="52.0" y="1024.0" width="1796.0" height="25.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="60.0" y="1039.9" font-size="9" fill="#0f172a" font-weight="bold">Boundary</text>
<text x="200.0" y="1039.9" font-size="9" fill="#0f172a" font-weight="bold">What may cross</text>
<text x="530.0" y="1039.9" font-size="9" fill="#0f172a" font-weight="bold">Control that enforces it</text>
<text x="1020.0" y="1039.9" font-size="9" fill="#0f172a" font-weight="bold">What proves it works</text>
<text x="1500.0" y="1039.9" font-size="9" fill="#0f172a" font-weight="bold">Human sign-off</text>
<text x="60.0" y="1064.9" font-size="9" fill="#0f172a" font-weight="bold">Z0 → Z1</text>
<text x="200.0" y="1064.9" font-size="9" fill="#334155">customer / RM HTTPS request</text>
<text x="530.0" y="1064.9" font-size="9" fill="#334155">TLS · WAF · rate limit · opaque session (S-01)</text>
<text x="1020.0" y="1064.9" font-size="9" fill="#334155">session-forgery and rate-limit tests</text>
<text x="1500.0" y="1064.9" font-size="9" fill="#b45309" font-weight="bold">Pending — Deepali</text>
<line x1="52.0" y1="1074.0" x2="1848.0" y2="1074.0" stroke="#cbd5e1" stroke-width="0.8"/>
<rect x="52.0" y="1074.0" width="1796.0" height="25.0" rx="0" fill="#f8fafc"/>
<text x="60.0" y="1089.9" font-size="9" fill="#0f172a" font-weight="bold">Z1 → Z2</text>
<text x="200.0" y="1089.9" font-size="9" fill="#334155">authenticated, authorised request only</text>
<text x="530.0" y="1089.9" font-size="9" fill="#334155">PDP decision required; the owning service re-checks (default deny)</text>
<text x="1020.0" y="1089.9" font-size="9" fill="#334155">FF-01 · negative access tests per role and branch</text>
<text x="1500.0" y="1089.9" font-size="9" fill="#b45309" font-weight="bold">Pending — Deepali</text>
<line x1="52.0" y1="1099.0" x2="1848.0" y2="1099.0" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="60.0" y="1114.9" font-size="9" fill="#0f172a" font-weight="bold">Z2 → Z2</text>
<text x="200.0" y="1114.9" font-size="9" fill="#334155">service-to-service call</text>
<text x="530.0" y="1114.9" font-size="9" fill="#334155">distinct service identity, least privilege, mTLS</text>
<text x="1020.0" y="1114.9" font-size="9" fill="#334155">IAM policy test; ArchUnit boundary rules</text>
<text x="1500.0" y="1114.9" font-size="9" fill="#b45309" font-weight="bold">Pending</text>
<line x1="52.0" y1="1124.0" x2="1848.0" y2="1124.0" stroke="#cbd5e1" stroke-width="0.8"/>
<rect x="52.0" y="1124.0" width="1796.0" height="25.0" rx="0" fill="#f8fafc"/>
<text x="60.0" y="1139.9" font-size="9" fill="#0f172a" font-weight="bold">Z2 → Z3</text>
<text x="200.0" y="1139.9" font-size="9" fill="#334155">a service reaching ONLY its own store</text>
<text x="530.0" y="1139.9" font-size="9" fill="#334155">per-service credentials from KMS; no shared account</text>
<text x="1020.0" y="1139.9" font-size="9" fill="#334155">cross-store access attempt must fail (ARCH-004)</text>
<text x="1500.0" y="1139.9" font-size="9" fill="#b45309" font-weight="bold">Pending — Aarti</text>
<line x1="52.0" y1="1149.0" x2="1848.0" y2="1149.0" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="60.0" y="1164.9" font-size="9" fill="#0f172a" font-weight="bold">Z2 → Z0 egress</text>
<text x="200.0" y="1164.9" font-size="9" fill="#334155">provider traffic, from #14 only</text>
<text x="530.0" y="1164.9" font-size="9" fill="#334155">fixed outbound route · mTLS · credential rotation with emergency removal</text>
<text x="1020.0" y="1164.9" font-size="9" fill="#334155">rotation exercise; egress allow-list test</text>
<text x="1500.0" y="1164.9" font-size="9" fill="#b45309" font-weight="bold">Pending — SEC-03</text>
<line x1="52.0" y1="1174.0" x2="1848.0" y2="1174.0" stroke="#cbd5e1" stroke-width="0.8"/>
<rect x="52.0" y="1174.0" width="1796.0" height="25.0" rx="0" fill="#f8fafc"/>
<text x="60.0" y="1189.9" font-size="9" fill="#0f172a" font-weight="bold">Z0 → Z2 callback</text>
<text x="200.0" y="1189.9" font-size="9" fill="#334155">PG payment callback</text>
<text x="530.0" y="1189.9" font-size="9" fill="#334155">signature + transaction match + replay window (S-14)</text>
<text x="1020.0" y="1189.9" font-size="9" fill="#334155">forged, replayed and delayed callback tests</text>
<text x="1500.0" y="1189.9" font-size="9" fill="#b45309" font-weight="bold">Pending — SEC-05</text>
<line x1="52.0" y1="1199.0" x2="1848.0" y2="1199.0" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="60.0" y="1214.9" font-size="9" fill="#0f172a" font-weight="bold">Any → Z3 audit</text>
<text x="200.0" y="1214.9" font-size="9" fill="#334155">evidence write</text>
<text x="530.0" y="1214.9" font-size="9" fill="#334155">insert-only; UPDATE and DELETE rejected at the store</text>
<text x="1020.0" y="1214.9" font-size="9" fill="#334155">FF-10 deletion-refusal test, evidence retained</text>
<text x="1500.0" y="1214.9" font-size="9" fill="#b45309" font-weight="bold">Pending — SEC-06</text>
