# Legacy ID prefixes used by the existing product backlog. These are ID
# namespaces, NOT work types — TECH-004 is an INFRA or NFR item that happens to
# carry a TECH- identifier. Keeping them here stops them being mistaken for
# classification values again.
id_prefixes:
  FUNC: "functional story"
  NFR: "non-functional story"
  COMP: "compliance story"
  TECH: "technical enabler — classify as INFRA, NFR or ARCH"
  SHARED: "shared library story — classify as INFRA or ARCH"
  TD: "tech debt ledger entry"
  QA: "test backlog entry"

# ---------------------------------------------------------------------------
# Known debt — do not re-report (01 §6, Rule CS-2)
# ---------------------------------------------------------------------------
known_open_debt: [TD-006, TD-007, TD-009, TD-010, TD-014, TD-022, TD-023, QA-001]

registers:
  suggestions: "docs/governance/registers/SUGGESTION-REGISTER.md"
  parked: "docs/governance/registers/PARKED-BACKLOG.md"
  decisions: "docs/governance/registers/DECISION-REGISTER.md"
  dependencies: "docs/governance/registers/DEPENDENCY-REGISTER.md"
  risks: "docs/governance/registers/RISK-REGISTER.md"
  assumptions: "docs/governance/registers/ASSUMPTION-REGISTER.md"

# ---------------------------------------------------------------------------
# ID allocation
#
# Agent-minted, high-frequency IDs (SUG, DEP) are COLLISION-RESISTANT rather
# than sequential: two agents on two branches reading the same counter would
# mint the same ID, and resolving the YAML merge conflict does not repair the
# register rows and backlinks that already point at it.
#
# Format: <PREFIX>-<YYYYMMDD>-<3 chars from [0-9a-z]>   e.g. SUG-20260812-a1b
# Legacy 4-digit IDs (SUG-0043) remain valid for records minted before this
# change and for illustrative examples in the framework documents.
#
# Human-owned, low-frequency registers stay sequential — they have a single
# owner, so the counter is safe. `next` values below are the first UNUSED
# number, verified against the registers by FreshnessCheck.
# ---------------------------------------------------------------------------
id_allocation:
  collision_resistant: [SUG, DEP]
  pattern: "^(SUG|DEP)-[0-9]{8}-[0-9a-z]{3}$"
  legacy_pattern: "^(SUG|DEP)-[0-9]{4}$"
  sequential:
    # Advanced 2026-08-24 by the R0 robustness round (CR-012). ID-allocation correction only:
    # no stage, scope or gate field is touched by it — those remain human-owned (04 section 5).
    # CR-011 existed as a file from 2026-08-20 without a register row, so the counter read 11
    # while CR-011 was in use; it is now indexed in the decision register and the counter clears
    # both it and CR-012.
    # Advanced 2026-08-29 by the GitLab estate migration Phase M0 round (CR-014 / CR-015).
    # ID-allocation correction only: no stage, scope or gate field is touched — those remain
    # human-owned (04 section 5).
    # Advanced 2026-08-31 by CR-017 (orphan import + file-level workbench).
    # ID-allocation correction only: no stage, scope or gate field is touched — those remain
    # human-owned (04 section 5).
    CR: 18        # CR-001..017 in use (017 = orphan import + file-level workbench)
    RISK: 31      # RISK-001..030 in use (029 = sealed bundle custody; 030 = workbench git-sync temptation)
    ASM: 23       # ASM-001..022 in use (012..022 = the eleven bank enterprise inputs)
    EPIC: 2       # EPIC-001 in use (platform error contract, SUG-20260827-err). ID-allocation only.
    SPIKE: 1
    # ADR-001..003 were written into architecture-review/08 under CR-010 while this counter still
    # read 1; that file carries a standing note asking for the advance. ADR-004..007 were added by
    # the 2026-08-20 HLD review round (SUG-20260820-hr0); ADR-008 by the same day's decision round
    # (SUG-20260820-dc4). All are indexed in the decision register,
    # which FreshnessCheck scans — so the counter had to move or every agent would halt on a
    # collision warning. This is an ID-allocation correction only. No stage, scope or gate field is
    # touched by it; those remain human-owned (04 section 5).
    # ADR-009..013 were added by the 2026-08-24 R0 robustness round (CR-012, SUG-20260824-gp1..gp5).
    # ADR-017 was added by the 2026-08-27 platform error contract round (SUG-20260827-err), and
    # EPIC-001 by the same round. ID-allocation correction only. No stage, scope or gate field is
    # touched by it; those remain human-owned (04 section 5).
    ADR: 21        # ADR-001..020 in use (020 = GitLab orphan import + file-level workbench, CR-017). ID-allocation only.
