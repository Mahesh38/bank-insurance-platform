# ---------------------------------------------------------------------------
# Standing constraints — violating one of these is SF4/REJECT (01 §5)
# ---------------------------------------------------------------------------
standing_constraints:
  - "Bank apps never call 1SB or a database directly"
  - "1SB specifics live only in adapter.onesb.* (ArchUnit enforced)"
  - "1sb-integration-service owns no Flyway migrations and no JPA"
  - "Persistence is platform-common, not 1SB-owned"
  - "Flutter never receives OAuth tokens; the BFF holds them"
  - "Keycloak is not the source of truth for business authorization"
  - "No PII in logs"
  - "OpenAPI specs are local/dev only — never served on UAT or production (CR-002)"
  - "Coverage gates: libs line >= 80% / branch >= 70%; services on interim floor"

# ---------------------------------------------------------------------------
# Routing — where ADMITTED work goes (08 §3)
#
# Keys are EXACTLY the 16 canonical work types in 06-WORK_CLASSIFICATION §2 —
# no more, no fewer. ci-checks.py asserts this closure, so a new work type
# cannot be added to the model without also being given a home.
#
# Values are LISTS because several types have two homes: an ARCH item needs an
# ADR *and* a backlog entry; a risk-bearing SEC or COMP item needs a backlog
# entry *and* a risk register row.
# ---------------------------------------------------------------------------
