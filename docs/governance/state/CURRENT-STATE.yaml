# AIGEM — Machine-readable current state
#
# This is the FIRST file every AI agent reads. Pipeline step 1 (Context Resolution)
# depends entirely on it. See 01-CURRENT_STATE.md for the narrative form.
#
# Rule CS-1: if this file is missing, malformed, or past review_due, agents HALT
# triage and report the gap rather than guessing.
# Rule (04 §5): agents MUST NOT edit current_phase / stage_status. Human only.

