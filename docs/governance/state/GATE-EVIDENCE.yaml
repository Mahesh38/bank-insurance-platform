# 2026-09-11 — R12 (Kalpana seat) gate-evidence sweep, run with the CURRENT-STATE.yaml freshness
# refresh. Three things happened here and they are deliberately different actions:
#
#  1. EVIDENCE ASSEMBLED. Criteria whose mechanism now demonstrably exists carry that evidence in
#     `evidence:` and a `last_verified_at` date. Assembling evidence is not passing a gate.
#     `policy.mode` is still proposal-only, `human_pass_required` is still true, and every
#     `approvals:` list is still empty. No criterion was set MET or WAIVED by this sweep.
#
#  2. BLOCKER AGEING CORRECTED. Every follow-up date in this file had passed — the newest by 12
#     days, the oldest by 21. A follow-up date in the past is not a tracked dependency, it is a
#     hope (Rule DEP-3). Each one is re-dated below against its named owner, with the delivery
#     severity that set the window: DL1 = 2 working days (2026-09-15), DL2 = 5 (2026-09-18).
#     R12 sets the date and names the owner. R12 does not supply the answer (Rule PA-1).
#
#  3. GAPS NAMED. Where a criterion is short of its own S08-VT validation test, the missing half
#     is stated rather than averaged into "in progress" — static analysis (G4), container image
#     scanning (G5), the log-scan test (G7), the shared integration harness (G6).

