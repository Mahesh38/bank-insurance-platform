problem: >
  Login BRD rules for OTP, lock and Unlock User are tables of prose.
  Implementers need deterministic algorithms traced to rule IDs.

description: >
  Publish 23-auth-module-flows-and-algorithms.md with pseudocode for captcha,
  credential verify (host-agnostic), password failure/lock, OTP issue/verify/resend,
  unlock outcome matrix, and partner password policy. Conflicts stay OPEN.

acceptance_criteria:
  - id: AC-1
    given: "OTP algorithm"
