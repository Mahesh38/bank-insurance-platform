    then: "the OTP session ends and the account is not locked"
  - id: AC-2
    given: "lock algorithm"
    when: "the third consecutive wrong password arrives"
    then: "VAL-008 and Unlock User are required"
  - id: AC-3
    given: "set-password algorithm"
    when: "it succeeds"
    then: "the user is not authenticated (BR-PWD-002)"

