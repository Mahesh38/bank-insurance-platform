openapi: 3.1.0
info:
  title: journey-orchestration-service internal API
  version: 1.0.0-draft
  summary: 'Journey (#9) — the sale saga: stage machine, references, commands to exactly one owning service each.'
  description: |
    **Status:** AI-DRAFTED 2026-10-22 under owner decisions D3, D4, D5 (`D-024`), ADR-024/025/027 and
    DECISIONS-2026-10-22 (E1, E4, C1, C2, C5, engineering decision `ED-R2-01`), awaiting Mahesh
    (architecture) and Rajal (journey behaviour) review. Code status: SKELETON.

    * C1 (strict): at `INITIATED` the checkpoint `BEFORE_SUITABILITY` (`CNS-DP` + `CNS-SOL`) must be
      satisfied before `startNeedAnalysis`; capture runs through `checkOrCaptureConsent`.
    * Stage order (owner, D5): `INITIATED → NEED_ANALYSIS → SUITABILITY_COMPLETE →` consent check /
      capture at checkpoint `BEFORE_MULTI_QUOTE` (`CNS-QSH` + re-check of DP/SOL, from `CONSENT.POLICY`) `→ CONSENT_CAPTURED
      → QUOTING → QUOTE_SELECTED → PROPOSAL_IN_PROGRESS →` (`BEFORE_PROPOSAL_SUBMIT`) `UNDERWRITING →
      PAYMENT_PENDING → PAYMENT_SETTLED → ISSUANCE_PENDING → ISSUED → SOLD`.
    * Journey coordinates, it never decides (INV-JRN-02): no outcome, price or UW decision is stored.
      Refs to other contexts live in `journey_ref`; downstream calls take refs from there, never from
      the request body.
    * Every command: BFF → Journey (S-03, **4 s** read) → owning service(s) with a server-derived
      `Idempotency-Key` `journey:{journeyId}:{command}[:{n}]`; callee commits first, then one local
      transaction (stage + ref + transition + outbox + idempotency). No 2PC.
    * **Nested budgets (`ED-R2-01`, conventions/idempotency-timeouts-retries.md §2.2):** a command
      that makes one owning call answers synchronously (deadline 3.5 s). A command that chains calls
      (`startNeedAnalysis`, `evaluateSuitability`, `checkOrCaptureConsent`, `requestQuote`,
      `submitProposal`, `initiatePayment`, `retryPartySnapshot`) answers **`202 Accepted`** with a
      `JourneyCommand` and `Location: /internal/v1/journeys/{journeyId}/commands/{commandId}`; a
      worker completes it within `journey.command.deadline.<command>`. Same `Idempotency-Key` → same
      `commandId`. A command that misses its deadline is `FAILED` (`UPSTREAM_TIMEOUT`) with the stage
      unchanged.
    * `startJourney` creates the journey synchronously (PDP + Lead read) at `INITIATED` with
      `partySnapshotRef = null` and starts the party snapshot (S-04, 7 s, no retry at journey) as a
      command; `nextAction = AWAIT_PARTY_SNAPSHOT`, then `RETRY_PARTY_SNAPSHOT` if it fails (R0-HLD
      S-04 "hold at INITIATED"); the journey cannot leave `INITIATED` until the snapshot exists.
    * E4: a journey in `HALTED_CONSENT_WITHDRAWN` refuses every command with
      `403 JOURNEY_HALTED_CONSENT_WITHDRAWN`.
servers:
  - url: http://journey-orchestration-service:8095
    description: Cluster-private (INTERNAL, layer L6).
tags:
  - name: journey
  - name: need-analysis
  - name: consent
  - name: quote-to-pay
paths:
  /internal/v1/journeys:
    post:
      tags: [journey]
      operationId: startJourney
      summary: Start a journey for an assigned, exception-cleared lead → INITIATED.
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartJourneyRequest'
      responses:
        '200':
          description: An open journey already exists for this lead (ux_journey_lead_open) — returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '201':
          description: Created at INITIATED; the party snapshot runs as a command (`pendingCommandId`, nextAction AWAIT_PARTY_SNAPSHOT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '400':
          $ref: '#/components/responses/MissingIdempotencyKey'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/journeys/{journeyId}:
    get:
      tags: [journey]
      operationId: getJourney
      summary: Stage, references and next action. Partner reps see a journey only when partner-visible (else 404).
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '200':
          description: Journey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/journeys/{journeyId}/commands/{commandId}:
    get:
      tags: [journey]
      operationId: getJourneyCommand
      summary: Status of an accepted (202) chained command — PENDING, SUCCEEDED (with the result) or FAILED (with the problem).
      description: |
        `ED-R2-01`: the client polls this (or `getJourney`) after a `202`. Retained for the
        idempotency window (24 h).
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/JourneyId'
        - name: commandId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Command status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyCommand'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/journeys/{journeyId}/transitions:
    post:
      tags: [journey]
      operationId: applyTransition
      summary: Generic command endpoint (HLD §5.3) — R0 commands without an owning-service call.
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JourneyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command, expectedVersion]
              properties:
                command:
                  type: string
                  enum: [ABANDON]
                reasonCode:
                  type: string
                  maxLength: 40
                expectedVersion:
                  type: integer
      responses:
        '200':
          $ref: '#/components/responses/JourneyOk'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /internal/v1/journeys/{journeyId}/party-snapshot:
    post:
      tags: [journey]
      operationId: retryPartySnapshot
      summary: Retry S-04 for a journey held at INITIATED without a party snapshot.
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/journeys/{journeyId}/need-analysis:
    post:
      tags: [need-analysis]
      operationId: startNeedAnalysis
      summary: INITIATED → NEED_ANALYSIS. Requires checkpoint BEFORE_SUITABILITY satisfied (CNS-DP + CNS-SOL, C1), then Suitability create (S-07). Chained → 202.
      description: |
        C1 (strict seed of `CONSENT.POLICY`): suitability collects income, dependants and liabilities,
        so data-processing and suitability consent must already be held. Not satisfied →
        `403 CONSENT_REQUIRED` (or `CONSENT_EXPIRED`), `nextAction = CAPTURE_CONSENT`; the RM runs
        `checkOrCaptureConsent` at `INITIATED`. Statement not approved → `403 CONSENT_STATEMENT_NOT_APPROVED` (C7).
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/journeys/{journeyId}/need-analysis/answers:
    put:
      tags: [need-analysis]
      operationId: saveNeedAnalysisAnswers
      summary: Forward a screen of answers to Suitability; stage stays NEED_ANALYSIS.
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JourneyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [screenId, answers]
              properties:
                screenId:
                  type: string
                  maxLength: 40
                answers:
                  type: object
                  propertyNames:
                    pattern: '^SQ-[0-9]{2}$'
                  additionalProperties:
                    type: [string, number, boolean]
      responses:
        '200':
          $ref: '#/components/responses/JourneyOk'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/journeys/{journeyId}/suitability:
    post:
      tags: [need-analysis]
      operationId: evaluateSuitability
      summary: NEED_ANALYSIS → SUITABILITY_COMPLETE (Suitability evaluate). Also used for a correction from SUITABILITY_COMPLETE / CONSENT_CAPTURED.
      description: |
        Records ref `suitabilityId` + `evaluationId` and calls Suitability `usages`. The stage moves on
        a completed evaluation whatever its outcomes — the gate is enforced by Quotation (C1).
        `nextAction` is `CAPTURE_CONSENT`, `ACKNOWLEDGE_DISCLOSURE` or `REVISE_NEED_ANALYSIS`, derived
        from the evaluation response and not stored (INV-JRN-02).
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JourneyId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                correction:
                  type: boolean
                  default: false
                  description: true = start a superseding assessment (INV-SUI-01); stage returns to NEED_ANALYSIS.
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/journeys/{journeyId}/suitability/acknowledgements:
    post:
      tags: [need-analysis]
      operationId: acknowledgeSuitabilityDisclosure
      summary: Forward an OTP-verified caution / replacement acknowledgement to Suitability. Stage unchanged.
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JourneyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, productClass, reasonCodes, disclosureId, disclosureVersion, otpTxnId, verificationMode]
              properties:
                kind:
                  type: string
                  enum: [CAUTION, REPLACEMENT]
                productClass:
                  type: string
                  enum: [TERM, SAVINGS, ULIP]
                reasonCodes:
                  type: array
                  items:
                    type: string
                disclosureId:
                  type: string
                disclosureVersion:
                  type: string
                otpTxnId:
                  type: string
                verificationMode:
                  type: string
                  enum: [CUSTOMER_DEVICE, RM_RELAYED]
      responses:
        '200':
          $ref: '#/components/responses/JourneyOk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/journeys/{journeyId}/consents:
    post:
      tags: [consent]
      operationId: checkOrCaptureConsent
      summary: Check the stage's consent checkpoint; advance when satisfied, else start capture of the missing purposes only.
      description: |
        Checkpoint is derived from the stage, never chosen by the client: `INITIATED` (snapshot
        present) → `BEFORE_SUITABILITY` (C1); `SUITABILITY_COMPLETE` → `BEFORE_MULTI_QUOTE`;
        `PROPOSAL_IN_PROGRESS` → `BEFORE_PROPOSAL_SUBMIT` (named insurer from the selected offer).
        Chained (check 2 s + capture 3 s) → `202` with a `JourneyCommand` (`ED-R2-01`); its `result`
        is the `Journey` when satisfied (at `BEFORE_MULTI_QUOTE` the stage moves to `CONSENT_CAPTURED`;
        at `BEFORE_SUITABILITY` the stage stays `INITIATED` with `nextAction = START_NEED_ANALYSIS`)
        or `ConsentCaptureStarted` when a capture of the missing purposes began; the stage is unchanged
        until `ConsentGranted` (customer device only, C2) re-runs the check.
        `captureBlocked` from Consent (a statement not `APPROVED`, C7) → command `FAILED` with
        `403 CONSENT_STATEMENT_NOT_APPROVED`; no capture is started.
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/journeys/{journeyId}/consents/{challengeId}/verify:
    post:
      tags: [consent]
      operationId: verifyConsentRelayed
      summary: RM-relayed OTP verification — refused (403 FORBIDDEN) under the strict seed (C2, verificationModes = [CUSTOMER_DEVICE]); kept only for a Compliance-approved relaxation.
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JourneyId'
        - name: challengeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [otpTxnId, otp]
              properties:
                otpTxnId:
                  type: string
                otp:
                  type: string
                  pattern: '^[0-9]{4,8}$'
                  writeOnly: true
      responses:
        '200':
          $ref: '#/components/responses/JourneyOk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/journeys/{journeyId}/quotes:
    post:
      tags: [quote-to-pay]
      operationId: requestQuote
      summary: CONSENT_CAPTURED (or QUOTING, re-quote) → QUOTING. Re-checks BEFORE_MULTI_QUOTE immediately before calling Quotation.
      description: |
        Owner D5: "before calling the multi-quote API the platform checks for a valid consent". A
        consent that expired or was withdrawn since `CONSENT_CAPTURED` → `403 CONSENT_REQUIRED` /
        `CONSENT_EXPIRED`, stage unchanged. Quotation receives `evaluationId` and consent refs **from
        journey_ref**; its gate (`SUITABILITY.GATE`, C5) answers `403 SUITABILITY_REQUIRED` or
        `422 SUITABILITY_INCOMPLETE` (insufficient data, or a caution not acknowledged on the
        customer's own device), propagated. Chained → `202` command.
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JourneyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCommand'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/journeys/{journeyId}/quotes/{quoteId}/selection:
    post:
      tags: [quote-to-pay]
      operationId: selectOffer
      summary: QUOTING → QUOTE_SELECTED (Quotation select).
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JourneyId'
        - $ref: '#/components/parameters/QuoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [offerId]
              properties:
                offerId:
                  $ref: '#/components/schemas/Ulid'
                divergenceReasonCode:
                  type: ['string', 'null']
                  description: SUIT-R44 — when the selection is not the top-ranked offer.
      responses:
        '200':
          $ref: '#/components/responses/JourneyOk'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/journeys/{journeyId}/proposals:
    post:
      tags: [quote-to-pay]
      operationId: createProposal
      summary: QUOTE_SELECTED → PROPOSAL_IN_PROGRESS (Proposal create from the selected offer ref).
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '201':
          $ref: '#/components/responses/JourneyCreated'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/journeys/{journeyId}/proposals/{proposalId}/submit:
    post:
      tags: [quote-to-pay]
      operationId: submitProposal
      summary: PROPOSAL_IN_PROGRESS → UNDERWRITING. Requires BEFORE_PROPOSAL_SUBMIT satisfied (CNS-SHR for the named insurer).
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JourneyId'
        - name: proposalId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/journeys/{journeyId}/payments:
    post:
      tags: [quote-to-pay]
      operationId: initiatePayment
      summary: UNDERWRITING (UW approved, E1) → PAYMENT_PENDING (Payment initiate; link to the customer device). 202 command — the gateway session (S-13, up to 15 s) is outside the S-03 budget.
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JourneyId'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  parameters:
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client key from NIP-APP, forwarded by the BFF. Journey derives its own keys for the hops it makes.
      schema:
        type: string
        maxLength: 128
    JourneyId:
      name: journeyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    Stage:
      type: string
      enum:
        - INITIATED
        - NEED_ANALYSIS
        - SUITABILITY_COMPLETE
        - CONSENT_CAPTURED
        - QUOTING
        - QUOTE_SELECTED
        - PROPOSAL_IN_PROGRESS
        - UNDERWRITING
        - PAYMENT_PENDING
        - PAYMENT_SETTLED
        - ISSUANCE_PENDING
        - ISSUED
        - SOLD
        - ABANDONED
        - DECLINED
        - HALTED_CONSENT_WITHDRAWN
        - COMPENSATING
        - COMPENSATED
        - MANUAL_INTERVENTION
    NextAction:
      type: string
      enum:
        - AWAIT_PARTY_SNAPSHOT
        - RETRY_PARTY_SNAPSHOT
        - START_NEED_ANALYSIS
        - COMPLETE_NEED_ANALYSIS
        - ACKNOWLEDGE_DISCLOSURE
        - REVISE_NEED_ANALYSIS
        - CAPTURE_CONSENT
        - AWAIT_CONSENT_VERIFICATION
        - REQUEST_QUOTE
        - AWAIT_QUOTES
        - SELECT_OFFER
        - COMPLETE_PROPOSAL
        - AWAIT_UNDERWRITING
        - INITIATE_PAYMENT
        - AWAIT_PAYMENT
        - AWAIT_ISSUANCE
        - OPERATIONS
        - NONE
    StartJourneyRequest:
      type: object
      additionalProperties: false
      required: [leadId, customerId, lob, channel]
      properties:
        leadId:
          $ref: '#/components/schemas/Ulid'
        customerId:
          $ref: '#/components/schemas/Ulid'
          description: Platform customerId (D3). Must equal the lead's customerId.
        lob:
          type: string
          enum: [LIFE]
        channel:
          type: string
          enum: [RM_ASSISTED, SELF_SERVICE, HYBRID]
          description: DDL vocabulary. R0 accepts RM_ASSISTED only; the earlier `ASSISTED` is not accepted.
    Journey:
      type: object
      required: [journeyId, leadId, customerId, lob, productClass, channel, stage, nextAction, nextActionDueAt, refs, version]
      properties:
        journeyId:
          $ref: '#/components/schemas/Ulid'
        leadId:
          $ref: '#/components/schemas/Ulid'
        customerId:
          $ref: '#/components/schemas/Ulid'
        lob:
          type: string
        productClass:
          type: string
          enum: [TERM, SAVINGS, ULIP]
          description: Copied from the lead at start (routing key for suitability, not a decision).
        channel:
          type: string
        stage:
          $ref: '#/components/schemas/Stage'
        nextAction:
          $ref: '#/components/schemas/NextAction'
        nextActionDueAt:
          type: string
          format: date-time
        partySnapshotRef:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        refs:
          type: object
          description: 'journey_ref rows. Keys: suitabilityId, evaluationId, consent:CNS-DP, consent:CNS-SOL, consent:CNS-QSH, consent:CNS-SHR, consent:CNS-COM, consentChallengeId, quoteId, offerId, proposalId, paymentId, policyId, applicationNumber, policyNumber, provider.'
          additionalProperties:
            type: string
        pendingConsentChallengeId:
          type: ['string', 'null']
        pendingCommandId:
          type: ['string', 'null']
          description: The accepted chained command still running for this journey (ED-R2-01), if any.
        compensation:
          type: ['object', 'null']
          properties:
            failurePoint:
              type: string
            attempts:
              type: integer
            ownerTaskId:
              type: string
        version:
          type: integer
    ConsentCaptureStarted:
      type: object
      required: [journey, challengeId, checkpoint, purposes, otpExpiresAt, maskedContact]
      properties:
        journey:
          $ref: '#/components/schemas/Journey'
        challengeId:
          $ref: '#/components/schemas/Ulid'
        checkpoint:
          type: string
        purposes:
          type: array
          items:
            type: string
            enum: [CNS-DP, CNS-SOL, CNS-QSH, CNS-SHR, CNS-COM]
        otpExpiresAt:
          type: string
          format: date-time
        maskedContact:
          type: string
    JourneyCommand:
      type: object
      required: [commandId, journeyId, command, status, acceptedAt, deadlineAt]
      description: 'ED-R2-01 — a chained command accepted with 202 and completed by a worker within its deadline.'
      properties:
        commandId:
          $ref: '#/components/schemas/Ulid'
        journeyId:
          $ref: '#/components/schemas/Ulid'
        command:
          type: string
          enum: [partySnapshot, startNeedAnalysis, evaluateSuitability, checkOrCaptureConsent, requestQuote, submitProposal, initiatePayment]
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED]
        acceptedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        completedAt:
          type: ['string', 'null']
          format: date-time
        result:
          description: On SUCCEEDED — the journey after the command, or ConsentCaptureStarted for a consent capture.
          oneOf:
            - $ref: '#/components/schemas/Journey'
            - $ref: '#/components/schemas/ConsentCaptureStarted'
            - type: 'null'
        error:
          description: On FAILED — the propagated problem (stage unchanged).
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
    QuoteCommand:
      type: object
      additionalProperties: false
      required: [mode, category, requestedCover, members]
      description: Forwarded to Quotation unchanged except for refs added from journey_ref. Shape owned by the quotation contract.
      properties:
        mode:
          type: string
          enum: [MULTI, SINGLE]
        category:
          type: string
        requestedCover:
          type: number
          exclusiveMinimum: 0
        members:
          type: array
          minItems: 1
          items:
            type: object
        preferences:
          type: object
    Problem:
      type: object
      description: Platform problem+json (conventions/error-model.md). Callee errors are propagated with origin preserved (error-model §4).
      required: [title, status, code, category, retryable, incidentId, service, timestamp]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        category:
          type: string
        retryable:
          type: [boolean, string]
        incidentId:
          type: string
        correlationId:
          type: string
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: object
        origin:
          type: object
        diagnostic:
          type: object
  responses:
    JourneyOk:
      description: Command applied (or replayed); journey after the command.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Journey'
    JourneyCreated:
      description: Owning-service resource created; journey after the command.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Journey'
    CommandAccepted:
      description: 'Chained command accepted (ED-R2-01). Poll the Location (getJourneyCommand). A replay with the same Idempotency-Key returns the same commandId.'
      headers:
        Location:
          description: /internal/v1/journeys/{journeyId}/commands/{commandId}
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JourneyCommand'
    Validation:
      description: 'VALIDATION_ERROR, MISSING_REQUIRED_FIELD, UNSUPPORTED_LOB, CONFIGURATION_UNRESOLVABLE; propagated SUITABILITY_INCOMPLETE (C5/C6).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MissingIdempotencyKey:
      description: MISSING_IDEMPOTENCY_KEY.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 'DEFAULT_DENY / EXPLICIT_DENY / AUTHORIZATION_UNAVAILABLE (PDP, fail closed), SP_CERTIFICATION_REQUIRED, ASSIST_ONLY_ACTOR, CONSENT_REQUIRED, CONSENT_EXPIRED, CONSENT_SCOPE_MISMATCH, CONSENT_STATEMENT_NOT_APPROVED (C7), SUITABILITY_REQUIRED (propagated from Quotation), JOURNEY_HALTED_CONSENT_WITHDRAWN (E4 — every command on a halted journey), FORBIDDEN (RM_RELAYED verification under C2).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'ILLEGAL_TRANSITION (stage does not allow the command; INV-JRN-01), CONFLICT (stale expectedVersion; lead on exception hold), IDEMPOTENCY_CONFLICT, REQUEST_IN_PROGRESS, ASSESSMENT_IMMUTABLE, QUOTE_EXPIRED, OTP_EXPIRED — propagated.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 'OTP_ATTEMPTS_EXCEEDED, OTP_ISSUE_RATE_EXCEEDED — propagated from Consent.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: RESOURCE_NOT_FOUND (also for a journey outside the caller's scope).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: 'UPSTREAM_UNAVAILABLE — owning service unreachable on a synchronous command; stage unchanged; retry with the same key. A chained command reports UPSTREAM_TIMEOUT / UPSTREAM_UNAVAILABLE in JourneyCommand.error instead.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
