problem: >
  The logical model is ratified as AI-drafted text but is explicitly not a physical schema.
  S07-G5 cannot be signed against a missing pack, and S09 cannot provision Aurora schemas
  from an attribute sheet.

description: >
  Produce the Aarti design pack under docs/platform/data-architecture/: binding rules,
  physical topology and per-context tables/indexes, required routines, operations and
  troubleshooting, draft database_decision, and PostgreSQL design DDL. Do not apply
  migrations and do not mark the gate passed.

acceptance_criteria:
  - id: AC-1
    given: "the information model ownership matrix"
    when: "the pack is read"
    then: "every R0 writer context has a schema name and a SQL script"
  - id: AC-2
    given: "the two existing Flyway histories"
    when: "the pack is compared to code"
    then: "they are documented faithfully; no rewrite of applied migrations"
  - id: AC-3
    given: "OPEN-I6"
    when: "the physical design is read"
    then: "R0 uses lob as an index prefix, not a partition key, with a named revisit trigger"
  - id: AC-4
    given: "a request for stored procedures"
    when: "the pack is read"
    then: "CRUD SPs are refused; immutability / sequence / visibility / S09 purge routines are listed"
  - id: AC-5
    given: "a foundation or S09 database incident"
    when: "the troubleshooting plan is followed"
    then: "integrity is protected before availability; restore is not used to reconcile payments"
  - id: AC-6
    given: "CURRENT-STATE.yaml and GATE-S07"
    when: "this change lands"
    then: "no stage field is edited and S07-G5 remains OPEN awaiting the human signature"

