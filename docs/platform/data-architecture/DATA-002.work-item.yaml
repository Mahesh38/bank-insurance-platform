problem: >
  DATA-001 was designed against pre-CR-013 R0. origin/main now admits Lead archive,
  issuanceMode, off-platform Policy ingest, R0 admin/MIS on an isolated read path,
  and (from CR-012) a transactional outbox per producer. The current DDL cannot
  express those facts.

description: >
  After rebase onto origin/main, extend the Aarti pack: ARCHIVED + attribution
  retention on opportunity; issuance_mode on proposal and policy; policy.source with
  nullable lead_id, ingest/maker-checker tables, and append-only state history;
  isolated reporting/MIS read-path design and grants; outbox_event in every
  publishing schema. Do not pick the archive mechanism alone (joint Mahesh). Do
  not apply Flyway. Do not mark S07-G5 PASSED. The alignment report is already
  published; this item is the schema/docs delta.

