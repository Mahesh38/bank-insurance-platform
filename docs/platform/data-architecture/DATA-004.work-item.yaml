  - "S09 IaC role and secret inventory"
  - "S11 owning-service Flyway apply list"
  - "DB-DEC-0001 Dynamo rejection made operational"

problem: >
  DATA-001 decided one Aurora cluster and rejected Dynamo for Journey/Quote/Audit,
  but engineers still read architecture-review/05 as if those services open Dynamo.
  There is no single matrix of service → store → PostgreSQL role, and no roadmap
  that says when Dynamo may be reconsidered.

description: >
  Publish an Aarti overlay: e2e store catalogue (Aurora / Dynamo empty / Valkey /
  S3 / Keycloak / MSK / MIS), how segregation is enforced (schema + credential,
  not engine), which deployable may open which store, one app_* role per owning
  schema, and a staged roadmap through S09 apply, S11 waves, LOB split and an
  evidence-gated Dynamo revisit. Do not apply Flyway. Do not provision Dynamo.
  Do not mark S07-G5 PASSED.

acceptance_criteria:
  - id: AC-1
    given: "the R0 assisted Life path"
    when: "04-store-segregation-and-roadmap.md is read"
    then: "every transactional SoR is named on Aurora PostgreSQL and DynamoDB has an empty access list"
  - id: AC-2
    given: "a deployable in services/"
    when: "section 4 is read"
    then: "that service has exactly one store column — Aurora schema + role, or an explicit no-login reason"
  - id: AC-3
    given: "the question whether each service has a different DB user"
    when: "section 4 is read"
    then: "yes — one app_<schema> role per owning service; replicas share it; non-owners have no Aurora login"
  - id: AC-4
    given: "S09 IaC"
    when: "the roadmap Phase B is followed"
    then: "no Dynamo table or dynamodb:* task role is in the inventory"
  - id: AC-5
    given: "CURRENT-STATE.yaml and GATE-S07"
    when: "this change lands"
    then: "no stage field is edited and S07-G5 remains OPEN awaiting the human signature"

