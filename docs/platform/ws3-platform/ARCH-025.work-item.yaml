problem: >
  SCR-03 has a human screen (Customer ID / PAN / mobile; result card with masked CIF
  and an existing product chip) and a stated hop (lead exists? else CBS via Apigee),
  but the 2026-09-07 lead-phase pack searches CBS first, forbids every CIF-shaped
  field, and splits the same story across an LLD, OpenAPI and Java sketches. S11
  cannot implement the screen from one artefact.

description: >
  Publish one unified contract for GET /customers:search: Product/BA screen map,
  lead-first then Customer #4 → Apigee private → CBS, public schema (maskedCif,
  source, existingLead), security/audit, QA matrix and SRE limits. Align the
  lead-phase LLD/OpenAPI/Java sketches and HLD §5.1 search row so they do not
  contradict. Do not implement NIP BFF, Customer, Lead or Apigee. Do not claim T4.

acceptance_criteria:
  - id: AC-1
    given: "NIP-APP implements SCR-03"
    when: "it reads 09-nip-bff-customer-search-contract.md"
    then: "one public GET /customers:search is specified for CUSTOMER_ID, PAN and MOBILE with lead-first then CBS-via-Apigee"
  - id: AC-2
    given: "a search hit"
    when: "the public schema is read"
    then: "cifNumber, PAN, DOB, address and full mobile are absent; maskedCif and source are defined"
  - id: AC-3
    given: "an own lead exists for the key"
    when: "the sequence is followed"
    then: "the card is EXISTING_LEAD and CBS/Apigee is not on the wait-path"
  - id: AC-4
    given: "Product, BA, Security, Compliance, QA, SRE, Delivery and Engineering"
    when: "they need SCR-03"
    then: "they are routed to this one file, not a second role-specific document"
  - id: AC-5
    given: "CURRENT-STATE.yaml"
    when: "this change lands"
    then: "no stage field is edited"

