problem: >
  CODING-STANDARD requires ArchUnit to stay green, but each service still copies a
  local ServiceArchitectureTest. Deep rules exist for 1sb-integration-service;
  scaffolds are thin one-offs. Estate-wide consistency depends on copy-paste.

description: >
  Extract a shared ArchUnit baseline (library under libs/ or test-fixtures) covering
  hexagonal package layout from CODING-STANDARD §5, and adapter isolation patterns
  appropriate to module kind. Wire it into the microservice skeleton and every
  services/* ArchitectureTest. Keep 1sb-specific rules in that service. Do not
  re-open TD-007 as a new debt item; tighten only populated packages.

acceptance_criteria:
  - id: AC-1
    given: "the shared ArchUnit baseline"
    when: "a scaffold service depends on it"
    then: "hex package fitness rules run on CI for that module"
  - id: AC-2
    given: "templates/microservice-skeleton"
    when: "a new service is generated"
    then: "it references the shared baseline rather than a one-off empty test"
  - id: AC-3
    given: "1sb-integration-service"
    when: "ArchitectureTest runs"
    then: "existing onesb-specific rules remain and still bite (ArchitectureRulesBiteTest)"

