problem: >
  BRD rules for dedupe, BI eligibility, assignment and closure are tables of prose.
  Implementers need deterministic algorithms traced to rule IDs.

description: >
  Publish 13-lead-module-flows-and-algorithms.md with pseudocode and decision tables
  for create/dedupe, assignment by role (R0 cut), stage/status mapping, BI mark,
  reassignment lock, and closure. Conflicts stay OPEN.

acceptance_criteria:
  - id: AC-1
    given: "dedupe algorithm"
    when: "same principal + customer + productClass + unfinished"
    then: "BLOCK with existing leadId; after BI Generated allow new lead per BR-DEDUPE"
  - id: AC-2
    given: "BI algorithm"
    when: "first successful BI arrives"
    then: "biGenerated=true, reportingClass=ELIGIBLE, domain QUALIFIED (or OPEN-LEAD-STAGE)"
  - id: AC-3
    given: "closure algorithm"
    when: "lead is closed"
    then: "terminal; reopen forbidden; new lead subject to dedupe (BR-CLOSE-001)"

