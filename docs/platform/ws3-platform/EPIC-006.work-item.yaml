problem: >
  EPIC-003/005 published contracts. workforce-access-bff still only served login.
  NIP-APP cannot complete Lead without country-code validation, org lookups,
  assign+exception, and a CBS search hop that does not race on tokens.

description: >
  Admit as SF5 on lane amit-nip-bff-lead so GATE-S08 is not delayed. Implement
  REST BFF paths, thin Lead and Customer services with in-memory/stub adapters,
  and a lock-guarded Apigee token holder. Reuse EPIC-003 naming; do not wrap
  success bodies. Record D-020 / D-021 as Rajal product closures.

acceptance_criteria:
  - id: AC-1
    given: "an authenticated BFF session"
    when: "GET /api/v1/country-codes"
    then: "India +91 with min/max 10 and regex ^[6-9]\\d{9}$ is returned"
  - id: AC-2
    given: "branch BR-MUM-001"
    when: "GET /api/v1/branches/{id}/verticals and /specified-persons"
    then: "nested collections are returned; unknown branch is 404"
  - id: AC-3
    given: "a saved lead"
    when: "POST /api/v1/leads/{id}/assignment"
    then: "the body includes exceptionRequired and does not assign on APPROVAL_REQUIRED"
  - id: AC-4
    given: "Lead.create"
    when: "a lead is minted"
    then: "leadId is a 26-char Crockford ULID and dashboardStage is NEW"
  - id: AC-5
    given: "16 threads requesting an expired Apigee token"
    when: "currentAccessToken is called"
    then: "the token client is invoked once"
  - id: AC-6
    given: "an authenticated BFF session and a created TERM lead"
    when: "GET /api/v1/customers/{id} and /customers/{id}/active-leads"
    then: "confirm returns a masked ETB sheet and active-leads lists the unfinished lead"

