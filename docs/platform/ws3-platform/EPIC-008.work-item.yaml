problem: >
  Quotation, journey-orchestration and integration-hub are not yet stitched for
  create/get/select quote. 1SB Saving quote submit/poll exists; quotation has
  Dynamo working-state helpers only. An RM cannot ask "premium X, PT Y, PPT Z —
  what quote do I get?" on the bank path after lead + suitability.

description: >
  Build the contracted hop for Life SAVINGS quotation. Hub is the only caller of
  1sb-integration. Journey never calls Hub. Quotation re-checks suitability (C1)
  and does not trust a journey flag. Savings maps to 1SB LifeSave
  (/insurance/lifesave/v1/quote) with premium, policyTerm (PT) and
  premiumPaymentTerm (PPT).

acceptance_criteria:
  - id: AC-1
    given: "lead + usable suitability for SAVINGS + consent BEFORE_MULTI_QUOTE satisfied"
    when: "Journey receives POST /internal/v1/journeys/{id}/quotes with premium, PT, PPT"
    then: "Journey calls Quotation; stage becomes QUOTING; quoteId stored as journey_ref"
  - id: AC-2
    given: "Quotation accepted a createQuote"
    when: "Hub and 1SB complete the LifeSave async quote"
    then: "GET quote returns bank-canonical offers (premium, coverTerm/PT, ppt) without 1SB reqId"
  - id: AC-3
    given: "at least one selectable offer"
    when: "Journey POST .../quotes/{quoteId}/selection"
    then: "Quotation marks selectedOfferId; Journey stage becomes QUOTE_SELECTED"
  - id: AC-4
    given: "suitability not usable for productClass SAVINGS"
    when: "createQuote is attempted"
    then: "403 SUITABILITY_REQUIRED; journey stage unchanged; refusal audited"

