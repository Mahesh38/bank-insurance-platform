problem: >
  workforce-access-bff denied every path except auth. NIP-APP has no REST
  surface for country codes, org lookups, pipeline, create or assign.

description: >
  Add session-gated REST collections on /api/v1. Plural nouns, nested
  sub-resources, no rm-list verb, no success wrapper. Assign orchestrates
  exception evaluation (D-019) and returns exceptionRequired.

acceptance_criteria:
  - id: AC-1
    given: "a valid BFF session"
    when: "GET /api/v1/country-codes"
    then: "an array of country objects with regex is returned"
  - id: AC-2
    given: "no session"
    when: "GET /api/v1/country-codes"
    then: "401 SESSION_INVALID"
  - id: AC-3
    given: "a created lead for a PASS customer"
    when: "POST /api/v1/leads/{id}/assignment"
    then: "state is ASSIGNED and exceptionRequired is false"

