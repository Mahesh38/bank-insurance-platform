problem: >
  Customer search needs a CBS hop via Apigee. If every API fetches and stores
  its own access token, concurrent calls race and start failing.

description: >
  Shared ApigeeAccessTokenHolder lives in bank-common-apigee. Customer #4 and
  1sb-integration-service both wire it. HTTP /token and CBS inquiry clients
  exist behind env flags; default remains stub. The BFF never holds CBS tokens.

acceptance_criteria:
  - id: AC-1
    given: "16 concurrent callers and an empty cache"
    when: "currentAccessToken is invoked"
    then: "the token client fetches once"
  - id: AC-2
    given: "search by MOBILE"
    when: "a hit is returned"
    then: "mobile and CIF are masked; full values are not logged"

out_of_scope:
  - "Live Apigee host/credential values in git (env APIGEE_* / CBS_INQUIRY_*; DEP-20260914-apg)"
  - "Cluster Valkey access-token cache (ADR-011 remainder of SUG-20261006-atk)"
  - "BFF-held CBS credentials"

