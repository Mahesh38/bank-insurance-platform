  - "ARCH-025"
  - "Lead BRD Screen 1"

problem: >
  Customer search needs a CBS hop via Apigee. If every API fetches and stores
  its own access token, concurrent calls race and start failing.

description: >
  Customer #4 owns a lock-guarded ApigeeAccessTokenHolder. All CBS inquiry
  calls reuse one token. Local/test uses a stub token client and stub
  directory. The BFF never holds CBS tokens.

acceptance_criteria:
  - id: AC-1
    given: "16 concurrent callers and an empty cache"
    when: "currentAccessToken is invoked"
    then: "the token client fetches once"
  - id: AC-2
    given: "search by MOBILE"
    when: "a hit is returned"
    then: "mobile and CIF are masked; full values are not logged"

out_of_scope:
  - "Live Apigee /token and CBS inquiry URLs"
  - "BFF-held CBS credentials"

