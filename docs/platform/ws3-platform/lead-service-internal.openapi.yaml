openapi: 3.0.3
info:
  title: Lead service — cluster-private API (R0)
  version: 0.1.0-ai-drafted
  description: |
    Internal HTTP contract for bounded context #5 Lead (EPIC-005 / ARCH-028).
    Consumed by NIP BFF, Journey and Quotation inside the cluster.
    Flutter and public internet never call these paths.
    Public consumer edge remains nip-bff-lead-phase.openapi.yaml (EPIC-003).
    Status: AI-DRAFTED — human Board 1 / Security signatures outstanding.
    Create actors per D-018 / ADR-021: Bank SP, Bank Non-SP, Insurance RM (etc.).
    D-019 (BRD-aligned): dedupe → Save/create (no exception eval) → Start Onboarding
    (PASS / BLOCK / APPROVAL_REQUIRED) → assignments (mandatory certified-SP AU Bank RM
    + optional meeting). Dedupe when BI absent: Continue | Cancel only (Table 18).
    OPEN-LEAD-DUP-DELETE and OPEN-LEAD-VAL-TIMING CLOSED in favour of BRDs.
servers:
  - url: http://lead-service.platform.svc.cluster.local
    description: Cluster DNS (illustrative)
tags:
  - name: Leads
    description: Lead aggregate commands and queries
paths:
  /internal/v1/leads:
    get:
      tags: [Leads]
      operationId: listLeads
      summary: List leads for the caller book
      description: |
        Working inbox / pipeline source. Cursor-paginated. Sparse LeadSummary only.
        Used by BFF GET /workspace/pipeline.
      parameters:
        - name: owner
          in: query
          description: Scope filter. `me` = assigned to or generated by the caller principal.
          schema:
            type: string
            enum: [me]
          required: true
        - name: customerId
          in: query
          description: Optional bank customer id filter.
          schema:
            type: string
        - name: productClass
          in: query
          schema:
            $ref: '#/components/schemas/ProductClass'
        - name: unfinished
          in: query
          description: When true, only leads with biGenerated=false and non-terminal state.
          schema:
            type: boolean
        - name: exceptionHold
          in: query
          description: When true, only leads awaiting Exception / AUBIMA approval release.
          schema:
            type: boolean
        - name: cursor
          in: query
          description: Opaque continuation token from a previous page.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size (1–50). Default 20.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Page of lead summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadSummaryPage'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Leads]
      operationId: createLead
      summary: Save a Lead (no exception evaluation)
      description: |
        Mints leadId (ULID), runs ALG-DEDUPE, spawns Journey reference.
        Exception BRD: Save does NOT evaluate rules — call start-onboarding next.
        SP assignee is NOT required here — call assignments after exception clear.
        Idempotent via Idempotency-Key. Insurer/plan are not accepted on create (BR-LEAD-005).
        Dedupe conflict: Continue existing or Cancel — no replace/soft-delete (Table 18).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeadRequest'
      responses:
        '201':
          description: Lead saved — Start Onboarding next
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '403':
          description: ORIGINATION_ACTOR_DENIED, IPR create gated, or PDP deny
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceErrorResponse'
        '409':
          description: LEAD_DUPLICATE_UNFINISHED — Continue existing or Cancel
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DuplicateLeadProblem'
        '422':
          $ref: '#/components/responses/Problem'
  /internal/v1/leads/{leadId}:
    get:
      tags: [Leads]
      operationId: getLead
      summary: Get a Lead by id
      description: |
        Book-scoped. Foreign leads are absent (404), not 403 that confirms existence
        (INV-LED-07 / OPEN-LEAD-XRM posture).
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: Lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '404':
          $ref: '#/components/responses/Problem'
  /internal/v1/leads/{leadId}/assignments:
    post:
      tags: [Leads]
      operationId: assignLead
      summary: Assign certified-SP AU Bank RM (and optional meeting) after exception clear
      description: |
        D-019 / INV-LED-10. Requires Start Onboarding evaluated and exceptionHold=false.
        Required before suitability / process-further.
        Optional meeting intent: Online|In-person, date, time, link (Lead BRD Screen 7).
        accountableSpId written once on first successful assignment (INV-ACT-03).
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignLeadRequest'
      responses:
        '200':
          description: Updated Lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '409':
          description: EXCEPTION_HOLD_ACTIVE or ONBOARDING_NOT_STARTED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceErrorResponse'
        '422':
          description: REASSIGN_AFTER_BI or certification failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceErrorResponse'
  /internal/v1/leads/{leadId}/close:
    post:
      tags: [Leads]
      operationId: closeLead
      summary: Close a Lead (terminal)
      description: BR-CLOSE-001 — cannot reopen. New pursuit requires a new create subject to dedupe.
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseLeadRequest'
      responses:
        '200':
          description: Closed Lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '409':
          description: ILLEGAL_TRANSITION
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceErrorResponse'
        '422':
          $ref: '#/components/responses/Problem'
  /internal/v1/leads/{leadId}/activity-status:
    post:
      tags: [Leads]
      operationId: setActivityStatus
      summary: Set pre-BI disposition status
      description: |
        Configurable master codes. CUSTOMER_NOT_INTERESTED closes the lead (BRD §14.2).
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityStatusRequest'
      responses:
        '200':
          description: Updated Lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '422':
          $ref: '#/components/responses/Problem'
  /internal/v1/leads/{leadId}/bi-generated:
    post:
      tags: [Leads]
      operationId: markBiGenerated
      summary: Record a successful Benefit Illustration
      description: |
        First success sets biGenerated, reportingClass=ELIGIBLE and QUALIFIED (BR-BI-*).
        Subsequent BI references are linked without minting a new lead.
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiGeneratedRequest'
      responses:
        '204':
          description: Applied (including idempotent replay)
        '409':
          $ref: '#/components/responses/Problem'
  /internal/v1/leads/{leadId}/convert:
    post:
      tags: [Leads]
      operationId: convertLead
      summary: Convert Lead after JourneySold
      description: |
        Idempotent on same journeyId (INV-LED-02). Archives working inbox (ADR-014).
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertLeadRequest'
      responses:
        '200':
          description: Converted / archived Lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '409':
          $ref: '#/components/responses/Problem'
  /internal/v1/leads/{leadId}/archive:
    post:
      tags: [Leads]
      operationId: archiveLead
      summary: Archive a terminal Lead working inbox
      description: No-op delete. Attribution fields retained (ADR-014).
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: Archived Lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '409':
          $ref: '#/components/responses/Problem'
  /internal/v1/leads/{leadId}:start-onboarding:
    post:
      tags: [Leads]
      operationId: startOnboarding
      summary: Start Onboarding — run Exception / validation engine
      description: |
        Exception BRD: evaluation runs here, not on Save. Outcomes PASS | BLOCK |
        APPROVAL_REQUIRED (sets exceptionHold). Assignment and Suitability gated
        until PASS or hold RELEASE.
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: Cleared or held Lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '422':
          description: VALIDATION_BLOCKED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceErrorResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /internal/v1/leads:evaluate:
    post:
      tags: [Leads]
      operationId: evaluateLeadExceptions
      summary: Probe Exception / validation engine without mutating a lead
      description: |
        Optional diagnostic probe (same rule catalogue as Start Onboarding).
        Returns PASS | BLOCK | APPROVAL_REQUIRED with ruleIds. Does not persist hold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, productClass]
              properties:
                customerId:
                  type: string
                productClass:
                  $ref: '#/components/schemas/ProductClass'
                lob:
                  $ref: '#/components/schemas/Lob'
              additionalProperties: false
      responses:
        '200':
          description: Validation verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationVerdict'
        '422':
          $ref: '#/components/responses/Problem'
  /internal/v1/leads/{leadId}/exception-hold:
    post:
      tags: [Leads]
      operationId: applyExceptionHold
      summary: Release or reject an exception hold (AUBIMA callback)
      description: |
        Cluster-private callback from Exception Handling. RELEASE clears hold;
        REJECT hard-blocks / closes the held treatment. Lead does not own approver hierarchy.
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionHoldRequest'
      responses:
        '200':
          description: Updated Lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '409':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    LeadId:
      name: leadId
      in: path
      required: true
      description: ULID Lead identifier (BR-LEAD-001/002). Not a sequential display label.
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-supplied idempotency key for the mutating operation.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Problem:
      description: ADR-017 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ServiceErrorResponse'
  schemas:
    ProductClass:
      type: string
      enum: [TERM, SAVINGS, ULIP]
      description: Immutable after create (BR-LEAD-006).
    Lob:
      type: string
      enum: [LIFE]
    LeadState:
      type: string
      enum:
        - NEW
        - ASSIGNED
        - CONTACTED
        - QUALIFIED
        - CONVERTED
        - DISQUALIFIED
        - EXPIRED
        - ARCHIVED
      description: Domain machine from 01-domain-model §4.1 (OPEN-LEAD-STAGE for BRD labels).
    ReportingClass:
      type: string
      enum: [DIARY, ELIGIBLE]
    CreateLeadRequest:
      type: object
      required: [customerId, lob, productClass, branchId]
      properties:
        customerId:
          type: string
          description: Bank customer id from Customer/CBS confirmation.
        lob:
          $ref: '#/components/schemas/Lob'
        productClass:
          $ref: '#/components/schemas/ProductClass'
        branchId:
          type: string
          description: Branch context for ownership and reporting.
        resumeExisting:
          type: boolean
          default: false
          description: When dedupe conflicts, resume the existing lead instead of creating.
        correlationId:
          type: string
          description: End-to-end correlation for audit.
      additionalProperties: false
    AssignLeadRequest:
      type: object
      required: [assignedRmId]
      properties:
        assignedRmId:
          type: string
          description: Mandatory certified-SP AU Bank RM (IRDAI Specified Person).
        assignedSpId:
          type: string
          description: When role flow distinguishes SP from fulfiller (BRD §15).
        branchId:
          type: string
        note:
          type: string
          maxLength: 250
        meeting:
          $ref: '#/components/schemas/MeetingIntent'
      additionalProperties: false
    MeetingIntent:
      type: object
      description: Optional post-create meeting capture (Lead BRD Screen 7). Not meeting completion.
      properties:
        type:
          type: string
          enum: [ONLINE, IN_PERSON]
        date:
          type: string
          format: date
        time:
          type: string
          description: Local time; must be within 08:00–20:00 when present.
        link:
          type: string
          format: uri
          description: Required when type=ONLINE.
      additionalProperties: false
    CloseLeadRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          description: Closure reason master code (VAL-017).
        remarks:
          type: string
          maxLength: 250
          description: Required when reasonCode is OTHER (VAL-018/019).
      additionalProperties: false
    ActivityStatusRequest:
      type: object
      required: [statusCode]
      properties:
        statusCode:
          type: string
          description: Configurable disposition (e.g. MEETING_SCHEDULED, CONTACTED, CUSTOMER_NOT_INTERESTED).
      additionalProperties: false
    BiGeneratedRequest:
      type: object
      required: [biReference, occurredAt]
      properties:
        biReference:
          type: string
          description: Quote/BI artefact reference — not the BI payload.
        occurredAt:
          type: string
          format: date-time
      additionalProperties: false
    ConvertLeadRequest:
      type: object
      required: [journeyId, paymentId, policyId]
      properties:
        journeyId:
          type: string
        paymentId:
          type: string
        policyId:
          type: string
      additionalProperties: false
    LeadSummary:
      type: object
      required: [leadId, customerId, productClass, state, biGenerated, reportingClass]
      properties:
        leadId:
          type: string
        customerId:
          type: string
        productClass:
          $ref: '#/components/schemas/ProductClass'
        state:
          $ref: '#/components/schemas/LeadState'
        activityStatus:
          type: string
          nullable: true
        biGenerated:
          type: boolean
        reportingClass:
          $ref: '#/components/schemas/ReportingClass'
        journeyId:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    LeadSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeadSummary'
        nextCursor:
          type: string
          nullable: true
          description: Null when no further pages.
      additionalProperties: false
    Lead:
      type: object
      required:
        - leadId
        - customerId
        - lob
        - productClass
        - createdByPrincipalId
        - leadGeneratorPrincipalId
        - state
        - biGenerated
        - reportingClass
      properties:
        leadId:
          type: string
        customerId:
          type: string
        lob:
          $ref: '#/components/schemas/Lob'
        productClass:
          $ref: '#/components/schemas/ProductClass'
        branchId:
          type: string
        createdByPrincipalId:
          type: string
        leadGeneratorPrincipalId:
          type: string
        fulfillerPrincipalId:
          type: string
        assignedRmId:
          type: string
          nullable: true
          description: Null after create until assignment screen completes (D-019).
        assignedSpId:
          type: string
          nullable: true
        accountableSpId:
          type: string
          nullable: true
          description: Set once on first successful SP assignment (INV-ACT-03).
        state:
          $ref: '#/components/schemas/LeadState'
        activityStatus:
          type: string
          nullable: true
        exceptionEvaluated:
          type: boolean
          description: True after Start Onboarding has run Exception evaluation.
        exceptionHold:
          type: boolean
          description: True when Start Onboarding required approval (AUBIMA hold).
        exceptionRuleIds:
          type: array
          items:
            type: string
        biGenerated:
          type: boolean
        reportingClass:
          $ref: '#/components/schemas/ReportingClass'
        meetingIntent:
          $ref: '#/components/schemas/MeetingIntent'
        journeyId:
          type: string
          nullable: true
        closedReason:
          type: string
          nullable: true
        remarks:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    ValidationVerdict:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [PASS, BLOCK, APPROVAL_REQUIRED]
        ruleIds:
          type: array
          items:
            type: string
          description: Triggered Exception Handling rule identifiers.
      additionalProperties: false
    ExceptionHoldRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [RELEASE, REJECT]
        ruleIds:
          type: array
          items:
            type: string
        remarks:
          type: string
          maxLength: 250
      additionalProperties: false
    ServiceErrorResponse:
      type: object
      required: [type, title, status, detail, category, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        category:
          type: string
          description: ADR-017 error category
        code:
          type: string
          description: Stable machine code (e.g. LEAD_DUPLICATE_UNFINISHED)
        correlationId:
          type: string
      additionalProperties: false
    DuplicateLeadProblem:
      allOf:
        - $ref: '#/components/schemas/ServiceErrorResponse'
        - type: object
          properties:
            existingLeadId:
              type: string
              description: Lead to resume (VAL-012)
            existingJourneyId:
              type: string
