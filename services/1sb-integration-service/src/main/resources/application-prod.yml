# Production profile
# All credentials MUST come from AWS_SECRETS_MANAGER
# No fallback to PROPERTIES or ENV in prod
insurance:
  secrets:
    source: AWS_SECRETS_MANAGER

bank:
  persistence:
    base-url: ${BANK_PERSISTENCE_BASE_URL}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.bank.insurance: INFO

# OpenAPI is a local/dev testing aid only — never served here (CR-002).
# Pinned rather than inherited so SPRINGDOC_ENABLED cannot re-enable it in this environment.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
