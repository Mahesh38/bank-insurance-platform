# UAT profile
# Secrets sourced from ENV variables:
#   ONESB_API_KEY, ONESB_API_SECRET, ONESB_DISTRIBUTOR_ID
# Set INSURANCE_SECRETS_SOURCE=ENV or AWS_SECRETS_MANAGER
insurance:
  secrets:
    source: ${INSURANCE_SECRETS_SOURCE:ENV}

bank:
  persistence:
    base-url: ${BANK_PERSISTENCE_BASE_URL}

logging:
  level:
    com.bank.insurance: INFO

# OpenAPI is a local/dev testing aid only — never served here (CR-002).
# Pinned rather than inherited so SPRINGDOC_ENABLED cannot re-enable it in this environment.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
