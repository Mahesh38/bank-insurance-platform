spring:
  application:
    name: 1sb-integration-service

  # Enable virtual threads (Project Loom, Spring Boot 3.2+)
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Secrets source + master-data cache + proposal schema cache
insurance:
  secrets:
    source: ${INSURANCE_SECRETS_SOURCE:PROPERTIES}
  masters:
    cache-ttl-seconds: ${INSURANCE_MASTERS_CACHE_TTL_SECONDS:14400}
  proposals:
    schema-cache-ttl-seconds: ${INSURANCE_PROPOSALS_SCHEMA_CACHE_TTL_SECONDS:3600}
  payments:
    session-ttl-seconds: ${INSURANCE_PAYMENTS_SESSION_TTL_SECONDS:3600}

# Platform common persistence HTTP client (bank-persistence-service)
bank:
  persistence:
    base-url: ${BANK_PERSISTENCE_BASE_URL:http://localhost:8081}

# 1SB outbound client configuration
onesb:
  client:
    base-url: ${ONESB_BASE_URL:https://demo.api.1silverbullet.tech}
    connect-timeout-ms: ${ONESB_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${ONESB_READ_TIMEOUT_MS:30000}
  poll:
    base-delay-ms: ${ONESB_POLL_BASE_DELAY_MS:1000}
    multiplier: ${ONESB_POLL_MULTIPLIER:2.0}
    max-delay-ms: ${ONESB_POLL_MAX_DELAY_MS:30000}
    max-attempts: ${ONESB_POLL_MAX_ATTEMPTS:20}

# OpenAPI / Swagger UI — DISABLED BY DEFAULT.
#
# The specification is a local and dev testing aid: it exists so a developer can exercise the
# API without hand-building a request collection. It is not a published product surface. This
# service is reachable inside the VPC only, and the spec endpoints are never served on UAT or
# production (ADR / CR-002 — see docs/governance/registers/DECISION-REGISTER.md).
#
# Default-off rather than default-on so that a new environment is safe before anyone remembers
# to configure it. Turn it on deliberately for local work with SPRINGDOC_ENABLED=true; the uat
# and prod profiles pin it off so that variable cannot re-enable it there.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  level:
    com.bank.insurance: INFO
    org.springframework.security: WARN
