spring:
  application:
    name: 1sb-integration-service

  # Enable virtual threads (Project Loom, Spring Boot 3.2+)
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Secrets source + persistence HTTP client
insurance:
  secrets:
    source: ${INSURANCE_SECRETS_SOURCE:PROPERTIES}
  persistence:
    base-url: ${INSURANCE_PERSISTENCE_BASE_URL:http://localhost:8081}

# 1SB outbound client configuration
onesb:
  client:
    base-url: ${ONESB_BASE_URL:https://demo.api.1silverbullet.tech}
    connect-timeout-ms: ${ONESB_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${ONESB_READ_TIMEOUT_MS:30000}

logging:
  level:
    com.bank.insurance: INFO
    org.springframework.security: WARN
