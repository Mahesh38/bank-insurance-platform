spring:
  datasource:
    url: jdbc:h2:mem:onesb_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

insurance:
  secrets:
    source: PROPERTIES

# Stub credentials for tests — NOT real secrets
onesb:
  api-key: test-api-key
  api-secret: test-api-secret
  distributor-id: TEST_DIST

logging:
  level:
    com.bank.insurance: WARN
    org.flywaydb: WARN
