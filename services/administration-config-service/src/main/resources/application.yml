server:
  port: 8104

spring:
  application:
    name: administration-config-service
  datasource:
    url: ${ADMINISTRATION_CONFIG_SERVICE_DATASOURCE_URL:jdbc:h2:mem:administration_config_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${ADMINISTRATION_CONFIG_SERVICE_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${ADMINISTRATION_CONFIG_SERVICE_DATASOURCE_USERNAME:sa}
    password: ${ADMINISTRATION_CONFIG_SERVICE_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
    validate-on-migrate: true
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.adminconfig: INFO

admin-config:
  internal-auth:
    callers:
      workforce-access-bff: ${ADMIN_CONFIG_BFF_INTERNAL_KEY:local-admin-config-bff-internal-key}
      lead-service: ${ADMIN_CONFIG_LEAD_INTERNAL_KEY:local-admin-config-lead-internal-key}
    actor-callers:
      - workforce-access-bff
    privileges:
      workforce-access-bff:
        - "*"
      lead-service:
        - "*"
  seed-import:
    # Imports the engine's seed rule sets as DRAFT when absent (ADR-024 section 7). Never publishes.
    enabled: ${ADMIN_CONFIG_SEED_IMPORT_ENABLED:true}

bank:
  error:
    service-id: admin-config
    layer: L5
    boundary: INTERNAL
