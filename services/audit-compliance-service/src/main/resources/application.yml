server:
  port: 8101

spring:
  application:
    name: audit-compliance-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.audit: INFO

bank:
  error:
    service-id: audit
    layer: L5
    boundary: INTERNAL

audit:
  internal-auth:
    callers:
      workforce-access-bff: ${AUDIT_BFF_INTERNAL_KEY:local-audit-bff-internal-key}
    actor-callers:
      - workforce-access-bff
    privileges:
      workforce-access-bff:
        - "*"
