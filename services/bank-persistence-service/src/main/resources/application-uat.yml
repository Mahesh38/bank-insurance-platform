# UAT — PostgreSQL
# RAW_PAYLOAD_ENCRYPTION_KEY must be set (no default in this profile) — see application.yml.
spring:
  datasource:
    url: ${DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

persistence:
  internal-auth:
    callers:
      onesb-integration-service: ${PERSISTENCE_ONESB_INTERNAL_KEY:${PERSISTENCE_INTERNAL_SHARED_SECRET}}
    privileges:
      onesb-integration-service:
        - jobs
        - payment-sessions
        - raw-payloads.write
        - audit.append

logging:
  level:
    com.bank.persistence: INFO
