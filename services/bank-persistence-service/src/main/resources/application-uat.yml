# UAT — PostgreSQL
# RAW_PAYLOAD_ENCRYPTION_KEY must be set (no default in this profile) — see application.yml.
spring:
  datasource:
    url: ${DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

persistence:
  internal-auth:
    shared-secret: ${PERSISTENCE_INTERNAL_SHARED_SECRET}

logging:
  level:
    com.bank.persistence: INFO
