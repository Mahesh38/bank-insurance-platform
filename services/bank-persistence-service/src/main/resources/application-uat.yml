# UAT — PostgreSQL
# RAW_PAYLOAD_ENCRYPTION_KEY must be set (no default in this profile) — see application.yml.
spring:
  datasource:
    url: ${DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.bank.persistence: INFO

# OpenAPI is a local/dev testing aid only — never served here (CR-002).
# Pinned rather than inherited so SPRINGDOC_ENABLED cannot re-enable it in this environment.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
