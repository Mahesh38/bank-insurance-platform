server:
  port: 8081

spring:
  application:
    name: bank-persistence-service

  datasource:
    url: ${DATASOURCE_URL:jdbc:h2:mem:persistence;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE}
    driver-class-name: ${DATASOURCE_DRIVER:org.h2.Driver}
    username: ${DATASOURCE_USERNAME:sa}
    password: ${DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Local/default stand-in for Vault AES-256 key (override in uat/prod via env)
bank:
  persistence:
    payload-encryption:
      key-id: ${PAYLOAD_ENCRYPTION_KEY_ID:local-v1}
      # 32 zero bytes, Base64 — replace in real environments
      key-base64: ${PAYLOAD_ENCRYPTION_KEY_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      retain-years: ${PAYLOAD_ENCRYPTION_RETAIN_YEARS:7}

logging:
  level:
    com.bank.persistence: INFO
