server:
  port: 8081

spring:
  application:
    name: bank-persistence-service

  datasource:
    url: ${DATASOURCE_URL:jdbc:h2:mem:persistence;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE}
    driver-class-name: ${DATASOURCE_DRIVER:org.h2.Driver}
    username: ${DATASOURCE_USERNAME:sa}
    password: ${DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# COMP-003 — raw_payload encrypted at rest (AES-256-GCM). No default: missing/invalid key fails
# startup (RawPayloadEncryptionService). Set via RAW_PAYLOAD_ENCRYPTION_KEY in uat/prod;
# application-local.yml.example / application-test.yml carry dev-only keys.
raw-payload:
  encryption:
    key: ${RAW_PAYLOAD_ENCRYPTION_KEY:}
  retention:
    years: ${RAW_PAYLOAD_RETENTION_YEARS:7}

logging:
  level:
    com.bank.persistence: INFO

# Error contract (ADR-017 / EPIC-001). service-id is the registered id from
# 07-PLATFORM-ERROR-CONTRACT.md section 2.2 — it appears in every error response, log line and
# metric tag, so it is set once here rather than repeated as a literal at each throw site.
# boundary is architectural and permanent; expose-diagnostics is a debug switch, defaults off and
# is refused under the prod profile.
bank:
  error:
    service-id: persistence
    layer: L7
    boundary: INTERNAL
    # /internal/v1 publishes 400 for bean validation, not the platform default of 422.
    validation-status: 400
