server:
  port: 8081

spring:
  application:
    name: bank-persistence-service

  datasource:
    url: ${DATASOURCE_URL:jdbc:h2:mem:persistence;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE}
    driver-class-name: ${DATASOURCE_DRIVER:org.h2.Driver}
    username: ${DATASOURCE_USERNAME:sa}
    password: ${DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# COMP-003 — raw_payload encrypted at rest (AES-256-GCM). No default: missing/invalid key fails
# startup (RawPayloadEncryptionService). Set via RAW_PAYLOAD_ENCRYPTION_KEY in uat/prod;
# application-local.yml.example / application-test.yml carry dev-only keys.
raw-payload:
  encryption:
    key: ${RAW_PAYLOAD_ENCRYPTION_KEY:}
  retention:
    years: ${RAW_PAYLOAD_RETENTION_YEARS:7}

# OpenAPI / Swagger UI — DISABLED BY DEFAULT. See the equivalent block in
# 1sb-integration-service: the spec is a local/dev testing aid, never a served surface on UAT or
# production (CR-002). This service is internal-only in every environment, so exposing an API
# browser on it would be doubly wrong.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  level:
    com.bank.persistence: INFO
