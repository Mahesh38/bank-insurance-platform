spring:
  datasource:
    url: jdbc:h2:mem:persistence_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# Fixed test key: Base64 of bytes 0x00..0x1F (exactly 32 bytes). key-id test-v1.
bank:
  persistence:
    payload-encryption:
      key-id: test-v1
      key-base64: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      retain-years: 7

logging:
  level:
    com.bank.persistence: WARN
    org.flywaydb: WARN
