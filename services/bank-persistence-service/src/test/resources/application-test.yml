spring:
  datasource:
    url: jdbc:h2:mem:persistence_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

persistence:
  internal-auth:
    callers:
      onesb-integration-service: test-persistence-internal-key
      local-test: test-persistence-admin-key1
    privileges:
      onesb-integration-service:
        - jobs
        - payment-sessions
        - raw-payloads.write
        - audit.append
      local-test:
        - "*"

# Fixed test-only AES-256 key — never reuse outside tests.
raw-payload:
  encryption:
    key: p7MSmdyOLeyBue5/ZJpPP3TE/ZQrLr4WSPjrhS0d0F8=

logging:
  level:
    com.bank.persistence: WARN
    org.flywaydb: WARN
