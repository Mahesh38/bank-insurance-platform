server:
  port: 8105

spring:
  application:
    name: direct-insurer-adapter-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.integration.direct: INFO

bank:
  error:
    service-id: direct-insurer
    layer: L5
    boundary: INTERNAL

directinsurer:
  internal-auth:
    callers:
      workforce-access-bff: ${DIRECTINSURER_BFF_INTERNAL_KEY:local-directinsurer-bff-internal-key}
    actor-callers:
      - workforce-access-bff
    privileges:
      workforce-access-bff:
        - "*"
