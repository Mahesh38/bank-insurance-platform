server:
  port: 8083

spring:
  application:
    name: identity-authorization-service
  datasource:
    url: ${AUTHZ_DATASOURCE_URL:jdbc:h2:mem:identityauthz;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${AUTHZ_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${AUTHZ_DATASOURCE_USERNAME:sa}
    password: ${AUTHZ_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  threads:
    virtual:
      enabled: true

identity:
  provider-adapter:
    base-url: ${IDENTITY_PROVIDER_ADAPTER_BASE_URL:http://localhost:8082}
  provisioning:
    enabled: ${IDENTITY_PROVISIONING_ENABLED:false}
    poll-interval: ${IDENTITY_PROVISIONING_POLL_INTERVAL:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.identity.authz: INFO
