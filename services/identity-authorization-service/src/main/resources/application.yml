server:
  port: 8083

spring:
  application:
    name: identity-authorization-service
  datasource:
    url: ${AUTHZ_DATASOURCE_URL:jdbc:h2:mem:identityauthz;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${AUTHZ_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${AUTHZ_DATASOURCE_USERNAME:sa}
    password: ${AUTHZ_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  threads:
    virtual:
      enabled: true

identity:
  login:
    max-password-failures: ${IDENTITY_LOGIN_MAX_PASSWORD_FAILURES:3}
    inactivity-days: ${IDENTITY_LOGIN_INACTIVITY_DAYS:30}
    password-expiry-days: ${IDENTITY_LOGIN_PASSWORD_EXPIRY_DAYS:60}
  # Caller authentication for /internal/v1/** (READINESS-REVIEW §3.7). One key per calling service;
  # only actor-callers may set X-Actor-Id (maker / checker). Development-only defaults; production
  # has none (application-prod.yml).
  internal-auth:
    callers:
      workforce-access-bff: ${IDENTITY_AUTHZ_BFF_INTERNAL_KEY:local-authz-bff-internal-key}
      lead-service: ${IDENTITY_AUTHZ_LEAD_INTERNAL_KEY:local-authz-lead-internal-key}
    actor-callers:
      - workforce-access-bff
  provider-adapter:
    base-url: ${IDENTITY_PROVIDER_ADAPTER_BASE_URL:http://localhost:8082}
    internal-key: ${IDENTITY_ADAPTER_INTERNAL_SHARED_SECRET:local-idp-adapter-internal-key}
    connect-timeout: ${IDENTITY_PROVIDER_ADAPTER_CONNECT_TIMEOUT:1s}
    read-timeout: ${IDENTITY_PROVIDER_ADAPTER_READ_TIMEOUT:3s}
  # E5 (DECISIONS-2026-10-22): a bank admin creates a partner user directly and it is provisioned
  # at creation. The retired maker-checker step can be re-enabled without code.
  partner-onboarding:
    approval-required: ${IDENTITY_PARTNER_ONBOARDING_APPROVAL_REQUIRED:false}
  authorization:
    # E5 / E6: actions an INSURER_REPRESENTATIVE can never hold, whatever roles or entitlements say.
    # Strict seed (E9); extend here, never shorten without Deepali (security) sign-off.
    partner-representative:
      prohibited-actions:
        - partner_user.create
        - partner_user.bulk_import
      prohibited-action-suffixes:
        - .approve
  provisioning:
    enabled: ${IDENTITY_PROVISIONING_ENABLED:false}
    poll-interval: ${IDENTITY_PROVISIONING_POLL_INTERVAL:5000}
    initial-delay: ${IDENTITY_PROVISIONING_INITIAL_DELAY:5000}
    batch-size: 20
    # Parked (dead_lettered_at) and logged at ERROR after this many failures.
    max-attempts: ${IDENTITY_PROVISIONING_MAX_ATTEMPTS:10}
    # In-flight lease; must exceed batch-size x (connect + read) so a slow batch is not re-claimed.
    lease: 2m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.identity.authz: INFO

# Error contract (ADR-017 / EPIC-001). service-id is the registered id from
# 07-PLATFORM-ERROR-CONTRACT.md section 2.2 — it appears in every error response, log line and
# metric tag, so it is set once here rather than repeated as a literal at each throw site.
# boundary is architectural and permanent; expose-diagnostics is a debug switch, defaults off and
# is refused under the prod profile.
bank:
  error:
    service-id: authz
    layer: L5
    boundary: INTERNAL
