server:
  port: 8082

spring:
  application:
    name: identity-provider-adapter-service
  threads:
    virtual:
      enabled: true

identity:
  provider:
    keycloak:
      public-base-url: ${KEYCLOAK_PUBLIC_BASE_URL:http://localhost:8085}
      backchannel-base-url: ${KEYCLOAK_BACKCHANNEL_BASE_URL:http://localhost:8085}
      realm: ${KEYCLOAK_REALM:bank-insurance}
      client-id: ${KEYCLOAK_BFF_CLIENT_ID:workforce-bff}
      client-secret: ${KEYCLOAK_BFF_CLIENT_SECRET:local-workforce-bff-secret}
      redirect-uri: ${WORKFORCE_LOGIN_CALLBACK:http://localhost:8084/api/v1/auth/callback}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:identity-provider-adapter}
      admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:local-provider-adapter-secret}
      bank-identity-provider-hint: ${KEYCLOAK_BANK_IDP_HINT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.identity.provider: INFO

# Error contract (ADR-017 / EPIC-001). service-id is the registered id from
# 07-PLATFORM-ERROR-CONTRACT.md section 2.2 — it appears in every error response, log line and
# metric tag, so it is set once here rather than repeated as a literal at each throw site.
# boundary is architectural and permanent; expose-diagnostics is a debug switch, defaults off and
# is refused under the prod profile.
bank:
  error:
    service-id: idp-adapter
    layer: L5
    boundary: INTERNAL
