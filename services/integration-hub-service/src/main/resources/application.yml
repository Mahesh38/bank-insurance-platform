server:
  port: 8100

spring:
  application:
    name: integration-hub-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.integration.hub: INFO

bank:
  error:
    service-id: integration-hub
    layer: L5
    boundary: INTERNAL

integrationhub:
  internal-auth:
    callers:
      workforce-access-bff: ${INTEGRATIONHUB_BFF_INTERNAL_KEY:local-integrationhub-bff-internal-key}
    actor-callers:
      - workforce-access-bff
    privileges:
      workforce-access-bff:
        - "*"
