server:
  port: 8100

spring:
  application:
    name: integration-hub-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.integration.hub: INFO

bank:
  error:
    service-id: integration-hub
    layer: L5
    boundary: INTERNAL
