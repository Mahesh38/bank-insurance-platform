server:
  port: 8100

spring:
  application:
    name: integration-hub-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${HUB_DB_URL:jdbc:h2:mem:hub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    driver-class-name: ${HUB_DB_DRIVER:org.h2.Driver}
    username: ${HUB_DB_USER:sa}
    password: ${HUB_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.integration.hub: INFO

bank:
  error:
    service-id: integration-hub
    layer: L5
    boundary: INTERNAL

hub:
  onesb:
    base-url: ${ONESB_INTEGRATION_BASE_URL:http://localhost:8080}
    internal-service-key: ${ONESB_HUB_INTERNAL_KEY:local-onesb-hub-internal-key}
    connect-timeout-ms: 2000
    submit-read-timeout-ms: 25000
    poll-read-timeout-ms: 2000
  breaker:
    enabled: true
    failure-threshold: 3
    open-wait-ms: 30000
    half-open-success-threshold: 1
  reconciliation:
    uncertain-window: PT10M

integrationhub:
  internal-auth:
    callers:
      quotation-service: ${INTEGRATIONHUB_QUOTATION_INTERNAL_KEY:local-integrationhub-quotation-internal-key}
      proposal-service: ${INTEGRATIONHUB_PROPOSAL_INTERNAL_KEY:local-integrationhub-proposal-internal-key}
      workforce-access-bff: ${INTEGRATIONHUB_BFF_INTERNAL_KEY:local-integrationhub-bff-internal-key}
    actor-callers:
      - quotation-service
      - proposal-service
      - workforce-access-bff
    privileges:
      quotation-service:
        - "*"
      proposal-service:
        - "*"
      workforce-access-bff:
        - "*"
