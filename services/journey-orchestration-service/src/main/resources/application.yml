server:
  port: 8095

spring:
  application:
    name: journey-orchestration-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.journey: INFO

bank:
  error:
    service-id: journey-orchestration
    layer: L6
    boundary: INTERNAL
