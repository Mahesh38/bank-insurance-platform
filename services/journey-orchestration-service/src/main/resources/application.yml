server:
  port: 8095

spring:
  application:
    name: journey-orchestration-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.journey: INFO

bank:
  error:
    service-id: journey-orchestration
    layer: L6
    boundary: INTERNAL

journey:
  internal-auth:
    callers:
      workforce-access-bff: ${JOURNEY_BFF_INTERNAL_KEY:local-journey-bff-internal-key}
    actor-callers:
      - workforce-access-bff
    privileges:
      workforce-access-bff:
        - "*"
