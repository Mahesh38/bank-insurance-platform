server:
  port: 8091

spring:
  application:
    name: lead-service
  datasource:
    url: ${LEAD_SERVICE_DATASOURCE_URL:jdbc:h2:mem:lead_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${LEAD_SERVICE_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${LEAD_SERVICE_DATASOURCE_USERNAME:sa}
    password: ${LEAD_SERVICE_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # {vendor}: ux_lead_dedupe_open is a partial unique index on PostgreSQL, an H2 equivalent locally.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
    validate-on-migrate: true
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.lead: INFO

lead:
  authorization:
    # INV-ACT-01: Lead re-asks the PDP before create / assign. S-02 budget, fail closed.
    base-url: ${IDENTITY_AUTHORIZATION_BASE_URL:http://localhost:8083}
    decision-timeout: 300ms
    # This service's key for identity-authorization-service /internal/v1 (caller "lead-service").
    # Development-only default; shared environments inject LEAD_AUTHZ_INTERNAL_KEY.
    internal-key: ${LEAD_AUTHZ_INTERNAL_KEY:local-authz-lead-internal-key}
  crypto:
    # Development-only default: 32 zero bytes. Shared environments inject a KMS-managed key.
    field-key: ${LEAD_FIELD_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    key-id: ${LEAD_FIELD_KEY_ID:local-dev}
  # LEAD.EXCEPTION evaluator (D2): the rule engine. Tests may select "stub" (test sources only);
  # ProductionSafetyGuard refuses anything but "engine" under prod / uat.
  exception-rules: ${LEAD_EXCEPTION_RULES:engine}
  # Facts behind LEAD.EXCEPTION (EH-INT-001..005). "unknown" reports every fact unknown, so every
  # lead blocks (BRD 24.3 column I) until the real source adapters exist.
  exception-facts: ${LEAD_EXCEPTION_FACTS:unknown}
  rule-sets:
    # ADR-024: "http" = published versions from administration-config-service (required under
    # prod / uat); "classpath" = the unapproved seeds in libs/bank-rule-engine, local and test only.
    source: ${LEAD_RULE_SETS_SOURCE:classpath}
    base-url: ${ADMINISTRATION_CONFIG_BASE_URL:http://localhost:8104}
    timeout: 300ms
    cache-ttl: 60s
  # Ageing sweep (E7). The horizon itself is rule set LEAD.POLICY (expiryDays per lob); only the
  # schedule is a property.
  expiry:
    enabled: ${LEAD_EXPIRY_ENABLED:true}
    initial-delay: PT1M
    interval: ${LEAD_EXPIRY_INTERVAL:PT15M}
    batch-size: 200
    max-batches-per-run: 50

bank:
  error:
    service-id: lead
    layer: L5
    boundary: INTERNAL
