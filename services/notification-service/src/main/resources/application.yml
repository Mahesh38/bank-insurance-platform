server:
  port: 8102

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.notification: INFO

bank:
  error:
    service-id: notification
    layer: L5
    boundary: INTERNAL

notification:
  internal-auth:
    callers:
      workforce-access-bff: ${NOTIFICATION_BFF_INTERNAL_KEY:local-notification-bff-internal-key}
    actor-callers:
      - workforce-access-bff
    privileges:
      workforce-access-bff:
        - "*"
