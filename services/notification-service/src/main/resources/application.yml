server:
  port: 8102

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.notification: INFO

bank:
  error:
    service-id: notification
    layer: L5
    boundary: INTERNAL
