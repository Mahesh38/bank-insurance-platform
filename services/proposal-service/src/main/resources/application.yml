server:
  port: 8097

spring:
  application:
    name: proposal-service
  datasource:
    url: ${PROPOSAL_SERVICE_DATASOURCE_URL:jdbc:h2:mem:proposal_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${PROPOSAL_SERVICE_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${PROPOSAL_SERVICE_DATASOURCE_USERNAME:sa}
    password: ${PROPOSAL_SERVICE_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # {vendor}: partial unique index on PostgreSQL, an H2 equivalent locally.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
    validate-on-migrate: true
  threads:
    virtual:
      enabled: true

# DB-DEC-0005 — working proposal in DynamoDB until payment (schemas/20-dynamodb-working-payload.md).
proposal:
  working-store:
    table-name: ${PROPOSAL_WORKING_TABLE:local-proposal-working}
    region: ${AWS_REGION:ap-south-1}
    # Only honoured in the local / test profiles (schemas/20 §5).
    endpoint-override: ${AWS_DYNAMODB_ENDPOINT:}
    retention-working: ${PROPOSAL_RET_WORKING:90d}
    retention-after-materialize: 30d
    idempotency-ttl: 24h
    outbox-ttl: 7d
  envelope:
    # kms everywhere real; local (static key) only in the local / test profiles.
    provider: ${PROPOSAL_ENVELOPE_PROVIDER:kms}
    kms-key-id: ${PROPOSAL_ENVELOPE_KMS_KEY_ID:alias/local-proposal-working}
    data-key-cache-ttl: 5m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.proposal: INFO

bank:
  error:
    service-id: proposal
    layer: L5
    boundary: INTERNAL
