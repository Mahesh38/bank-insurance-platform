server:
  port: 8097

spring:
  application:
    name: proposal-service
  datasource:
    url: ${PROPOSAL_SERVICE_DATASOURCE_URL:jdbc:h2:mem:proposal_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${PROPOSAL_SERVICE_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${PROPOSAL_SERVICE_DATASOURCE_USERNAME:sa}
    password: ${PROPOSAL_SERVICE_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.proposal: INFO

bank:
  error:
    service-id: proposal
    layer: L5
    boundary: INTERNAL
