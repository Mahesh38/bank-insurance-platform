server:
  port: 8096

spring:
  application:
    name: quotation-service
  datasource:
    url: ${QUOTATION_SERVICE_DATASOURCE_URL:jdbc:h2:mem:quotation_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${QUOTATION_SERVICE_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${QUOTATION_SERVICE_DATASOURCE_USERNAME:sa}
    password: ${QUOTATION_SERVICE_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    # {vendor}: partial unique indexes on PostgreSQL, an H2 equivalent locally.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
    validate-on-migrate: true
  threads:
    virtual:
      enabled: true

# DB-DEC-0005 — working quote in DynamoDB until payment (schemas/20-dynamodb-working-payload.md).
quotation:
  internal-auth:
    callers:
      workforce-access-bff: ${QUOTATION_BFF_INTERNAL_KEY:local-quotation-bff-internal-key}
    actor-callers:
      - workforce-access-bff
    privileges:
      workforce-access-bff:
        - "*"
  working-store:
    table-name: ${QUOTATION_WORKING_TABLE:local-quotation-working}
    region: ${AWS_REGION:ap-south-1}
    # Only honoured in the local / test profiles (schemas/20 §5).
    endpoint-override: ${AWS_DYNAMODB_ENDPOINT:}
    retention-working: ${QUOTATION_RET_WORKING:90d}
    retention-after-materialize: 30d
    idempotency-ttl: 24h
    # ADR-025 §3: an OUTBOX item has no ttl until published; then publish + outbox-ttl.
    outbox-ttl: 7d
    # Partitions of the sparse GSI_OUTBOX_PENDING index the sweeper queries (no Scan).
    outbox-pending-shards: 4
  # ADR-025 §3, §5 — publishing the DynamoDB OUTBOX items. none = items wait unpublished.
  outbox:
    publisher: ${QUOTATION_EVENT_PUBLISHER:none}
    sweeper:
      enabled: ${QUOTATION_OUTBOX_SWEEPER_ENABLED:false}
      interval: 1m
      min-age: 5m
      batch-size: 100
    kafka:
      bootstrap-servers: ${QUOTATION_KAFKA_BOOTSTRAP_SERVERS:}
      env: ${PLATFORM_ENV:local}
      ack-timeout: 10s
  envelope:
    # kms everywhere real; local (static key) only in the local / test profiles.
    provider: ${QUOTATION_ENVELOPE_PROVIDER:kms}
    kms-key-id: ${QUOTATION_ENVELOPE_KMS_KEY_ID:alias/local-quotation-working}
    data-key-cache-ttl: 5m

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.quotation: INFO

bank:
  error:
    service-id: quotation
    layer: L5
    boundary: INTERNAL
