server:
  port: 8103

spring:
  application:
    name: reporting-mis-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.reporting: INFO

bank:
  error:
    service-id: reporting
    layer: L5
    boundary: INTERNAL

reporting:
  internal-auth:
    callers:
      workforce-access-bff: ${REPORTING_BFF_INTERNAL_KEY:local-reporting-bff-internal-key}
    actor-callers:
      - workforce-access-bff
    privileges:
      workforce-access-bff:
        - "*"
