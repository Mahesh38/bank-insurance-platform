server:
  port: 8093

spring:
  application:
    name: suitability-service
  datasource:
    url: ${SUITABILITY_SERVICE_DATASOURCE_URL:jdbc:h2:mem:suitability_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SUITABILITY_SERVICE_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SUITABILITY_SERVICE_DATASOURCE_USERNAME:sa}
    password: ${SUITABILITY_SERVICE_DATASOURCE_PASSWORD:}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: suitability
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.platform.suitability: INFO

bank:
  error:
    service-id: suitability
    layer: L5
    boundary: INTERNAL

suitability:
  internal-auth:
    callers:
      workforce-access-bff: ${SUITABILITY_BFF_INTERNAL_KEY:local-suitability-bff-internal-key}
    actor-callers:
      - workforce-access-bff
    privileges:
      workforce-access-bff:
        - "*"
  journey:
    field-key: ${SUITABILITY_FIELD_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    key-id: local-dev
    lock-minutes: 15
    consent-base-url: ${CONSENT_SERVICE_BASE_URL:http://localhost:8092}
    consent-internal-key: ${CONSENT_SUITABILITY_INTERNAL_KEY:local-consent-suitability-internal-key}
    occupations:
      - Salaried
      - Self-employed
      - Professional
      - Retired
      - Others
    educations:
      - Below graduate
      - Graduate
      - Postgraduate
      - Professional
      - Others
    income-bands:
      - label: "Below ₹5L"
        floor-inr: 0
      - label: "₹5L – ₹10L"
        floor-inr: 500000
      - label: "₹10L – ₹20L"
        floor-inr: 1000000
      - label: "₹20L and above"
        floor-inr: 2000000
    derivation-rule-id: INTERIM-BRD-22
    derivation-frequency: ANNUAL
    derivation-premium-paying-term: "10"
    derivation-policy-term: "20"
    derivation-premium-percent: 10
