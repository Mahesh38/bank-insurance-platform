server:
  port: 8084

spring:
  application:
    name: workforce-access-bff
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  threads:
    virtual:
      enabled: true

workforce:
  downstream:
    provider-adapter-base-url: ${IDENTITY_PROVIDER_ADAPTER_BASE_URL:http://localhost:8082}
    provider-adapter-internal-key: ${IDENTITY_ADAPTER_INTERNAL_SHARED_SECRET:local-idp-adapter-internal-key}
    authorization-service-base-url: ${IDENTITY_AUTHORIZATION_BASE_URL:http://localhost:8083}
    lead-service-base-url: ${LEAD_SERVICE_BASE_URL:http://localhost:8091}
    customer-service-base-url: ${CUSTOMER_SERVICE_BASE_URL:http://localhost:8090}
    lead-mode: ${LEAD_DOWNSTREAM_MODE:stub}
    customer-mode: ${CUSTOMER_DOWNSTREAM_MODE:stub}
    # Caller key for identity-authorization-service /internal/v1 (caller "workforce-access-bff").
    authorization-service-internal-key: ${IDENTITY_AUTHZ_BFF_INTERNAL_KEY:local-authz-bff-internal-key}
    # Seam budgets (03 §5). Defaults live in DownstreamTimeouts; listed here so they are visible.
    timeouts:
      lead: { connect: 500ms, read: 2s }              # S-20
      customer: { connect: 500ms, read: 4s }          # CBS S-05 inside the S-01 edge budget
      authorization: { connect: 500ms, read: 2s }     # identity resolve
      identity-provider: { connect: 1s, read: 4500ms } # login path, inside the 5 s edge (S-01)
  authorization:
    decision-timeout: 300ms                           # S-02 PDP, fail closed
  session:
    store: ${WORKFORCE_SESSION_STORE:memory}
    cookie-name: WORKFORCE_SESSION
    # Development-only default: 32 zero bytes. Production must inject a KMS-managed random key.
    encryption-key: ${WORKFORCE_SESSION_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    pending-login-ttl: 5m
    completion-code-ttl: 1m
    session-ttl: 8h
    allowed-return-uris:
      - ${WORKFORCE_WEB_RETURN_URI:http://localhost:3000/auth/complete}
      - ${WORKFORCE_NATIVE_RETURN_URI:bankinsurance://auth-complete}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bank.workforce.bff: INFO

# Error contract (ADR-017 / EPIC-001). service-id is the registered id from
# 07-PLATFORM-ERROR-CONTRACT.md section 2.2 — it appears in every error response, log line and
# metric tag, so it is set once here rather than repeated as a literal at each throw site.
# boundary is architectural and permanent; expose-diagnostics is a debug switch, defaults off and
# is refused under the prod profile.
bank:
  error:
    service-id: bff
    layer: L4
    boundary: PUBLIC
